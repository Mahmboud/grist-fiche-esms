<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord ESMS V5 — Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1680px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}.loading strong,.error strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px}
.shell{display:grid;grid-template-columns:350px minmax(0,1fr);gap:12px}.shell.collapsed{grid-template-columns:54px minmax(0,1fr)}.sidebar{position:sticky;top:10px;height:calc(100vh - 20px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.shell.collapsed .sidebar{align-items:center}.sideHead{padding:14px;border-bottom:1px solid var(--line)}.shell.collapsed .sideHead{padding:10px 6px;width:100%}.sideTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.sideTitle{font-size:14px;font-weight:850}.sideSub{font-size:11px;color:var(--muted);margin-top:2px}.collapseBtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-weight:900}.shell.collapsed .sideTitle,.shell.collapsed .sideSub,.shell.collapsed .search,.shell.collapsed .filters,.shell.collapsed .tools,.shell.collapsed .listMeta,.shell.collapsed .list{display:none}.search{width:100%;margin-top:10px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;outline:0}.search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:7px;font-size:11px}.tools{display:flex;gap:7px;margin-top:7px}.ghost{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:700;color:#475569}.listMeta{padding:8px 13px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}.list{overflow:auto;padding:6px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:9px 10px;color:var(--text)}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.itemName{font-size:12px;font-weight:820;line-height:1.3}.itemMeta{margin-top:3px;font-size:10.5px;color:var(--muted);line-height:1.3}.highlight{background:#fef3c7;border-radius:3px;padding:0 1px}
.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--shadow)}.kpiLabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:18px;font-weight:900;margin-top:2px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);margin-bottom:10px}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:4px}h1{font-size:clamp(20px,2.6vw,30px);line-height:1.12;margin:0}.subtitle{font-size:12.5px;color:var(--muted);margin-top:6px}.chips,.badges,.actions,.nav{display:flex;flex-wrap:wrap;gap:6px}.chips{margin-top:10px}.chip,.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--blueSoft);color:var(--blue2);font-size:10.5px;font-weight:750}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.amber{background:var(--amberSoft);color:var(--amber)}.badge.gray{background:#f1f5f9;color:#475569}.actions{margin-top:11px}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#1e293b;border-radius:9px;padding:7px 10px;text-decoration:none;font-size:11px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.nav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:750}.nav button:disabled{opacity:.4;cursor:default}.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:750;color:#475569}.tab.active{background:var(--blueSoft);color:var(--blue2);border-color:#bfdbfe}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:10px;align-items:start}.stack{display:flex;flex-direction:column;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.cardHead{padding:12px 14px 7px;display:flex;justify-content:space-between;align-items:center}.cardTitle{font-size:12.5px;font-weight:850;color:#334155}.count{font-size:10px;font-weight:850;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:3px 7px}.cardBody{padding:5px 14px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px 10px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:3px}.value{font-size:12px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.value.soft{font-weight:500;line-height:1.4}.contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.person{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}.personTop{display:flex;gap:8px}.avatar{width:29px;height:29px;border-radius:8px;background:var(--blueSoft);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex:0 0 auto}.personName{font-size:12px;font-weight:850}.personRole{font-size:10.5px;color:var(--muted);margin-top:1px}.email{font-size:10.5px;color:var(--blue2);text-decoration:none;overflow-wrap:anywhere}.smallBtn{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:5px 7px;text-decoration:none;font-size:10px;font-weight:750}.timeline{display:flex;flex-direction:column}.event{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #eef2f7}.event:last-child{border-bottom:0}.eventDate{font-size:10px;color:var(--muted);font-weight:750}.eventTitle{font-size:11.5px;font-weight:800}.eventDesc{font-size:11px;color:#475569;margin-top:2px;line-height:1.35;white-space:pre-wrap}.muted{font-size:11.2px;color:var(--muted)}.map{width:100%;height:260px;border:0;display:block;background:#eef2f7}.detailsBox{border-top:1px solid #eef2f7}.detailsBox summary{cursor:pointer;padding:10px 14px;font-size:11.5px;font-weight:800;color:#475569}.detailsBox .inner{padding:0 14px 12px}.footer{font-size:9px;color:#94a3b8;padding:6px 2px}
@media(max-width:1100px){.shell{grid-template-columns:300px minmax(0,1fr)}.shell.collapsed{grid-template-columns:54px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){body{padding:6px}.shell,.shell.collapsed{grid-template-columns:1fr}.sidebar{position:static;height:400px}.shell.collapsed .sidebar{height:auto}.contacts,.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.event{grid-template-columns:1fr;gap:2px}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main id="app"><div class="loading"><strong>Chargement du tableau de bord ESMS…</strong>Connexion à Grist.</div></main>
<script>
const app=document.getElementById('app');
const state={tables:null,selectedId:null,query:'',ugecam:'',site:'',sort:'name',collapsed:false,tab:'info'};
const T={esms:'ESMS_Liste_UGECAM_',contacts:'CONTACTS',ugecam:'UGECAM',sites:'SITES_nomenclature_UGECAM',interactions:'Interactions'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);if(!k.length)return[];const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function refList(v){if(empty(v))return[];if(typeof v==='number')return v?[v]:[];if(typeof v==='string'){try{return refList(JSON.parse(v))}catch{return[]}}if(!Array.isArray(v))return[];const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.map(Number).filter(x=>Number.isFinite(x)&&x>0)}
function bool(v){return v===true||v===1||v==='1'||v==='True'||v==='TRUE'||(Array.isArray(v)&&v.length===2&&v[0]==='B'&&Boolean(v[1]))}
function listText(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).map(String)}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return listText(p)}catch{}return[v]}return[String(v)]}
function txt(v){if(empty(v))return'';if(typeof v==='string'||typeof v==='number')return String(v);if(Array.isArray(v))return listText(v).join(', ');return String(v)}
function dt(v){if(empty(v))return'';const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);if(Number.isNaN(d.getTime()))return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}
function field(l,v,full=false,soft=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value ${soft?'soft':''}">${esc(v)}</div></div>`}
function chip(v){return empty(v)?'':`<span class="chip">${esc(v)}</span>`}
function badge(v,c='gray'){return`<span class="badge ${c}">${esc(v)}</span>`}
function initials(n,p){return((p||'').slice(0,1)+(n||'').slice(0,1)).toUpperCase()||'•'}
function hi(s){const q=state.query.trim();if(!q)return esc(s);const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return esc(s).replace(re,'<span class="highlight">$1</span>')}
async function fetchTable(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
async function load(){const [esms,contacts,ugecam,sites,interactions]=await Promise.all([fetchTable(T.esms),fetchTable(T.contacts),fetchTable(T.ugecam),fetchTable(T.sites),fetchTable(T.interactions)]);state.tables={esms,contacts,ugecam,sites,interactions}}
function labels(r){return{ugecam:txt(byId(state.tables.ugecam,r.UGECAM)?.UGECAM),site:txt(byId(state.tables.sites,r.SITES_nomenclature_UGECAM)?.SITES_nomenclature_UGECAM),name:txt(r.ESMS_raison_sociale)||'Établissement',finess:txt(r.FINESS),type:txt(r.Typologie_ESMS)}}
function contactCard(c){const b=[];if(bool(c.Referent_DUI))b.push(badge('Référent DUI','green'));if(bool(c.ACCES))b.push(badge('Accès','green'));if(bool(c.Invite_aux_comites))b.push(badge('Invité comités','amber'));if(bool(c.CAMSP_CMPP))b.push(badge('CAMSP / CMPP'));if(bool(c.MEDICALISE))b.push(badge('Médicalisé'));if(bool(c.ENFANCE_SERVICES))b.push(badge('Enfance / services'));const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact';const email=txt(c.EMAIL);return`<article class="person"><div class="personTop"><div class="avatar">${esc(initials(c.NOM,c.PRENOM))}</div><div><div class="personName">${esc(name)}</div><div class="personRole">${esc(c.FONCTION||'Fonction non renseignée')}</div></div></div>${b.length?`<div class="badges">${b.join('')}</div>`:''}${email?`<a class="email" href="mailto:${esc(email)}">${esc(email)}</a><div><a class="smallBtn" href="mailto:${esc(email)}">✉ Envoyer un mail</a></div>`:''}</article>`}
function interactions(ids){const s=new Set(ids.map(Number));return state.tables.interactions.filter(r=>refList(r.CONTACT).some(id=>s.has(id))).sort((a,b)=>Number(b.DATE_INTERACTION||0)-Number(a.DATE_INTERACTION||0)).slice(0,10)}
function eventHtml(r){const title=[listText(r.TYPE).join(' • '),txt(r.Theme)].filter(Boolean).join(' — ')||'Interaction';return`<div class="event"><div class="eventDate">${esc(dt(r.DATE_INTERACTION)||'Date inconnue')}</div><div><div class="eventTitle">${esc(title)}</div>${r.DESCRIPTION?`<div class="eventDesc">${esc(r.DESCRIPTION)}</div>`:''}</div></div>`}
function filtered(){const q=state.query.trim().toLowerCase();let a=state.tables.esms.filter(r=>{const l=labels(r);const qok=!q||[l.name,l.finess,l.ugecam,l.site,l.type,txt(r.ADRESSE),txt(r.Directeur)].join(' ').toLowerCase().includes(q);return qok&&(!state.ugecam||l.ugecam===state.ugecam)&&(!state.site||l.site===state.site)});a.sort((x,y)=>{const A=labels(x),B=labels(y);if(state.sort==='site')return A.site.localeCompare(B.site,'fr')||A.name.localeCompare(B.name,'fr');if(state.sort==='finess')return A.finess.localeCompare(B.finess,'fr');return A.name.localeCompare(B.name,'fr')});return a}
function syncCursor(id){try{if(grist?.setCursorPos)grist.setCursorPos({rowId:Number(id)});else if(grist?.docApi?.setCursorPos)grist.docApi.setCursorPos({rowId:Number(id)})}catch(e){}}
function sidebar(){const all=state.tables.esms.map(labels),u=[...new Set(all.map(x=>x.ugecam).filter(Boolean))].sort(),s=[...new Set(all.filter(x=>!state.ugecam||x.ugecam===state.ugecam).map(x=>x.site).filter(Boolean))].sort(),items=filtered();return`<aside class="sidebar"><div class="sideHead"><div class="sideTop"><div><div class="sideTitle">Établissements ESMS</div><div class="sideSub">Recherche, filtres et navigation</div></div><button class="collapseBtn" id="collapse">${state.collapsed?'→':'←'}</button></div><input id="search" class="search" placeholder="Nom, FINESS, ville, directeur…" value="${esc(state.query)}"><div class="filters"><select id="filterU"><option value="">Toutes les UGECAM</option>${u.map(x=>`<option ${x===state.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="filterS"><option value="">Tous les sites</option>${s.map(x=>`<option ${x===state.site?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="tools"><select id="sort" class="ghost"><option value="name" ${state.sort==='name'?'selected':''}>Tri : nom</option><option value="site" ${state.sort==='site'?'selected':''}>Tri : site</option><option value="finess" ${state.sort==='finess'?'selected':''}>Tri : FINESS</option></select><button id="reset" class="ghost">Réinitialiser</button></div></div><div class="listMeta"><span>${items.length} établissement${items.length>1?'s':''}</span><span>${state.selectedId?'1 sélectionné':'aucune sélection'}</span></div><div class="list">${items.length?items.map(r=>{const l=labels(r);return`<button class="item ${Number(r.id)===Number(state.selectedId)?'active':''}" data-id="${r.id}"><div class="itemName">${hi(l.name)}</div><div class="itemMeta">${esc(l.site||'Site non renseigné')} • FINESS ${esc(l.finess||'—')}</div></button>`}).join(''):'<div class="muted" style="padding:12px">Aucun résultat.</div>'}</div></aside>`}
function mapUrl(r){const lat=Number(r.Latitude),lon=Number(r.Longitude);if(Number.isFinite(lat)&&Number.isFinite(lon))return`https://www.openstreetmap.org/export/embed.html?bbox=${lon-.025}%2C${lat-.018}%2C${lon+.025}%2C${lat+.018}&layer=mapnik&marker=${lat}%2C${lon}`;return''}
function detail(){const r=byId(state.tables.esms,state.selectedId);if(!r)return'<div class="loading"><strong>Sélectionnez un établissement</strong>La fiche apparaîtra ici.</div>';const l=labels(r),ids=refList(r.CONTACTS),contacts=ids.map(id=>byId(state.tables.contacts,id)).filter(Boolean),ints=interactions(ids),ratt=refList(r.Rattachement_site_UGECAM).map(id=>byId(state.tables.esms,id)).filter(Boolean),arr=filtered(),idx=arr.findIndex(x=>Number(x.id)===Number(r.id)),prev=idx>0?arr[idx-1]:null,next=idx>=0&&idx<arr.length-1?arr[idx+1]:null,map=mapUrl(r);const content=state.tab==='contacts'?`<section class="card"><div class="cardHead"><div class="cardTitle">Contacts associés</div><span class="count">${contacts.length}</span></div><div class="cardBody">${contacts.length?`<div class="contacts">${contacts.map(contactCard).join('')}</div>`:'<div class="muted">Aucun contact associé.</div>'}</div></section>`:state.tab==='interactions'?`<section class="card"><div class="cardHead"><div class="cardTitle">Interactions récentes</div><span class="count">${ints.length}</span></div><div class="cardBody">${ints.length?`<div class="timeline">${ints.map(eventHtml).join('')}</div>`:'<div class="muted">Aucune interaction récente.</div>'}</div></section>`:`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Informations générales</div></div><div class="cardBody"><div class="grid">${field('Raison sociale',l.name)}${field('FINESS',l.finess)}${field('UGECAM',l.ugecam)}${field('Site',l.site)}${field('Typologie',l.type)}${field('Directeur',r.Directeur)}${field('Adresse',r.ADRESSE,true,true)}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Contacts associés</div><span class="count">${contacts.length}</span></div><div class="cardBody">${contacts.length?`<div class="contacts">${contacts.map(contactCard).join('')}</div>`:'<div class="muted">Aucun contact associé.</div>'}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Interactions récentes</div><span class="count">${ints.length}</span></div><div class="cardBody">${ints.length?`<div class="timeline">${ints.slice(0,5).map(eventHtml).join('')}</div>`:'<div class="muted">Aucune interaction récente.</div>'}</div></section></div><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Localisation</div></div>${map?`<iframe class="map" loading="lazy" src="${map}"></iframe>`:`<div class="cardBody"><div class="muted">Coordonnées non disponibles.</div></div>`}</section><section class="card"><details class="detailsBox" ${ratt.length?'open':''}><summary>Rattachement ${ratt.length?`(${ratt.length})`:''}</summary><div class="inner">${ratt.length?ratt.map(x=>field('Établissement',txt(x.ESMS_raison_sociale),true,true)).join(''):'<div class="muted">Aucun rattachement renseigné.</div>'}</div></details><details class="detailsBox"><summary>Notes</summary><div class="inner">${txt(r.Notes)?`<div class="value soft">${esc(txt(r.Notes))}</div>`:'<div class="muted">Aucune note renseignée.</div>'}</div></details><details class="detailsBox"><summary>Traçabilité</summary><div class="inner"><div class="grid">${field('Créé par',r.Cree_par,true)}${field('Dernière mise à jour',dt(r.Derniere_mise_a_jour),true)}${field('Modifié par',r.Derniere_mise_a_jour_par,true)}</div></div></details></section></div></div>`;return`<div class="kpis"><div class="kpi"><div class="kpiLabel">ESMS total</div><div class="kpiValue">${state.tables.esms.length}</div></div><div class="kpi"><div class="kpiLabel">Résultats</div><div class="kpiValue">${arr.length}</div></div><div class="kpi"><div class="kpiLabel">Sites</div><div class="kpiValue">${new Set(arr.map(labels).map(x=>x.site).filter(Boolean)).size}</div></div><div class="kpi"><div class="kpiLabel">UGECAM</div><div class="kpiValue">${new Set(arr.map(labels).map(x=>x.ugecam).filter(Boolean)).size}</div></div></div><section class="hero"><div class="heroTop"><div><div class="eyebrow">Fiche établissement</div><h1>${esc(l.name)}</h1><div class="subtitle">${esc([l.ugecam,l.site].filter(Boolean).join(' • '))}</div><div class="chips">${chip(l.type)}${l.finess?chip('FINESS '+l.finess):''}</div><div class="actions">${r.ADRESSE?`<a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.ADRESSE)}">📍 Ouvrir la carte</a>`:''}</div></div><div class="nav"><button id="prev" ${prev?'':'disabled'}>← Précédent</button><button id="next" ${next?'':'disabled'}>Suivant →</button></div></div></section><div class="tabs"><button class="tab ${state.tab==='info'?'active':''}" data-tab="info">Informations</button><button class="tab ${state.tab==='contacts'?'active':''}" data-tab="contacts">Contacts (${contacts.length})</button><button class="tab ${state.tab==='interactions'?'active':''}" data-tab="interactions">Interactions (${ints.length})</button></div>${content}<div class="footer">Tableau de bord ESMS V5 • données lues directement depuis Grist</div>`}
function bind(){document.getElementById('collapse')?.addEventListener('click',()=>{state.collapsed=!state.collapsed;render()});const q=document.getElementById('search');q?.addEventListener('input',e=>{state.query=e.target.value;render()});document.getElementById('filterU')?.addEventListener('change',e=>{state.ugecam=e.target.value;state.site='';render()});document.getElementById('filterS')?.addEventListener('change',e=>{state.site=e.target.value;render()});document.getElementById('sort')?.addEventListener('change',e=>{state.sort=e.target.value;render()});document.getElementById('reset')?.addEventListener('click',()=>{state.query='';state.ugecam='';state.site='';state.sort='name';render()});document.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{state.selectedId=Number(b.dataset.id);syncCursor(state.selectedId);render();document.querySelector('.item.active')?.scrollIntoView({block:'nearest'})}));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}));const a=filtered(),idx=a.findIndex(x=>Number(x.id)===Number(state.selectedId));document.getElementById('prev')?.addEventListener('click',()=>{if(idx>0){state.selectedId=Number(a[idx-1].id);syncCursor(state.selectedId);render()}});document.getElementById('next')?.addEventListener('click',()=>{if(idx>=0&&idx<a.length-1){state.selectedId=Number(a[idx+1].id);syncCursor(state.selectedId);render()}})}
function render(){if(!state.tables)return;app.innerHTML=`<div class="shell ${state.collapsed?'collapsed':''}">${sidebar()}<section class="detail">${detail()}</section></div>`;bind()}
grist.ready({requiredAccess:'full'});grist.onRecord(async rec=>{try{if(!state.tables)await load();if(rec?.id)state.selectedId=Number(rec.id);if(!state.selectedId&&state.tables.esms[0])state.selectedId=Number(state.tables.esms[0].id);render()}catch(e){console.error(e);app.innerHTML=`<div class="error"><strong>Erreur de chargement</strong>${esc(e?.message||e)}</div>`}});
</script></body></html>
