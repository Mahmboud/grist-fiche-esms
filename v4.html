<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord ESMS — Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}.loading strong,.error strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px}.shell{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px}.sidebar{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:15px;border-bottom:1px solid var(--line)}.sideTitle{font-size:15px;font-weight:850}.sideSub{font-size:11.5px;color:var(--muted);margin-top:3px}.search{width:100%;margin-top:11px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;outline:0}.search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:7px;font-size:11.5px}.tools{display:flex;gap:7px;margin-top:7px}.ghost{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:11.5px;font-weight:700;color:#475569}.listMeta{padding:8px 14px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between}.list{overflow:auto;padding:7px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:11px;padding:9px 10px;color:var(--text)}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.itemName{font-size:12.5px;font-weight:820;line-height:1.35}.itemMeta{margin-top:3px;font-size:10.8px;color:var(--muted);line-height:1.35}.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.kpiLabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:20px;font-weight:900;margin-top:2px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{font-size:clamp(21px,2.8vw,32px);line-height:1.12;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:7px}.chips,.badges,.actions,.nav{display:flex;flex-wrap:wrap;gap:6px}.chips{margin-top:12px}.chip,.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--blueSoft);color:var(--blue2);font-size:11px;font-weight:750}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.amber{background:var(--amberSoft);color:var(--amber)}.badge.gray{background:#f1f5f9;color:#475569}.actions{margin-top:13px}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#1e293b;border-radius:9px;padding:7px 10px;text-decoration:none;font-size:11.5px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.nav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:750}.nav button:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:12px;align-items:start}.stack{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.cardHead{padding:13px 15px 7px;display:flex;justify-content:space-between;align-items:center}.cardTitle{font-size:13px;font-weight:850;color:#334155}.count{font-size:10.5px;font-weight:850;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:3px 7px}.cardBody{padding:6px 15px 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px 11px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:4px}.value{font-size:12.5px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.value.soft{font-weight:500;line-height:1.45}.contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;flex-direction:column;gap:7px}.personTop{display:flex;gap:8px}.avatar{width:31px;height:31px;border-radius:9px;background:var(--blueSoft);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;flex:0 0 auto}.personName{font-size:12.5px;font-weight:850}.personRole{font-size:11px;color:var(--muted);margin-top:1px}.email{font-size:11px;color:var(--blue2);text-decoration:none;overflow-wrap:anywhere}.smallBtn{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:5px 7px;text-decoration:none;font-size:10.5px;font-weight:750}.timeline{display:flex;flex-direction:column}.event{display:grid;grid-template-columns:82px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #eef2f7}.event:last-child{border-bottom:0}.eventDate{font-size:10.5px;color:var(--muted);font-weight:750}.eventTitle{font-size:12px;font-weight:800}.eventDesc{font-size:11.5px;color:#475569;margin-top:2px;line-height:1.4;white-space:pre-wrap}.muted{font-size:11.8px;color:var(--muted)}.map{width:100%;height:235px;border:0;display:block;background:#eef2f7}.footer{font-size:9.5px;color:#94a3b8;padding:7px 2px}.emptyDetail{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:55px 20px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.shell{grid-template-columns:300px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){body{padding:7px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:430px}.contacts,.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.event{grid-template-columns:1fr;gap:2px}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main id="app"><div class="loading"><strong>Chargement du tableau de bord ESMS…</strong>Connexion à Grist.</div></main>
<script>
const app=document.getElementById('app');
const state={tables:null,selectedId:null,query:'',ugecam:'',site:'',sort:'name'};
const T={esms:'ESMS_Liste_UGECAM_',contacts:'CONTACTS',ugecam:'UGECAM',sites:'SITES_nomenclature_UGECAM',interactions:'Interactions'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);if(!k.length)return[];const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function refList(v){if(empty(v))return[];if(typeof v==='number')return v?[v]:[];if(typeof v==='string'){try{return refList(JSON.parse(v))}catch{return[]}}if(!Array.isArray(v))return[];const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.map(Number).filter(x=>Number.isFinite(x)&&x>0)}
function bool(v){return v===true||v===1||v==='1'||v==='True'||v==='TRUE'||(Array.isArray(v)&&v.length===2&&v[0]==='B'&&Boolean(v[1]))}
function listText(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).map(String)}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return listText(p)}catch{}return[v]}return[String(v)]}
function txt(v){if(empty(v))return'';if(typeof v==='string'||typeof v==='number')return String(v);if(Array.isArray(v))return listText(v).join(', ');return String(v)}
function dt(v){if(empty(v))return'';const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);if(Number.isNaN(d.getTime()))return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}
function field(l,v,full=false,soft=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value ${soft?'soft':''}">${esc(v)}</div></div>`}
function chip(v){return empty(v)?'':`<span class="chip">${esc(v)}</span>`}
function badge(v,c='gray'){return`<span class="badge ${c}">${esc(v)}</span>`}
function initials(n,p){return((p||'').slice(0,1)+(n||'').slice(0,1)).toUpperCase()||'•'}
async function fetchTable(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
async function load(){const [esms,contacts,ugecam,sites,interactions]=await Promise.all([fetchTable(T.esms),fetchTable(T.contacts),fetchTable(T.ugecam),fetchTable(T.sites),fetchTable(T.interactions)]);state.tables={esms,contacts,ugecam,sites,interactions}}
function labels(r){return{ugecam:txt(byId(state.tables.ugecam,r.UGECAM)?.UGECAM),site:txt(byId(state.tables.sites,r.SITES_nomenclature_UGECAM)?.SITES_nomenclature_UGECAM),name:txt(r.ESMS_raison_sociale)||'Établissement',finess:txt(r.FINESS),type:txt(r.Typologie_ESMS)}}
function contactCard(c){const b=[];if(bool(c.Referent_DUI))b.push(badge('Référent DUI','green'));if(bool(c.ACCES))b.push(badge('Accès','green'));if(bool(c.Invite_aux_comites))b.push(badge('Invité comités','amber'));if(bool(c.CAMSP_CMPP))b.push(badge('CAMSP / CMPP'));if(bool(c.MEDICALISE))b.push(badge('Médicalisé'));if(bool(c.ENFANCE_SERVICES))b.push(badge('Enfance / services'));const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact';const email=txt(c.EMAIL);return`<article class="person"><div class="personTop"><div class="avatar">${esc(initials(c.NOM,c.PRENOM))}</div><div><div class="personName">${esc(name)}</div><div class="personRole">${esc(c.FONCTION||'Fonction non renseignée')}</div></div></div>${b.length?`<div class="badges">${b.join('')}</div>`:''}${email?`<a class="email" href="mailto:${esc(email)}">${esc(email)}</a><div><a class="smallBtn" href="mailto:${esc(email)}">✉ Envoyer un mail</a></div>`:''}</article>`}
function interactions(ids){const s=new Set(ids.map(Number));return state.tables.interactions.filter(r=>refList(r.CONTACT).some(id=>s.has(id))).sort((a,b)=>Number(b.DATE_INTERACTION||0)-Number(a.DATE_INTERACTION||0)).slice(0,8)}
function eventHtml(r){const title=[listText(r.TYPE).join(' • '),txt(r.Theme)].filter(Boolean).join(' — ')||'Interaction';return`<div class="event"><div class="eventDate">${esc(dt(r.DATE_INTERACTION)||'Date inconnue')}</div><div><div class="eventTitle">${esc(title)}</div>${r.DESCRIPTION?`<div class="eventDesc">${esc(r.DESCRIPTION)}</div>`:''}</div></div>`}
function filtered(){const q=state.query.trim().toLowerCase();let a=state.tables.esms.filter(r=>{const l=labels(r);const qok=!q||[l.name,l.finess,l.ugecam,l.site,l.type,txt(r.ADRESSE),txt(r.Directeur)].join(' ').toLowerCase().includes(q);return qok&&(!state.ugecam||l.ugecam===state.ugecam)&&(!state.site||l.site===state.site)});a.sort((x,y)=>{const A=labels(x),B=labels(y);if(state.sort==='finess')return A.finess.localeCompare(B.finess,'fr');if(state.sort==='site')return A.site.localeCompare(B.site,'fr')||A.name.localeCompare(B.name,'fr');return A.name.localeCompare(B.name,'fr')});return a}
function kpiHtml(){const f=filtered(),all=state.tables.esms.map(labels);const sites=new Set(f.map(x=>labels(x).site).filter(Boolean)).size;const u=new Set(f.map(x=>labels(x).ugecam).filter(Boolean)).size;return`<div class="kpis"><div class="kpi"><div class="kpiLabel">ESMS total</div><div class="kpiValue">${state.tables.esms.length}</div></div><div class="kpi"><div class="kpiLabel">Résultats</div><div class="kpiValue">${f.length}</div></div><div class="kpi"><div class="kpiLabel">Sites</div><div class="kpiValue">${sites}</div></div><div class="kpi"><div class="kpiLabel">UGECAM</div><div class="kpiValue">${u}</div></div></div>`}
function sidebar(){const all=state.tables.esms.map(labels);const us=[...new Set(all.map(x=>x.ugecam).filter(Boolean))].sort();const ss=[...new Set(all.filter(x=>!state.ugecam||x.ugecam===state.ugecam).map(x=>x.site).filter(Boolean))].sort();const items=filtered();return`<aside class="sidebar"><div class="sideHead"><div class="sideTitle">Établissements ESMS</div><div class="sideSub">Recherche, filtres et navigation</div><input id="q" class="search" placeholder="Nom, FINESS, ville, directeur…" value="${esc(state.query)}"><div class="filters"><select id="u"><option value="">Toutes les UGECAM</option>${us.map(x=>`<option ${x===state.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="s"><option value="">Tous les sites</option>${ss.map(x=>`<option ${x===state.site?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="filters"><select id="sort"><option value="name" ${state.sort==='name'?'selected':''}>Tri : nom</option><option value="site" ${state.sort==='site'?'selected':''}>Tri : site</option><option value="finess" ${state.sort==='finess'?'selected':''}>Tri : FINESS</option></select><button id="reset" class="ghost">Réinitialiser</button></div></div><div class="listMeta"><span>${items.length} établissement${items.length>1?'s':''}</span><span>${state.selectedId?'1 sélectionné':''}</span></div><div class="list" id="list">${items.length?items.map(r=>{const l=labels(r);return`<button class="item ${Number(r.id)===Number(state.selectedId)?'active':''}" data-id="${r.id}"><div class="itemName">${esc(l.name)}</div><div class="itemMeta">${esc([l.site,l.finess?'FINESS '+l.finess:''].filter(Boolean).join(' • '))}</div></button>`}).join(''):'<div class="muted" style="padding:12px">Aucun résultat.</div>'}</div></aside>`}
function mapHtml(r){const lat=Number(r.Latitude),lon=Number(r.Longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return'<div class="muted">Coordonnées géographiques non renseignées.</div>';const d=.025,bbox=`${lon-d}%2C${lat-d}%2C${lon+d}%2C${lat+d}`,marker=`${lat}%2C${lon}`;return`<iframe class="map" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${marker}"></iframe>`}
function detail(){const r=byId(state.tables.esms,state.selectedId);if(!r)return'<section class="emptyDetail">Sélectionnez un établissement dans la liste.</section>';const l=labels(r),cids=refList(r.CONTACTS),cs=cids.map(id=>byId(state.tables.contacts,id)).filter(Boolean),ev=interactions(cids),ratt=refList(r.Rattachement_site_UGECAM).map(id=>byId(state.tables.esms,id)).filter(Boolean);const pos=filtered().findIndex(x=>Number(x.id)===Number(r.id)),arr=filtered(),prev=pos>0?arr[pos-1]:null,next=pos>=0&&pos<arr.length-1?arr[pos+1]:null;const address=txt(r.ADRESSE),maps=(Number.isFinite(Number(r.Latitude))&&Number.isFinite(Number(r.Longitude)))?`${r.Latitude},${r.Longitude}`:address;return`<div class="detail">${kpiHtml()}<section class="hero"><div class="heroTop"><div><div class="eyebrow">Fiche établissement</div><h1>${esc(l.name)}</h1><div class="subtitle">${esc([l.ugecam,l.site].filter(Boolean).join(' • '))}</div><div class="chips">${chip(l.type)}${l.finess?chip('FINESS '+l.finess):''}</div></div><div class="nav"><button data-nav="${prev?.id||''}" ${prev?'':'disabled'}>← Précédent</button><button data-nav="${next?.id||''}" ${next?'':'disabled'}>Suivant →</button></div></div><div class="actions">${maps?`<a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(maps)}">📍 Ouvrir la carte</a>`:''}</div></section><div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Informations générales</div></div><div class="cardBody"><div class="grid">${field('Raison sociale',l.name)}${field('FINESS',l.finess)}${field('UGECAM',l.ugecam)}${field('Site',l.site)}${field('Typologie',l.type)}${field('Directeur',r.Directeur)}${field('Adresse',address,true,true)}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Contacts associés</div><div class="count">${cs.length}</div></div><div class="cardBody">${cs.length?`<div class="contacts">${cs.map(contactCard).join('')}</div>`:'<div class="muted">Aucun contact associé.</div>'}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Interactions récentes</div><div class="count">${ev.length}</div></div><div class="cardBody">${ev.length?`<div class="timeline">${ev.map(eventHtml).join('')}</div>`:'<div class="muted">Aucune interaction récente.</div>'}</div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Localisation</div></div><div class="cardBody">${mapHtml(r)}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Rattachement</div></div><div class="cardBody">${ratt.length?ratt.map(x=>field('Établissement rattaché',txt(x.ESMS_raison_sociale),true,true)).join(''):'<div class="muted">Aucun rattachement renseigné.</div>'}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Notes</div></div><div class="cardBody">${txt(r.Notes)?`<div class="value soft">${esc(txt(r.Notes))}</div>`:'<div class="muted">Aucune note renseignée.</div>'}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Traçabilité</div></div><div class="cardBody"><div class="grid">${field('Créé par',r.Cree_par,true)}${field('Dernière mise à jour',dt(r.Derniere_mise_a_jour),true)}${field('Modifié par',r.Derniere_mise_a_jour_par,true)}</div>${!r.Cree_par&&!r.Derniere_mise_a_jour&&!r.Derniere_mise_a_jour_par?'<div class="muted">Non renseignée.</div>':''}</div></section></aside></div><div class="footer">Tableau de bord ESMS V4 • données lues directement depuis Grist</div></div>`}
function render(){app.innerHTML=`<div class="shell">${sidebar()}${detail()}</div>`;bind();requestAnimationFrame(()=>document.querySelector('.item.active')?.scrollIntoView({block:'nearest'}))}
async function choose(id,sync=true){state.selectedId=Number(id);render();if(sync&&grist?.setCursorPos){try{await grist.setCursorPos({rowId:Number(id)})}catch(e){console.debug('Synchronisation curseur non disponible',e)}}}
function bind(){document.getElementById('q')?.addEventListener('input',e=>{state.query=e.target.value;render()});document.getElementById('u')?.addEventListener('change',e=>{state.ugecam=e.target.value;state.site='';render()});document.getElementById('s')?.addEventListener('change',e=>{state.site=e.target.value;render()});document.getElementById('sort')?.addEventListener('change',e=>{state.sort=e.target.value;render()});document.getElementById('reset')?.addEventListener('click',()=>{state.query='';state.ugecam='';state.site='';state.sort='name';render()});document.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.id,true)));document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav)choose(b.dataset.nav,true)}))}
async function start(){try{await load();const first=state.tables.esms[0];state.selectedId=first?.id||null;render()}catch(e){console.error(e);app.innerHTML=`<div class="error"><strong>Impossible de charger les données</strong>${esc(e?.message||e)}<br><br>Le widget doit conserver l’accès complet au document.</div>`}}
grist.ready({requiredAccess:'full'});
grist.onRecord(r=>{if(r?.id&&state.tables){state.selectedId=Number(r.id);render()}else if(r?.id){state.selectedId=Number(r.id)}});
start();
</script></body></html>
