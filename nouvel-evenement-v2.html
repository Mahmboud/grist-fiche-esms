<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouvel événement V2</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>body{margin:0;padding:14px;background:#f5f7fb;font-family:Inter,system-ui;color:#0f172a}*{box-sizing:border-box}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.04);margin-bottom:12px}h1{margin:0 0 6px;font-size:24px}.muted{color:#64748b;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;margin-bottom:5px;color:#475569}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.btn{border:1px solid #dbe3ee;background:#fff;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.people{max-height:230px;overflow:auto;border:1px solid #e2e8f0;border-radius:12px;padding:8px}.person{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:9px}.person:hover{background:#f8fafc}.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:10px;margin-top:10px}.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:10px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="card"><h1>Créer / dupliquer un événement</h1><div class="muted">Création directe dans EVENEMENTS_MOAD avec organisateur assisté et sélection d’inscrits.</div></div><form id="f" class="card"><div class="grid"><div class="full"><label>Dupliquer un événement existant</label><select id="dup"><option value="">Aucun</option></select></div><div class="full"><label>Titre *</label><input id="title" required></div><div><label>Début *</label><input id="start" type="datetime-local" required></div><div><label>Fin</label><input id="end" type="datetime-local"></div><div><label>Type</label><input id="type" list="types"><datalist id="types"></datalist></div><div><label>Organisateur</label><input id="org" list="orgs"><datalist id="orgs"></datalist></div><div class="full"><label>Description</label><textarea id="desc" placeholder="Objectifs, programme, liens…"></textarea></div><div class="full"><label>Inscrits</label><input id="peopleSearch" placeholder="Rechercher un contact…"><div id="people" class="people"></div></div></div><div class="actions"><button class="btn" type="button" id="reset">Réinitialiser</button><button class="btn primary" type="submit">Créer l’événement</button></div><div id="msg"></div></form><script>const T={e:'EVENEMENTS_MOAD',c:'CONTACTS'};let events=[],contacts=[];const $=id=>document.getElementById(id);function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{});const n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function list(v){if(!v)return[];if(Array.isArray(v))return(v[0]==='L'||v[0]==='l')?v.slice(1):v;return[v]}async function ft(t){return rows(await grist.docApi.fetchTable(t))}function toLocal(v){if(!v)return'';const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);if(isNaN(d))return'';const z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}function renderPeople(q=''){const s=q.toLowerCase();$('people').innerHTML=contacts.filter(c=>{const h=`${c.PRENOM||''} ${c.NOM||''} ${c.EMAIL||''} ${c.FONCTION||''}`.toLowerCase();return !s||h.includes(s)}).map(c=>`<label class="person"><input type="checkbox" value="${c.id}"><span><b>${c.PRENOM||''} ${c.NOM||''}</b><br><span class="muted">${c.FONCTION||''}${c.EMAIL?' · '+c.EMAIL:''}</span></span></label>`).join('')}function fillDup(id){const e=events.find(x=>Number(x.id)===Number(id));if(!e)return;$('title').value=(e.TITRE_EVENEMENT||'')+' — copie';$('start').value=toLocal(e.DEBUT_EVENEMENT);$('end').value=toLocal(e.FIN_EVENEMENT);$('type').value=list(e.TYPE_EVENEMENT).join(', ');$('org').value=list(e.ORGANISATEUR_EVENEMENT).join(', ');$('desc').value=e.DESCRIPTION_EVENEMENT||'';const ids=list(e.inscrits).map(Number);document.querySelectorAll('#people input[type=checkbox]').forEach(x=>x.checked=ids.includes(Number(x.value)))}function ts(v){return v?Math.floor(new Date(v).getTime()/1000):null}async function init(){[events,contacts]=await Promise.all([ft(T.e),ft(T.c)]);$('dup').innerHTML+=[...events].sort((a,b)=>String(a.TITRE_EVENEMENT||'').localeCompare(String(b.TITRE_EVENEMENT||''),'fr')).map(e=>`<option value="${e.id}">${e.TITRE_EVENEMENT||'Événement'}</option>`).join('');const types=[...new Set(events.flatMap(e=>list(e.TYPE_EVENEMENT).map(String)).filter(Boolean))].sort();$('types').innerHTML=types.map(x=>`<option value="${x}">`).join('');const orgs=[...new Set(events.flatMap(e=>list(e.ORGANISATEUR_EVENEMENT).map(String)).filter(Boolean))].sort();$('orgs').innerHTML=orgs.map(x=>`<option value="${x}">`).join('');renderPeople()}$('dup').onchange=e=>fillDup(e.target.value);$('peopleSearch').oninput=e=>renderPeople(e.target.value);$('reset').onclick=()=>{document.getElementById('f').reset();renderPeople();$('msg').innerHTML=''};$('f').onsubmit=async e=>{e.preventDefault();const ids=[...document.querySelectorAll('#people input:checked')].map(x=>Number(x.value));const rec={TITRE_EVENEMENT:$('title').value.trim(),DEBUT_EVENEMENT:ts($('start').value),FIN_EVENEMENT:ts($('end').value),TYPE_EVENEMENT:$('type').value.trim()?['L',$('type').value.trim()]:null,ORGANISATEUR_EVENEMENT:$('org').value.trim()?['L',$('org').value.trim()]:null,DESCRIPTION_EVENEMENT:$('desc').value.trim(),inscrits:['L',...ids]};try{await grist.docApi.applyUserActions([['AddRecord',T.e,null,rec]]);$('msg').innerHTML='<div class="ok">Événement créé avec succès.</div>';await init()}catch(err){$('msg').innerHTML=`<div class="err">${String(err.message||err)}</div>`}};grist.ready({requiredAccess:'full'});init().catch(e=>$('msg').innerHTML=`<div class="err">${e}</div>`);</script></body></html>
