<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autodiagnostic collaboratif</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:1500px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.side{position:sticky;top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:15px;border-bottom:1px solid var(--line)}.title{font-size:16px;font-weight:900}.sub{font-size:11.5px;color:var(--muted);margin-top:3px}.select{width:100%;margin-top:10px;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff}.progress{margin-top:12px}.progressTop{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:5px}.fill{height:100%;background:var(--blue)}.nav{padding:8px}.navBtn{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;display:flex;justify-content:space-between;gap:8px;color:#334155}.navBtn:hover{background:#f8fafc}.navBtn.active{background:var(--blueSoft);color:#1d4ed8;font-weight:800}.pct{font-size:10.5px;color:var(--muted)}.main{min-width:0}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}.heroTop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.siteName{font-size:24px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:5px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:750}.pill.green{background:var(--greenSoft);color:var(--green)}.sectionTitle{font-size:17px;font-weight:900;margin:4px 0 10px}.qcard{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:15px;margin-bottom:10px}.qhead{display:flex;justify-content:space-between;gap:12px}.qtext{font-size:13.5px;font-weight:800;line-height:1.45}.saveState{font-size:10.5px;color:var(--muted);white-space:nowrap}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11.5px;font-weight:750}.choice.on{background:var(--blueSoft);border-color:#93c5fd;color:#1d4ed8}.prec{margin-top:10px;width:100%;min-height:70px;resize:vertical;border:1px solid #dbe3ee;border-radius:10px;padding:10px;font-size:12px}.note{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:11.5px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:static}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main id="app"><div class="loading">Chargement de l’autodiagnostic…</div></main><script>
const app=document.getElementById('app');
const GROUPS=[['Transmissions & écrits',['transmission1','Tranmissions2','CR1','CR2','CR3','Troublesetcrises1','troublesetcrises2','transmissions_ciblees']],['Admissions & documents',['Preadmission1','Modeles_de_documents','requete1','requete2']],['Agenda & présences',['Agenda1','Agenda2','Agenda3','Presences']],['Soins & médicaments',['Prescription1','Prescription2','Prescription3','Administration_des_medicaments1','Administration_des_medicaments2','Administration_des_medicaments3','Suivi_soin_nursing']],['Projet personnalisé',['PP1','PP2','PP3','PP4','PP5','PP6','PP7','PP8','PP9']],['Comptes & accès',['comptes_utilisateurs1','comptes_utilisateurs2','comptes_utilisateurs3']],['Services socles / DMP',['Services_socles','Services_socles2','Services_socles3']],['Usages transverses & accompagnement',['transverses1','transverses2','transverses3','transverses4','transverses5','transverses6','transverses7']],['Statistiques & pilotage',['Statistiques1','Statistiques2','Statistiques3','Statistiques4','Statistiques5','Statistiques6','Statistiques7','Statistiques8']]];
const state={rows:[],sites:[],meta:{},siteId:null,group:0,current:null,saving:{}};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{});const n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
async function loadMeta(){try{const tabs=await ft('_grist_Tables'),cols=await ft('_grist_Tables_column');const t=tabs.find(x=>x.tableId==='Autodiagnostic');if(t){for(const c of cols.filter(x=>Number(x.parentId)===Number(t.id))){let wo={};try{wo=JSON.parse(c.widgetOptions||'{}')}catch{}state.meta[c.colId]={label:c.label||c.colId,type:c.type,choices:wo.choices||[]}}}}catch(e){console.warn('metadata fallback',e)}}
function precisionCol(id){const candidates=[id+'_Precisions',id+'_precisions',id+'_Precisions2',id+'_precisions2'];return candidates.find(x=>Object.prototype.hasOwnProperty.call(state.current||{},x))||null}
function qmeta(id){const m=state.meta[id]||{};return{label:m.label||id.replaceAll('_',' '),choices:m.choices?.length?m.choices:['OUI','PARTIELLEMENT','NON']}}
function answerFields(){return GROUPS.flatMap(g=>g[1])}
function isAnswered(v){return !empty(v)}
function completion(row,ids=answerFields()){if(!row)return 0;return Math.round(ids.filter(id=>isAnswered(row[id])).length/Math.max(1,ids.length)*100)}
function currentSiteName(){return state.current?.gristHelper_Display||state.sites.find(s=>Number(s.id)===Number(state.siteId))?.SITES_nomenclature_UGECAM||'Site'}
async function saveField(col,value){if(!state.current)return;state.saving[col]='Enregistrement…';render();try{await grist.docApi.applyUserActions([['UpdateRecord','Autodiagnostic',state.current.id,{[col]:value}]]);state.current[col]=value;state.saving[col]='Enregistré';setTimeout(()=>{delete state.saving[col];render()},900)}catch(e){state.saving[col]='Erreur';render()}}
function questionHtml(id){const m=qmeta(id),val=state.current?.[id],pc=precisionCol(id),pv=pc?state.current?.[pc]:'';return `<div class="qcard"><div class="qhead"><div class="qtext">${esc(m.label)}</div><div class="saveState">${esc(state.saving[id]||'')}</div></div><div class="choices">${m.choices.map(c=>`<button class="choice ${String(val)===String(c)?'on':''}" data-answer="${esc(id)}" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div>${pc?`<textarea class="prec" data-prec="${esc(pc)}" placeholder="Précisions utiles…">${esc(pv||'')}</textarea>`:''}</div>`}
function render(){if(!state.rows.length){app.innerHTML='<div class="loading">Aucun autodiagnostic trouvé.</div>';return}const row=state.current;const total=completion(row);const g=GROUPS[state.group];app.innerHTML=`<div class="shell"><aside class="side"><div class="sideHead"><div class="title">Autodiagnostic</div><div class="sub">Réponse collaborative par site</div><select id="site" class="select">${state.rows.map(r=>`<option value="${r.id}" ${r.id===row?.id?'selected':''}>${esc(r.gristHelper_Display||('Site '+r.id))}</option>`).join('')}</select><div class="progress"><div class="progressTop"><span>Progression globale</span><strong>${total}%</strong></div><div class="bar"><div class="fill" style="width:${total}%"></div></div></div></div><div class="nav">${GROUPS.map((x,i)=>`<button class="navBtn ${i===state.group?'active':''}" data-group="${i}"><span>${esc(x[0])}</span><span class="pct">${completion(row,x[1])}%</span></button>`).join('')}</div></aside><section class="main"><div class="hero"><div class="heroTop"><div><div class="siteName">${esc(currentSiteName())}</div><div class="meta">${esc(row?.gristHelper_Display2||'')} • réponses partagées par tous les utilisateurs du site</div></div></div><div class="status"><span class="pill green">Sauvegarde champ par champ</span><span class="pill">Dernière mise à jour : ${esc(row?.Derniere_mise_a_jour_par||'—')}</span></div></div><div class="sectionTitle">${esc(g[0])}</div>${g[1].map(questionHtml).join('')}<div class="note"><div class="qtext">Notes générales du site</div><textarea id="notes" class="prec" placeholder="Synthèse, points de vigilance, commentaires transverses…">${esc(row?.Notes_Generales||'')}</textarea></div></section></div>`;bind()}
function bind(){document.getElementById('site')?.addEventListener('change',e=>{state.current=state.rows.find(r=>Number(r.id)===Number(e.target.value));render()});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.group=Number(b.dataset.group);render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>saveField(b.dataset.answer,b.dataset.value));document.querySelectorAll('[data-prec]').forEach(t=>{let timer;t.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>saveField(t.dataset.prec,t.value),700)}});const n=document.getElementById('notes');if(n){let timer;n.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>saveField('Notes_Generales',n.value),700)}}}
(async()=>{try{await Promise.all([loadMeta(),(async()=>{state.rows=await ft('Autodiagnostic');state.sites=await ft('SITES_nomenclature_UGECAM')})()]);state.current=state.rows[0]||null;render()}catch(e){app.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}})();grist.ready({requiredAccess:'full'});grist.onRecord(r=>{if(r&&state.rows.length){const x=state.rows.find(a=>Number(a.id)===Number(r.id));if(x){state.current=x;render()}}});</script></body></html>
