<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthèse Autodiagnostic V2</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}input,select,button{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}
.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}.kLabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kVal{font-size:22px;font-weight:900;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:15px;font-weight:900}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select,.tools button{border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px;background:#fff;font-size:11.5px}.tableWrap{overflow:auto;max-height:68vh}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{padding:10px 11px;border-bottom:1px solid #eef2f7;text-align:left;font-size:11.5px;vertical-align:middle}th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:10px;text-transform:uppercase;letter-spacing:.04em;z-index:2}.site{font-weight:800}.bar{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden;min-width:90px}.fill{height:100%;background:var(--blue)}.pct{font-weight:850;margin-left:7px;white-space:nowrap}.mini{display:flex;align-items:center;gap:7px}.chip{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.good{background:var(--greenSoft);color:var(--green)}.mid{background:var(--amberSoft);color:var(--amber)}.low{background:var(--redSoft);color:var(--red)}.foot{padding:10px 14px;color:var(--muted);font-size:10.5px}.sync{font-size:10.5px;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}} </style></head>
<body><main id="app"><div class="loading">Chargement de la synthèse…</div></main>
<script>
const app=document.getElementById('app');
const GROUPS=[
['Transmissions',['transmission1','Tranmissions2','CR1','CR2','CR3','Troublesetcrises1','troublesetcrises2','transmissions_ciblees']],
['Admissions',['Preadmission1','Modeles_de_documents','requete1','requete2']],
['Agenda',['Agenda1','Agenda2','Agenda3','Presences']],
['Soins',['Prescription1','Prescription2','Prescription3','Administration_des_medicaments1','Administration_des_medicaments2','Administration_des_medicaments3','Suivi_soin_nursing']],
['Projet personnalisé',['PP1','PP2','PP3','PP4','PP5','PP6','PP7','PP8','PP9']],
['Comptes',['comptes_utilisateurs1','comptes_utilisateurs2','comptes_utilisateurs3']],
['Services socles',['Services_socles','Services_socles2','Services_socles3']],
['Transverses',['transverses1','transverses2','transverses3','transverses4','transverses5','transverses6','transverses7']],
['Statistiques',['Statistiques1','Statistiques2','Statistiques3','Statistiques4','Statistiques5','Statistiques6','Statistiques7','Statistiques8']]
];
const state={rows:[],q:'',ugecam:'',status:'',lastSync:null};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{}),n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API indisponible')}
function allIds(){return GROUPS.flatMap(g=>g[1])}
function counts(r,ids=allIds()){const total=ids.length,done=ids.filter(id=>!empty(r[id])).length;return{done,total,pct:Math.round(done/Math.max(1,total)*100)}}
function cls(p){return p>=75?'good':p>=40?'mid':'low'}
function st(r){const p=counts(r).pct;return p===100?'done':p>0?'started':'empty'}
function filtered(){const q=state.q.trim().toLowerCase();return state.rows.filter(r=>(!q||[r.gristHelper_Display,r.gristHelper_Display2].join(' ').toLowerCase().includes(q))&&(!state.ugecam||r.gristHelper_Display2===state.ugecam)&&(!state.status||st(r)===state.status)).sort((a,b)=>counts(b).pct-counts(a).pct)}
function fmtDate(v){if(empty(v))return'—';const n=Number(v);const d=Number.isFinite(n)?new Date(n*1000):new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function render(){const all=state.rows,shown=filtered(),ugecams=[...new Set(all.map(r=>r.gristHelper_Display2).filter(Boolean))].sort();const avg=all.length?Math.round(all.reduce((s,r)=>s+counts(r).pct,0)/all.length):0,done=all.filter(r=>st(r)==='done').length,started=all.filter(r=>st(r)==='started').length,emptyN=all.filter(r=>st(r)==='empty').length;app.innerHTML=`<div class="kpis"><div class="kpi"><div class="kLabel">Sites</div><div class="kVal">${all.length}</div></div><div class="kpi"><div class="kLabel">Non démarrés</div><div class="kVal">${emptyN}</div></div><div class="kpi"><div class="kLabel">En cours</div><div class="kVal">${started}</div></div><div class="kpi"><div class="kLabel">Terminés</div><div class="kVal">${done}</div></div><div class="kpi"><div class="kLabel">Progression moyenne</div><div class="kVal">${avg}%</div></div></div><section class="card"><div class="head"><div><div class="title">Pilotage de l’Autodiagnostic par site</div><div class="sync">Les champs “Précisions” sont exclus du calcul${state.lastSync?' · actualisé à '+state.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</div></div><div class="tools"><input id="q" placeholder="Rechercher un site…" value="${esc(state.q)}"><select id="u"><option value="">Toutes les UGECAM</option>${ugecams.map(x=>`<option ${x===state.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="s"><option value="">Tous états</option><option value="empty" ${state.status==='empty'?'selected':''}>Non démarrés</option><option value="started" ${state.status==='started'?'selected':''}>En cours</option><option value="done" ${state.status==='done'?'selected':''}>Terminés</option></select><button id="refresh">Actualiser</button></div></div><div class="tableWrap"><table><thead><tr><th>UGECAM</th><th>Site</th><th>Global</th>${GROUPS.map(g=>`<th>${esc(g[0])}</th>`).join('')}<th>Dernière mise à jour</th><th>Par</th></tr></thead><tbody>${shown.map(r=>{const p=counts(r);return`<tr><td>${esc(r.gristHelper_Display2||'')}</td><td class="site">${esc(r.gristHelper_Display||('Site '+r.id))}</td><td><div class="mini"><div class="bar"><div class="fill" style="width:${p.pct}%"></div></div><span class="pct">${p.done}/${p.total} · ${p.pct}%</span></div></td>${GROUPS.map(g=>{const x=counts(r,g[1]);return`<td><span class="chip ${cls(x.pct)}">${x.done}/${x.total} · ${x.pct}%</span></td>`}).join('')}<td>${esc(fmtDate(r.Derniere_mise_a_jour))}</td><td>${esc(r.Derniere_mise_a_jour_par||'—')}</td></tr>`}).join('')}</tbody></table></div><div class="foot">${shown.length} site(s) affiché(s). Progression = questions principales renseignées / questions principales totales.</div></section>`;document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};document.getElementById('u').onchange=e=>{state.ugecam=e.target.value;render()};document.getElementById('s').onchange=e=>{state.status=e.target.value;render()};document.getElementById('refresh').onclick=refresh}
async function refresh(){try{state.rows=await ft('Autodiagnostic');state.lastSync=new Date();render()}catch(e){console.warn(e)}}
(async()=>{try{await refresh();setInterval(refresh,20000)}catch(e){app.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}})();
grist.ready({requiredAccess:'full'});
</script></body></html>
