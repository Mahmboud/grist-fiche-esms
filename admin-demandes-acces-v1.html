<!doctype html><html lang="fr"><head><meta charset="utf-8"><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>body{font:14px system-ui;background:#f5f7fb;color:#172033;margin:0;padding:14px}main{max-width:1200px;margin:auto}h1{margin:0 0 14px}.c{background:#fff;border:1px solid #dde5ee;border-radius:12px;padding:12px;margin-bottom:9px}.r{display:grid;grid-template-columns:1.3fr 1.6fr auto;gap:12px;align-items:center}.m{font-size:12px;color:#64748b;line-height:1.45}button{padding:8px 10px;border:0;border-radius:8px;font-weight:700}.ok{background:#15803d;color:#fff}.no{color:#b42318}@media(max-width:700px){.r{grid-template-columns:1fr}}</style></head><body><main id="a">Chargement…</main><script>
const a=document.getElementById('a'),S={r:[],c:[],s:[],f:[]};
const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(x=>Array.isArray(x)?x.length:0))},(_,i)=>Object.fromEntries(Object.entries(d||{}).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));
const ft=async t=>rows(await grist.docApi.fetchTable(t));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const L=v=>{if(Array.isArray(v))return v[0]==='L'?v.slice(1):v;if(typeof v==='string'){try{return L(JSON.parse(v))}catch{return[]}}return[]};
const refId=v=>Number(v)||0;
const site=id=>S.s.find(x=>Number(x.id)===Number(id));
const siteLabel=id=>site(id)?.NOM_SITE||'';
const siteType=id=>String(site(id)?.TYPE_SITE||'').toUpperCase();
const sites=v=>L(v).map(siteLabel).filter(Boolean).join(', ');
const fnLabel=id=>S.f.find(x=>Number(x.id)===Number(id))?.LIBELLE||String(id||'');
function linked(r){const id=refId(r.CONTACT);if(id){const x=S.c.find(c=>Number(c.id)===id);if(x)return x}const z=S.c.filter(c=>String(c.EMAIL||'').toLowerCase()===String(r.EMAIL||'').toLowerCase());return z.length===1?z[0]:null}
function show(){
 const z=S.r.filter(x=>x.STATUT==='À valider');
 a.innerHTML='<h1>🔔 Demandes d’accès ('+z.length+')</h1><p class="m">La validation rattache le professionnel à un site principal Airmes et, le cas échéant, à d’autres sites en responsabilité. Les ESMS accessibles sont déduits automatiquement de ces sites.</p>'+(
 z.map(r=>{const c=linked(r),dup=S.c.filter(x=>String(x.EMAIL||'').toLowerCase()===String(r.EMAIL||'').toLowerCase()),t=siteType(r.SITE);let scope=t==='DNGU'?'🌐 Profil DNGU — périmètre national':t==='SIEGE'?'🏢 Profil Siège — périmètre UGECAM':'Site principal : '+esc(siteLabel(r.SITE)||'Non renseigné');if(L(r.SITES_EN_RESPONSABILITE).length)scope+='<br><b>Autres sites :</b> '+esc(sites(r.SITES_EN_RESPONSABILITE));return '<div class="c"><div class="r"><div><b>'+esc(r.PRENOM)+' '+esc(r.NOM)+'</b><div class="m">'+esc(r.EMAIL)+' · '+esc(fnLabel(r.FONCTION))+'<br>'+(c?'🔄 Mise à jour du contact #'+c.id:'➕ Nouveau contact')+'</div></div><div class="m">'+scope+(!c&&dup.length>1?'<br>⚠️ Doublon email dans CONTACTS':'')+'</div><div><button class="ok" data-v="'+r.id+'" '+(!c&&dup.length>1?'disabled':'')+'>Valider</button> <button class="no" data-x="'+r.id+'">Refuser</button></div></div></div>'}).join('')||'<div class="c">Aucune demande en attente.</div>');
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>validate(Number(b.dataset.v)));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>reject(Number(b.dataset.x)));
}
async function validate(id){
 const r=S.r.find(x=>Number(x.id)===id),c=linked(r),t=siteType(r.SITE),siege=t==='SIEGE',dngu=t==='DNGU';
 const data={NOM:r.NOM,PRENOM:r.PRENOM,FONCTION:Number(r.FONCTION),EMAIL:String(r.EMAIL||'').toLowerCase(),UGECAM:Number(r.UGECAM)||0,SITE_PRINCIPAL:Number(r.SITE)||0,SITES_EN_RESPONSABILITE:['L',...new Set(L(r.SITES_EN_RESPONSABILITE).map(Number).filter(x=>x&&x!==Number(r.SITE)))],SIEGE:siege,DNGU:dngu,Referent_DUI:true,ACCES:true,ACCES_CONTACTS:false,ACCES_LISTE_ESMS:true,ACCES_ARBORESCENCE:true};
 let cid;if(c){cid=c.id;await grist.docApi.applyUserActions([['UpdateRecord','CONTACTS',cid,data]])}else{const q=await grist.docApi.applyUserActions([['AddRecord','CONTACTS',null,data]]);cid=Array.isArray(q)?q[0]:q}
 await grist.docApi.applyUserActions([['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Validé',CONTACT:Number(cid)||0,DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Administrateur Grist',NOM:'',PRENOM:'',FONCTION:0}]]);
 await reload();
}
async function reject(id){await grist.docApi.applyUserActions([['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Refusé',DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Administrateur Grist'}]]);await reload()}
async function reload(){[S.r,S.c,S.s,S.f]=await Promise.all([ft('DEMANDES_ACCES'),ft('CONTACTS'),ft('SITES'),ft('REFERENTIEL_FONCTIONS')]);show()}
(async()=>{try{await grist.ready({requiredAccess:'full'});await reload()}catch(e){a.textContent='Accès Administration indisponible : '+(e?.message||e)}})();
</script></body></html>
