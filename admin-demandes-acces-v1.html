<!doctype html><html lang=fr><head><meta charset=utf-8><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>body{font:14px system-ui;background:#f5f7fb;padding:16px;color:#172033}main{max-width:1200px;margin:auto}h1{margin:0}.c{background:#fff;border:1px solid #dde5ee;border-radius:12px;padding:14px;margin:10px 0}.r{display:grid;grid-template-columns:2fr 2fr auto;gap:12px;align-items:center}.m{color:#64748b;font-size:12px}button{padding:8px 10px;border:0;border-radius:8px;font-weight:700}.ok{background:#15803d;color:#fff}.no{color:#b42318}@media(max-width:700px){.r{grid-template-columns:1fr}}</style></head><body><main id=a>Chargement…</main><script>
const a=document.getElementById('a'),S={r:[],c:[],e:[],s:[],f:[]};const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(x=>Array.isArray(x)?x.length:0))},(_,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));const ft=async t=>rows(await grist.docApi.fetchTable(t));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const L=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):[];function esms(v){return L(v).map(i=>S.e.find(x=>+x.id===+i)?.ESMS_raison_sociale).filter(Boolean).join(', ')}function refId(v){if(typeof v==='number')return v;if(Array.isArray(v)){for(let i=v.length-1;i>=0;i--){const n=Number(v[i]);if(Number.isFinite(n)&&n>0)return n}}const n=Number(v);return Number.isFinite(n)?n:0}function siteLabel(id){const rid=refId(id);return S.s.find(x=>Number(x.id)===rid)?.SITES_nomenclature_UGECAM||''}function isSiege(r){return String(r.PROFIL_ACCES||'').toUpperCase()==='SIEGE'||/^SI[EÈ]GE\b/i.test(siteLabel(r.SITE).trim())}function isDngu(r){return String(r.PROFIL_ACCES||'').toUpperCase()==='DNGU'||/^DNGU\b/i.test(siteLabel(r.SITE).trim())}
function fonctionLabel(v){let x=S.f.find(z=>Number(z.id)===Number(v));return x?.LIBELLE||String(v??'')}
function linkedContact(r){const cid=refId(r.CONTACT);if(cid){const x=S.c.find(c=>Number(c.id)===cid);if(x)return x}const byMail=S.c.filter(x=>String(x.EMAIL||'').toLowerCase()===String(r.EMAIL||'').toLowerCase());return byMail.length===1?byMail[0]:null}
function show(){let z=S.r.filter(x=>x.STATUT==='À valider');a.innerHTML='<h1>🔔 Demandes d’accès ('+z.length+')</h1><p>Valider met à jour la fiche CONTACTS existante lorsqu’elle a été reconnue à la connexion ; sinon une nouvelle fiche est créée.</p>'+z.map(r=>{let linked=linkedContact(r),m=S.c.filter(x=>String(x.EMAIL||'').toLowerCase()===String(r.EMAIL||'').toLowerCase());return '<div class=c><div class=r><div><b>'+esc(r.PRENOM)+' '+esc(r.NOM)+'</b><div class=m>'+esc(r.EMAIL)+' · '+esc(fonctionLabel(r.FONCTION))+'<br>'+(linked?'🔄 Mise à jour du contact existant #'+linked.id:'➕ Nouveau contact')+'</div></div><div class=m><b>'+esc(siteLabel(r.SITE)||'Site non renseigné')+'</b><br>'+(isDngu(r)?'🌐 Profil DNGU — accès à tous les sites de toutes les UGECAM':(isSiege(r)?'🏢 Profil Siège — accès à tous les sites de l’UGECAM':esc(esms(r.ESMS)||'Aucun ESMS')))+(!linked&&m.length>1?'<br>⚠️ Doublon email dans CONTACTS':'')+'</div><div><button class=ok data-v='+r.id+(!linked&&m.length>1?' disabled':'')+'>Valider</button> <button class=no data-x='+r.id+'>Refuser</button></div></div></div>'}).join('')||'<div class=c>Aucune demande en attente.</div>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>valider(+b.dataset.v));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>refuser(+b.dataset.x))}
async function valider(id){let r=S.r.find(x=>x.id===id),linked=linkedContact(r),m=S.c.filter(x=>String(x.EMAIL||'').toLowerCase()===String(r.EMAIL||'').toLowerCase());if(!linked&&m.length>1)return;let siege=isSiege(r),dngu=isDngu(r),f={NOM:r.NOM,PRENOM:r.PRENOM,FONCTION:+r.FONCTION,EMAIL:String(r.EMAIL).toLowerCase(),UGECAM:refId(r.UGECAM),SITES_nomenclature_UGECAM:refId(r.SITE),ESMS_Liste_UGECAM_:(siege||dngu)?['L']:['L',...L(r.ESMS)],SIEGE:siege,DNGU:dngu,Referent_DUI:true,ACCES:true,ACCES_CONTACTS:false,ACCES_LISTE_ESMS:true,ACCES_ARBORESCENCE:true},cid;if(linked){cid=linked.id;await grist.docApi.applyUserActions([['UpdateRecord','CONTACTS',cid,f]])}else{let q=await grist.docApi.applyUserActions([['AddRecord','CONTACTS',null,f]]);cid=Array.isArray(q)?q[0]:q}await grist.docApi.applyUserActions([['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Validé',CONTACT:+cid||0,DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Administrateur Grist',NOM:'',PRENOM:'',FONCTION:0}]]);reload()}
async function refuser(id){await grist.docApi.applyUserActions([['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Refusé',DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Administrateur Grist'}]]);reload()}async function repairProfiles(){const actions=[];for(const c of S.c){const lab=siteLabel(c.SITES_nomenclature_UGECAM).trim();if(/^SI[EÈ]GE\b/i.test(lab)&&c.SIEGE!==true&&c.SIEGE!==1)actions.push(['UpdateRecord','CONTACTS',c.id,{SIEGE:true,DNGU:false}]);else if(/^DNGU\b/i.test(lab)&&c.DNGU!==true&&c.DNGU!==1)actions.push(['UpdateRecord','CONTACTS',c.id,{DNGU:true,SIEGE:false}])}if(actions.length){for(let i=0;i<actions.length;i+=100)await grist.docApi.applyUserActions(actions.slice(i,i+100));S.c=await ft('CONTACTS')}}async function reload(){[S.r,S.c,S.e,S.s,S.f]=await Promise.all([ft('DEMANDES_ACCES'),ft('CONTACTS'),ft('ESMS_Liste_UGECAM_'),ft('SITES_nomenclature_UGECAM'),ft('REFERENTIEL_FONCTIONS')]);await repairProfiles();show()}(async()=>{try{await grist.ready({requiredAccess:'full'});await reload()}catch(e){a.innerHTML='Accès réservé aux administrateurs.'}})()
</script></body></html>
