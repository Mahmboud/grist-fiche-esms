<!doctype html><html lang=fr><head><meta charset=utf-8><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>body{font:14px system-ui;background:#f5f7fb;padding:16px;color:#172033}main{max-width:1200px;margin:auto}h1{margin:0}.c{background:#fff;border:1px solid #dde5ee;border-radius:12px;padding:14px;margin:10px 0}.r{display:grid;grid-template-columns:2fr 2fr auto;gap:12px;align-items:center}.m{color:#64748b;font-size:12px}button{padding:8px 10px;border:0;border-radius:8px;font-weight:700}.ok{background:#15803d;color:#fff}.no{color:#b42318}@media(max-width:700px){.r{grid-template-columns:1fr}}</style></head><body><main id=a>Chargement…</main><script>
const a=document.getElementById('a'),S={r:[],c:[],e:[]};const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(x=>Array.isArray(x)?x.length:0))},(_,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));const ft=async t=>rows(await grist.docApi.fetchTable(t));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const L=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):[];function esms(v){return L(v).map(i=>S.e.find(x=>+x.id===+i)?.ESMS_raison_sociale).filter(Boolean).join(', ')}
function show(){let z=S.r.filter(x=>x.STATUT==='À valider');a.innerHTML='<h1>🔔 Demandes d’accès ('+z.length+')</h1><p>Valider crée/met à jour CONTACTS et active ACCES pour le site demandé.</p>'+z.map(r=>{let m=S.c.filter(x=>String(x.EMAIL).toLowerCase()===String(r.EMAIL).toLowerCase());return '<div class=c><div class=r><div><b>'+esc(r.PRENOM)+' '+esc(r.NOM)+'</b><div class=m>'+esc(r.EMAIL)+' · '+esc(r.FONCTION)+'</div></div><div class=m>'+esc(esms(r.ESMS))+(m.length>1?'<br>⚠️ Doublon email dans CONTACTS':'')+'</div><div><button class=ok data-v='+r.id+(m.length>1?' disabled':'')+'>Valider</button> <button class=no data-x='+r.id+'>Refuser</button></div></div></div>'}).join('')||'<div class=c>Aucune demande en attente.</div>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>valider(+b.dataset.v));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>refuser(+b.dataset.x))}
async function valider(id){let r=S.r.find(x=>x.id===id),m=S.c.filter(x=>String(x.EMAIL).toLowerCase()===String(r.EMAIL).toLowerCase());if(m.length>1)return;let f={NOM:r.NOM,PRENOM:r.PRENOM,FONCTION:r.FONCTION,EMAIL:String(r.EMAIL).toLowerCase(),UGECAM:+r.UGECAM,SITES_nomenclature_UGECAM:+r.SITE,ESMS_Liste_UGECAM_:['L',...L(r.ESMS)],Referent_DUI:true,ACCES:true},cid;if(m.length){cid=m[0].id;await grist.docApi.applyUserActions([['UpdateRecord','CONTACTS',cid,f]])}else{let q=await grist.docApi.applyUserActions([['AddRecord','CONTACTS',null,f]]);cid=Array.isArray(q)?q[0]:q}await grist.docApi.applyUserActions([['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Validé',CONTACT:+cid||0,DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Administrateur Grist'}]]);reload()}
async function refuser(id){await grist.docApi.applyUserActions([['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Refusé',DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Administrateur Grist'}]]);reload()}async function reload(){[S.r,S.c,S.e]=await Promise.all([ft('DEMANDES_ACCES'),ft('CONTACTS'),ft('ESMS_Liste_UGECAM_')]);show()}(async()=>{try{await grist.ready({requiredAccess:'full'});await reload()}catch(e){a.innerHTML='Accès réservé aux administrateurs.'}})()
</script></body></html>
