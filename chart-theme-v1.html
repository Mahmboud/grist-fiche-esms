<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remontées par thème</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#dbeafe;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{padding:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.title{font-size:14px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:2px}.total{font-size:20px;font-weight:900}.totalLabel{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.rows{display:flex;flex-direction:column;gap:9px}.row{display:grid;grid-template-columns:minmax(150px,1.25fr) minmax(120px,2fr) 52px;gap:9px;align-items:center}.name{font-size:11px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}.track{height:12px;background:#eef2f7;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:999px}.value{text-align:right}.count{font-size:11px;font-weight:850}.pct{font-size:9.5px;color:var(--muted)}.empty,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:15px;padding:34px 18px;text-align:center;color:var(--muted);font-size:12px}.foot{margin-top:10px;padding-top:9px;border-top:1px solid #eef2f7;font-size:9.5px;color:var(--muted)}@media(max-width:560px){.row{grid-template-columns:1fr 44px}.track{grid-column:1/-1;grid-row:2}.name{font-size:10.5px}}</style></head><body><main id="app"><div class="empty">Chargement du graphique…</div></main><script>const app=document.getElementById('app');function rows(d){if(Array.isArray(d))return d;const ks=Object.keys(d||{});if(!ks.length)return[];const n=Math.max(...ks.map(k=>Array.isArray(d[k])?d[k].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(ks.map(k=>[k,Array.isArray(d[k])?d[k][i]:d[k]])))}function clean(v){return String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}function normTheme(v){const x=clean(v).toUpperCase();if(!x)return'NON RENSEIGNÉ';const compact=x.replace(/[^A-ZÀ-ÖØ-Ý0-9]/g,'');if(compact==='INFORMATIQUEHABILITATIONSPARAMETRES')return'INFORMATIQUE HABILITATIONS PARAMÈTRES';if(compact==='MEDICALETSOINS')return'MÉDICAL ET SOINS';if(compact==='SOCIOEDUCATIFACCOMPAGNEMENT')return'SOCIO-ÉDUCATIF / ACCOMPAGNEMENT';return clean(v).replace(/\s+/g,' ').trim().toUpperCase()}async function fetchTable(){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable('Remontees_editeur_'));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable('Remontees_editeur_'));throw new Error('API du document indisponible')}function render(data){const counts=new Map();for(const r of data){const k=normTheme(r.THEME);counts.set(k,(counts.get(k)||0)+1)}const total=data.length;const items=[...counts.entries()].sort((a,b)=>b[1]-a[1]);const max=Math.max(...items.map(x=>x[1]),1);app.innerHTML=`<section class="card"><div class="head"><div><div class="title">Remontées par thème</div><div class="sub">Répartition des ${total.toLocaleString('fr-FR')} remontées</div></div><div><div class="totalLabel">Thèmes</div><div class="total">${items.length}</div></div></div><div class="rows">${items.map(([name,n])=>`<div class="row"><div class="name">${name}</div><div class="track"><div class="bar" style="width:${(n/max*100).toFixed(1)}%"></div></div><div class="value"><div class="count">${n}</div><div class="pct">${(n/total*100).toFixed(1)}%</div></div></div>`).join('')}</div><div class="foot">Les variantes dues aux retours à la ligne et espaces sont regroupées automatiquement.</div></section>`}grist.ready({requiredAccess:'full'});fetchTable().then(render).catch(e=>app.innerHTML=`<div class="error">${String(e.message||e)}<br>Autorise l’accès complet au document.</div>`);</script></body></html>
