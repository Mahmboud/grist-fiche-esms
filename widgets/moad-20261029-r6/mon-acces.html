<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon accès MOAD</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><script src="moad-api.js"></script><script src="moad-ref-config.js"></script><style>body{font:14px system-ui;background:#f4f7fb;color:#203449;margin:0;padding:24px}main{max-width:850px;margin:auto;background:white;border:1px solid #dae3ed;border-radius:16px;padding:28px}h1{margin-top:0}.env{font-size:12px;color:#8a5d10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;padding:10px;border:1px solid #cbd8e4;border-radius:8px}.wide{grid-column:1/-1}.check{display:block;margin:6px 0}.check input{margin-right:8px}fieldset{border:1px solid #dbe4ee;border-radius:10px}button{background:#245eb8;color:white;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}.privacy{padding:14px;background:#f6f9fc;border-radius:10px;font-size:12px;line-height:1.6}#msg{color:#9a3412;white-space:pre-line}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:18px}}</style></head><body><main id="app">Chargement…</main><script>
const app=document.getElementById('app'),S={u:[],s:[],f:[],requests:[],contacts:[],email:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows=d=>Array.isArray(d)?d:(d.id||[]).map((_,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v[i]])));
const ft=async t=>rows(await moadApi.fetchTable(t));const list=v=>Array.isArray(v)?v.filter(x=>typeof x==='number'):[];
function show(){const own=S.owner?[]:S.requests,pending=own.find(r=>r.STATUT==='À valider');if(pending){app.innerHTML='<h1>Demande en attente</h1><p>Votre rattachement professionnel sera vérifié par un administrateur MOAD.</p>';return}const c=S.contacts.find(c=>+c.id===+S.profile?.CONTACT);
app.innerHTML=`<h1>Votre accès MOAD</h1><p>Adresse de connexion : <b>${esc(S.email||'Adresse du compte Grist, renseignée automatiquement')}</b></p><form id="form" class="grid"><label>Prénom<input id="prenom" required value="${esc(c?.PRENOM)}"></label><label>Nom<input id="nom" required value="${esc(c?.NOM)}"></label><label>Fonction<select id="fonction" required><option value="">Choisir…</option>${S.f.map(f=>`<option value="${f[0]}" ${+c?.FONCTION===f[0]?'selected':''}>${esc(f[1])}</option>`).join('')}</select></label><label>UGECAM<select id="ugecam" required><option value="">Choisir…</option>${S.u.map(u=>`<option value="${u.id}" ${+c?.UGECAM===u.id?'selected':''}>${esc(u.UGECAM)}</option>`).join('')}</select></label><label>Profil demandé<select id="profil"><option value="SITE">Professionnel de site</option><option value="SIEGE" ${c?.SIEGE?'selected':''}>Siège UGECAM</option><option value="DNGU" ${c?.DNGU?'selected':''}>DNGU</option></select></label><label>Site principal<select id="site"><option value="">Choisir…</option></select></label><fieldset class="wide"><legend>Autres sites en responsabilités</legend><div id="responsabilites"></div></fieldset><p class="wide">Les ESMS/services seront déduits automatiquement du site principal et des autres sites en responsabilité après validation.</p><div class="privacy wide"><b>Finalités :</b> gérer l’inscription, le rattachement et les habilitations MOAD.<br><b>Données traitées :</b> nom, prénom, mail professionnel, téléphone professionnel, fonction, UGECAM, sites et habilitations.<br><b>Vos droits :</b> demandez l’accès ou la rectification de vos données et contactez le DPO de votre organisme.<br><b>Confidentialité et sécurité :</b> accès limité aux personnes habilitées selon leur périmètre.</div><label class="check wide"><input type="checkbox" required>Je confirme l’exactitude de ces informations professionnelles.</label><div class="wide"><button id="submit">Soumettre à validation</button><p id="msg" role="status"></p></div></form>`;
const u=document.getElementById('ugecam'),s=document.getElementById('site'),p=document.getElementById('profil');
function fill(){const a=S.s.filter(s=>+s.UGECAM===+u.value);s.innerHTML='<option value="">Choisir…</option>'+a.map(x=>`<option value="${x.id}">${esc(x.NOM)}</option>`).join('');document.getElementById('responsabilites').innerHTML=a.map(x=>`<label class="check"><input name="responsabilite" type="checkbox" value="${x.id}" ${list(c?.SITES_RESP_AIRMES).includes(x.id)?'checked':''}>${esc(x.NOM)}</label>`).join('')||'Choisissez une UGECAM.';profile()}
function profile(){s.required=p.value==='SITE';s.disabled=!u.value||p.value!=='SITE';document.querySelectorAll('[name=responsabilite]').forEach(x=>x.disabled=p.value!=='SITE')}
u.onchange=fill;p.onchange=profile;fill();s.value=c?.SITE_PRINCIPAL||'';
document.getElementById('form').onsubmit=async event=>{event.preventDefault();const b=document.getElementById('submit');if(S.sending)return;S.sending=true;const m=document.getElementById('msg');b.disabled=true;try{const primary=p.value==='SITE'?+s.value:0;if(!document.getElementById('nom').value.trim()||!document.getElementById('prenom').value.trim())throw Error('Nom et prénom obligatoires.');if(!S.u.some(x=>+x.id===+u.value)||!S.f.some(x=>+x[0]===+document.getElementById('fonction').value))throw Error('Choisissez une UGECAM et une fonction valides.');if(p.value==='SITE'&&!S.s.some(x=>+x.id===primary&&+x.UGECAM===+u.value))throw Error('Choisissez un site de cette UGECAM.');const scope=p.value==='SITE'?[...document.querySelectorAll('[name=responsabilite]:checked')].map(x=>+x.value).filter(id=>id!==primary):[];const payload={NOM:document.getElementById('nom').value.trim().toUpperCase(),PRENOM:document.getElementById('prenom').value.trim(),FONCTION:+document.getElementById('fonction').value,UGECAM:+u.value,SITE_AIRMES:primary,SITES_RESP_AIRMES:['L',...scope],PROFIL_ACCES:p.value,CONFIRMATION:true,STATUT:'À valider',DATE_DEMANDE:Date.now()/1000,CONTACT:0};if(S.email)payload.EMAIL=S.email;await moadApi.applyUserActions([['AddRecord','DEMANDES_ACCES',null,payload]]);S.requests=await ft('DEMANDES_ACCES');show()}catch(e){m.textContent='Envoi impossible : '+e.message;b.disabled=false}finally{S.sending=false}}}
(async()=>{try{await grist.ready({requiredAccess:'full'});try{S.owner=(await ft('ADMIN_OUTILS')).length>0}catch{S.owner=false}const profiles=await ft('PROFIL_SESSION');S.profile=!S.owner&&profiles.length===1?profiles[0]:null;S.email=S.profile?.EMAIL||'';const cfg=await loadMoadRefConfig();S.f=cfg.fonctions;[S.u,S.s,S.requests,S.contacts]=await Promise.all([ft('UGECAM'),ft('SITES'),ft('DEMANDES_ACCES'),ft('CONTACTS')]);show()}catch(e){app.textContent='Chargement impossible : '+e.message}})();
</script></body></html>
