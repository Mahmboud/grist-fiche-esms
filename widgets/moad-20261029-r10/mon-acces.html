cas échéant, des autres sites placés sous leur responsabilité. Ils ne peuvent pas consulter l’autodiagnostic des autres établissements.</p></div></header>`}
function accessStage(requests){return requests.some(r=>r.STATUT==='Validé')?'validated':requests.some(r=>r.STATUT==='À valider')?'pending':'form'}
function selectPersonal(){const personal=S.contacts.flatMap(r=>{if(typeof r.MON_PROFIL_JSON!=='string'||!r.MON_PROFIL_JSON)return [];try{const c=JSON.parse(r.MON_PROFIL_JSON);return c&&+c.id===+r.id?[c]:[]}catch{return []}});S.self=!S.owner&&personal.length===1?personal[0]:null;S.email=S.self?.EMAIL||''}
function stateRefreshButton(){return '<button type="button" id="refresh-status" class="status-refresh">Actualiser le statut</button><p id="access-status-error" role="status"></p>'}
function bindStatusRefresh(){const b=document.getElementById('refresh-status');if(b)b.onclick=()=>refreshAccessStatus(true)}
async function refreshAccessStatus(manual=false){if(S.checking||S.sending)return;S.checking=true;try{const [requests,contacts]=await Promise.all([ft('DEMANDES_ACCES'),ft('CONTACTS')]);S.requests=requests;S.contacts=contacts;selectPersonal();const next=accessStage(S.owner?[]:requests);if(next!==S.stage||manual&&next!=='form')show()}catch(e){if(manual){const m=document.getElementById('access-status-error');if(m)m.textContent='Actualisation impossible : '+e.message}}finally{S.checking=false}}
function validatedState(r){const c=S.self||{},name=[c.PRENOM||r.PRENOM,c.NOM||r.NOM].filter(Boolean).join(' '),ug=S.u.find(u=>+u.id===+(c.UGECAM||r.UGECAM))?.UGECAM||'',profile=c.DNGU?'DNGU':c.SIEGE?'SIEGE':r.PROFIL_ACCES||'SITE',sites=[...new Set([+(c.SITE_PRINCIPAL||r.SITE_AIRMES),...list(c.SITES_RESP_AIRMES||r.SITES_RESP_AIRMES)])].filter(Boolean).map(id=>S.s.find(s=>+s.id===id)?.NOM).filter(Boolean),scope=profile==='DNGU'?'Tous les sites du Groupe UGECAM':profile==='SIEGE'?'Tous les sites de votre UGECAM':sites.join(', ')||'Selon les sites validés par l’administrateur';return `<section class="access-state validated"><span class="state-tag">Accès validé</span><h2>Votre demande d’accès a été validée</h2><p>Vous pouvez utiliser les pages autorisées dans le menu à gauche. Le questionnaire est disponible dans <strong>AUTODIAGNOSTIC</strong>.</p><dl class="access-details"><dt>Professionnel</dt><dd>${esc(name||'Votre compte Grist')}</dd><dt>UGECAM</dt><dd>${esc(ug||'Selon votre rattachement validé')}</dd><dt>Profil</dt><dd>${esc(profile==='DNGU'?'DNGU':profile==='SIEGE'?'Siège UGECAM':'Référent ESMS / site')}</dd><dt>Périmètre Autodiag</dt><dd>${esc(scope)}</dd></dl><p>Pour corriger vos informations ou votre rattachement, contactez l’administrateur MOAD.</p>${stateRefreshButton()}</section>`}

function show(){const own=S.owner?[]:S.requests;S.stage=accessStage(own);const validated=own.find(r=>r.STATUT==='Validé');if(validated){app.innerHTML=introduction()+validatedState(validated);bindStatusRefresh();return}const pending=own.find(r=>r.STATUT==='À valider');if(pending){app.innerHTML=introduction()+'<section class="access-state"><h2>Demande en attente</h2><p>Votre rattachement professionnel sera vérifié par un administrateur MOAD. Cette page affichera automatiquement la validation de votre demande.</p>'+stateRefreshButton()+'</section>';bindStatusRefresh();return}const c=S.self;
app.innerHTML=introduction()+`<h2>Votre accès MOAD</h2><p>Adresse de connexion : <b>${esc(S.email||'Adresse du compte Grist, renseignée automatiquement')}</b></p><form id="form" class="grid"><label>Prénom<input id="prenom" required value="${esc(c?.PRENOM)}"></label><label>Nom<input id="nom" required value="${esc(c?.NOM)}"></label><label>Fonction<select id="fonction" required><option value="">Choisir…</option>${S.f.map(f=>`<option value="${f[0]}" ${+c?.FONCTION===f[0]?'selected':''}>${esc(f[1])}</option>`).join('')}</select></label><label>UGECAM<select id="ugecam" required><option value="">Choisir…</option>${S.u.map(u=>`<option value="${u.id}" ${+c?.UGECAM===u.id?'selected':''}>${esc(u.UGECAM)}</option>`).join('')}</select></label><label>Profil demandé<select id="profil"><option value="SITE">Professionnel de site</option><option value="SIEGE" ${c?.SIEGE?'selected':''}>Siège UGECAM</option><option value="DNGU" ${c?.DNGU?'selected':''}>DNGU</option></select></label><label>Site principal<select id="site"><option value="">Choisir…</option></select></label><fieldset class="wide"><legend>Autres sites en responsabilités</legend><div id="responsabilites"></div></fieldset><p class="wide">Les ESMS/services seront déduits automatiquement du site principal et des autres sites en responsabilité après validation.</p><div class="privacy wide"><b>Finalités :</b> gérer l’inscription, le rattachement et les habilitations MOAD.<br><b>Données traitées :</b> nom, prénom, mail professionnel, téléphone professionnel, fonction, UGECAM, sites et habilitations.<br><b>Vos droits :</b> demandez l’accès ou la rectification de vos données et contactez le DPO de votre organisme.<br><b>Confidentialité et sécurité :</b> accès limité aux personnes habilitées selon leur périmètre.</div><label class="check wide"><input type="checkbox" required>Je confirme l’exactitude de ces informations professionnelles.</label><div class="wide"><button id="submit">Soumettre à validation</button><p id="msg" role="status"></p></div></form>`;
const u=document.getElementById('ugecam'),s=document.getElementById('site'),p=document.getElementById('profil');
function fill(){const a=S.s.filter(s=>+s.UGECAM===+u.value);s.innerHTML='<option value="">Choisir…</option>'+a.map(x=>`<option value="${x.id}">${esc(x.NOM)}</option>`).join('');document.getElementById('responsabilites').innerHTML=a.map(x=>`<label class="check"><input name="responsabilite" type="checkbox" value="${x.id}" ${list(c?.SITES_RESP_AIRMES).includes(x.id)?'checked':''}>${esc(x.NOM)}</label>`).join('')||'Choisissez une UGECAM.';profile()}

u.onchange=fill;p.onchange=profile;fill();s.value=c?.SITE_PRINCIPAL||'';
