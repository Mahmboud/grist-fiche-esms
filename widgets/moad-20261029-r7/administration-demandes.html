<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validation des accès</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><script src="moad-api.js"></script><style>body{font:14px system-ui;background:#f4f7fb;color:#243b50;margin:24px}main{max-width:1050px;margin:auto}.card{padding:20px;background:white;border:1px solid #dbe5ef;border-radius:12px;margin:16px 0}.meta{color:#60768a;font-size:13px}button{padding:9px 14px;margin:8px 8px 0 0;border:1px solid #bdd2e5;border-radius:7px;background:#eaf3ff;cursor:pointer}button:disabled{opacity:.5}#message{white-space:pre-line;color:#9a3412}label{display:block;margin:6px 0}</style></head><body><main><small>Validation par le propriétaire</small><h1>Demandes d’accès</h1><p>La validation applique le profil et le périmètre affichés. Les ESMS sont déduits des sites. Les correspondances non résolues restent à arbitrer.</p><p id="message" role="status"></p><div id="requests">Chargement…</div></main><script>
const S={r:[],c:[],s:[],e:[],u:[],p:[]};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rows=d=>Array.isArray(d)?d:(d.id||[]).map((_,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v[i]])));const ft=async t=>rows(await moadApi.fetchTable(t));const list=v=>Array.isArray(v)?v.filter(x=>typeof x==='number'):[];const site=id=>S.s.find(s=>s.id===+id)?.NOM||'Non renseigné';
function show(){document.getElementById('requests').innerHTML=S.r.filter(r=>r.STATUT==='À valider').map(r=>`<section class="card"><b>${esc(r.PRENOM)} ${esc(r.NOM)}</b><p class="meta">${esc(r.EMAIL)} · Profil demandé : ${esc(r.PROFIL_ACCES)}<br>UGECAM : ${esc(S.u.find(u=>u.id===+r.UGECAM)?.UGECAM)}<br>Site principal : ${esc(site(r.SITE_AIRMES))}<br>Autres sites : ${esc(list(r.SITES_RESP_AIRMES).map(site).join(', ')||'Aucun')}</p><label><input id="autodiag-${r.id}" type="checkbox" checked>Accès Autodiag</label><label><input id="esms-${r.id}" type="checkbox" checked>Accès Liste ESMS / Arborescence</label><label><input id="contacts-${r.id}" type="checkbox">Accès Annuaire Contacts</label><button data-validate="${r.id}">Valider ce profil et ce périmètre</button><button data-refuse="${r.id}">Refuser</button></section>`).join('')||'<p>Aucune demande en attente.</p>';document.querySelectorAll('[data-validate]').forEach(b=>b.onclick=()=>validate(+b.dataset.validate,b));document.querySelectorAll('[data-refuse]').forEach(b=>b.onclick=()=>refuse(+b.dataset.refuse,b))}
async function validate(id,b){b.disabled=true;try{await reload(false);const r=S.r.find(r=>r.id===id);if(!r||r.STATUT!=='À valider')throw Error('La demande a déjà été traitée.');const email=String(r.EMAIL||'').trim().toLowerCase(),cc=S.c.filter(c=>String(c.EMAIL||'').trim().toLowerCase()===email);if(!email||cc.length>1)throw Error('Email absent ou plusieurs contacts correspondants : arbitrage requis.');if(!['SITE','SIEGE','DNGU'].includes(r.PROFIL_ACCES))throw Error('Profil non reconnu.');if(!S.u.some(u=>u.id===+r.UGECAM))throw Error('UGECAM non reconnue.');const siege=r.PROFIL_ACCES==='SIEGE',dngu=r.PROFIL_ACCES==='DNGU',scope=siege||dngu?[]:[...new Set([+r.SITE_AIRMES,...list(r.SITES_RESP_AIRMES)])];if(!siege&&!dngu&&(!+r.SITE_AIRMES||scope.some(id=>!S.s.some(s=>s.id===id&&+s.UGECAM===+r.UGECAM))))throw Error('Site absent ou hors de l’UGECAM demandée.');const esms=S.e.filter(e=>dngu||(siege?+e.UGECAM===+r.UGECAM:scope.includes(+e.SITE))).map(e=>e.id),cid=cc[0]?.id||Math.max(0,...S.c.map(c=>c.id))+1;
const f={EMAIL:email,NOM:r.NOM,PRENOM:r.PRENOM,FONCTION:+r.FONCTION,UGECAM:+r.UGECAM,SITE_PRINCIPAL:siege||dngu?0:+r.SITE_AIRMES,SITES_RESP_AIRMES:['L',...scope.filter(id=>id!==+r.SITE_AIRMES)],SIEGE:siege,DNGU:dngu,ACCES:document.getElementById('autodiag-'+id).checked,ACCES_LISTE_ESMS:document.getElementById('esms-'+id).checked,ACCES_ARBORESCENCE:document.getElementById('esms-'+id).checked,ACCES_CONTACTS:document.getElementById('contacts-'+id).checked};
// Both writes form one Grist transaction. A concurrent explicit-ID conflict
// fails atomically; reloading permits a safe retry without a duplicate contact.
const actions=[[cc.length?'UpdateRecord':'AddRecord','CONTACTS',cid,f],['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Validé',CONTACT:cid,ESMS_AIRMES:['L',...esms],DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Propriétaire Grist'}]];
if(!S.p.some(p=>+p.CONTACT===cid))actions.push(['AddRecord','PROFIL_SESSION',Math.max(0,...S.p.map(p=>p.id))+1,{CONTACT:cid}]);await moadApi.applyUserActions(actions);await reload()}catch(e){document.getElementById('message').textContent=e.message;b.disabled=false}}
async function refuse(id,b){b.disabled=true;try{await moadApi.applyUserActions([['UpdateRecord','DEMANDES_ACCES',id,{STATUT:'Refusé',DATE_VALIDATION:Date.now()/1000,VALIDE_PAR:'Propriétaire Grist'}]]);await reload()}catch(e){document.getElementById('message').textContent=e.message;b.disabled=false}}
async function reload(render=true){[S.r,S.c,S.s,S.e,S.u,S.p]=await Promise.all([ft('DEMANDES_ACCES'),ft('CONTACTS'),ft('SITES'),ft('ESMS'),ft('UGECAM'),ft('PROFIL_SESSION')]);if(render)show()}
(async()=>{try{await grist.ready({requiredAccess:'full'});await ft('ADMIN_OUTILS');await reload()}catch{document.getElementById('requests').textContent='Accès réservé au propriétaire.'}})();
</script></body></html>
