name: Protect immutable production widgets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production hashes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_prod_immutable.py "$BASE_SHA"
