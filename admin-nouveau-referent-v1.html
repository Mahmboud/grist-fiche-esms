<!doctype html><html lang="fr"><head><meta charset="utf-8"><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>body{font:14px system-ui;background:#f5f7fb;color:#172033;margin:0;padding:16px}main{max-width:920px;margin:auto;background:#fff;border:1px solid #dde5ee;border-radius:14px;padding:18px}h1{margin-top:0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}input,select{padding:9px;border:1px solid #ccd5e0;border-radius:8px}.checks{border:1px solid #dde5ee;border-radius:9px;padding:8px}.checks label{display:inline-block;margin:4px 10px 4px 0}.sub{font-size:11px;color:#64748b}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.ok{color:#15803d;font-weight:700}.err{color:#b42318;font-weight:700}@media(max-width:650px){.g{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><h1>➕ Nouveau référent</h1><p class="sub">Création directe d’un contact. Les ESMS visibles seront déduits automatiquement du ou des sites Airmes rattachés.</p><form id="form" class="g">
<div class="f"><label>Prénom *</label><input id="prenom" required></div><div class="f"><label>Nom *</label><input id="nom" required></div>
<div class="f"><label>Email professionnel *</label><input id="email" type="email" required></div><div class="f"><label>Fonction *</label><select id="fonction" required></select></div>
<div class="f"><label>UGECAM *</label><select id="ugecam" required></select></div><div class="f"><label>Site principal *</label><select id="site" required disabled><option value="">Choisir…</option></select></div>
<div class="f"><label>Profil</label><select id="profil"><option value="site">Site</option><option value="siege">Siège</option><option value="dngu">DNGU</option></select></div>
<div class="f wide"><label>Autres sites en responsabilité</label><div id="multiSites" class="checks">Choisissez une UGECAM.</div></div>
<div class="wide"><button>Créer le référent</button> <span id="msg"></span></div></form></main>
<script>
const S={fonctions:[],ugecam:[],sites:[],contacts:[]},$=id=>document.getElementById(id);
const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(v=>Array.isArray(v)?v.length:0))},(_,i)=>Object.fromEntries(Object.entries(d||{}).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));
const ft=async t=>rows(await grist.docApi.fetchTable(t));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fillFunctions(){$('fonction').innerHTML='<option value="">Choisir…</option>'+S.fonctions.slice().sort((a,b)=>String(a.LIBELLE).localeCompare(String(b.LIBELLE),'fr')).map(r=>'<option value="'+r.id+'">'+esc(r.LIBELLE)+'</option>').join('')}
function fillUgecam(){$('ugecam').innerHTML='<option value="">Choisir…</option>'+S.ugecam.slice().sort((a,b)=>String(a.UGECAM).localeCompare(String(b.UGECAM),'fr')).map(r=>'<option value="'+r.id+'">'+esc(r.UGECAM)+'</option>').join('')}
function fillSites(){const uid=Number($('ugecam').value),a=S.sites.filter(r=>Number(r.UGECAM)===uid).sort((x,y)=>String(x.NOM_SITE).localeCompare(String(y.NOM_SITE),'fr'));$('site').disabled=!uid;$('site').innerHTML='<option value="">Choisir…</option>'+a.map(r=>'<option value="'+r.id+'">'+esc(r.NOM_SITE)+'</option>').join('');$('multiSites').innerHTML=a.filter(r=>!['SIEGE','DNGU'].includes(String(r.TYPE_SITE||'').toUpperCase())).map(r=>'<label><input name="multiSite" type="checkbox" value="'+r.id+'"> '+esc(r.NOM_SITE)+'</label>').join('')||'Aucun autre site.'}
$('ugecam').onchange=fillSites;
$('form').onsubmit=async e=>{e.preventDefault();const msg=$('msg');msg.className='';msg.textContent='';try{
 const email=$('email').value.trim().toLowerCase();if(S.contacts.some(c=>String(c.EMAIL||'').trim().toLowerCase()===email))throw new Error('Un contact existe déjà avec cet email.');
 const principal=Number($('site').value),extra=[...document.querySelectorAll('[name=multiSite]:checked')].map(x=>Number(x.value)).filter(x=>x!==principal),profil=$('profil').value;
 const data={NOM:$('nom').value.trim().toUpperCase(),PRENOM:$('prenom').value.trim(),EMAIL:email,FONCTION:Number($('fonction').value),UGECAM:Number($('ugecam').value),SITE_PRINCIPAL:principal,SITES_EN_RESPONSABILITE:['L',...new Set(extra)],Referent_DUI:true,ACCES:true,ACCES_CONTACTS:false,ACCES_LISTE_ESMS:true,ACCES_ARBORESCENCE:true,SIEGE:profil==='siege',DNGU:profil==='dngu'};
 await grist.docApi.applyUserActions([['AddRecord','CONTACTS',null,data]]);S.contacts=await ft('CONTACTS');msg.className='ok';msg.textContent='Référent créé avec succès.';$('form').reset();fillFunctions();fillUgecam();$('site').disabled=true;$('site').innerHTML='<option value="">Choisir…</option>';$('multiSites').textContent='Choisissez une UGECAM.';
}catch(err){console.error(err);msg.className='err';msg.textContent=err?.message||String(err)}};
(async()=>{try{await grist.ready({requiredAccess:'full'});[S.fonctions,S.ugecam,S.sites,S.contacts]=await Promise.all([ft('REFERENTIEL_FONCTIONS'),ft('UGECAM'),ft('SITES'),ft('CONTACTS')]);fillFunctions();fillUgecam()}catch(e){$('msg').className='err';$('msg').textContent='Accès Administration indisponible.'}})();
</script></body></html>
