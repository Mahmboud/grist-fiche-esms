<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthèse Autodiagnostic 2026</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body{padding:12px}input,select,button{font:inherit}#app{max-width:1700px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px;text-align:center;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kpi{padding:12px 14px}.lab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.val{font-size:22px;font-weight:900;margin-top:3px}.card{overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:15px;font-weight:900}.sub{font-size:10.5px;color:var(--muted)}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools input,.tools select,.tools button{border:1px solid #cbd5e1;border-radius:9px;padding:8px;background:#fff;font-size:11.5px}.tableWrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;min-width:1450px}th,td{padding:9px 10px;border-bottom:1px solid #eef2f7;text-align:left;font-size:11px;vertical-align:middle}th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:9.5px;text-transform:uppercase;z-index:2}.site{font-weight:800}.bar{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden;min-width:85px}.fill{height:100%;background:var(--blue)}.mini{display:flex;align-items:center;gap:6px}.pct{font-weight:800;white-space:nowrap}.chip{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:9.5px;font-weight:800;white-space:nowrap}.good{background:var(--greenSoft);color:var(--green)}.mid{background:var(--amberSoft);color:var(--amber)}.low{background:var(--redSoft);color:var(--red)}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"><div class="loading">Chargement de la synthèse…</div></main><script>
const CONFIG={"version":"2026","sections":[{"title":"Transmissions & écrits","sheet":"Transmissions & écrits","questions":[{"id":"Q001","question":"Avez-vous toujours des cahiers de transmission papier sur vos services?","explanation":"Précisez, le cas échéant, les services concernés, les raisons du maintien du papier et si les informations sont ensuite reportées dans Airmes.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q001_Reponse","type":"Choice","label":"Avez-vous toujours des cahiers de transmission papier sur vos services?","choices":["Oui","Partiellement","Non"]},{"col":"Q001_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q002","question":"Les thématiques des transmissions sont-elles renseignées dans Airmes ?","explanation":"Les thématiques couvrent entre autres les catégories de besoins SERAFIN-PH, et permettent de qualifier les faits marquants relatifs aux usagers. Cela facilite notamment la consolidation d'éléments de preuve relatifs à l'évaluation HAS (consentement, participation sociale, …), mais aussi de faire le lien avec les objectifs et la synthèse du projet personnalisé.\nExemple de situation : \nPendant la réunion de projet, la thématique de l'autonomie de la personne est traitée. Je peux aller dans Airmes et rechercher les transmissions avec la thématique \"Autonomie personnelle\" pour les consulter sur la période écoulée, et en tirer une synthèse.\nIndiquez si les thématiques sont renseignées régulièrement et utilisées pour retrouver les éléments du projet personnalisé ou les preuves utiles à l'évaluation HAS.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q002_Reponse","type":"Choice","label":"Les thématiques des transmissions sont-elles renseignées dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q002_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q003","question":"Rédigez-vous des comptes rendus dans Airmes ?","explanation":"Précisez les types de comptes rendus produits et les supports encore utilisés. Indiquez comment sont choisies la rubrique d'accès et la partie « Résumé visible par tous ».","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q003_Reponse","type":"Choice","label":"Rédigez-vous des comptes rendus dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q003_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q004","question":"Les thématiques des comptes rendus sont-elles renseignées dans Airmes ?","explanation":"Les thématiques couvrent entre autres les catégories de besoins SERAFIN-PH, et permettent de qualifier les faits marquants relatifs aux usagers. Cela facilite notamment la consolidation d'éléments de preuve relatifs à l'évaluation HAS (consentement, participation sociale, …), mais aussi de faire le lien avec les objectifs et la synthèse du projet personnalisé.\nExemple de situation : \nPendant la réunion de projet, la thématique de l'autonomie de la personne est traitée. Je peux aller dans Airmes et rechercher les comptes rendus avec la thématique \"Autonomie personnelle\" pour les consulter sur la période écoulée, et en tirer une synthèse.\nPrécisez si les thématiques sont utilisées pour classer et retrouver les comptes rendus, notamment lors de la préparation du projet personnalisé.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q004_Reponse","type":"Choice","label":"Les thématiques des comptes rendus sont-elles renseignées dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q004_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q005","question":"Avez-vous intégré des modèles de comptes rendus dans Airmes ?","explanation":"Airmes permet de créer des modèles personnalisés de compte rendu, que l'on peut sélectionner à la création d'un compte rendu. \nIndiquez les modèles utilisés et leur validation par le service qualité. Précisez les besoins à transmettre à l'administrateur local ou à la MOAD.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q005_Reponse","type":"Choice","label":"Avez-vous intégré des modèles de comptes rendus dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q005_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q006","question":"Utilisez-vous les fiches « Troubles et crises » dans Airmes ?","explanation":"Précisez les situations tracées avec les fiches « Troubles et crises » et leur utilisation pour analyser les incidents, à partir de faits objectifs.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q006_Reponse","type":"Choice","label":"Utilisez-vous les fiches « Troubles et crises » dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q006_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q007","question":"Faites-vous une double saisie dans votre logiciel de qualité sur certains des événéments?","explanation":"Précisez la répartition entre Airmes et le logiciel qualité. Pour les signalements et EIG, le guide prévoit un dossier institutionnel sécurisé et une mention minimale dans le DUI si nécessaire","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q007_Reponse","type":"Choice","label":"Faites-vous une double saisie dans votre logiciel de qualité sur certains des événéments?","choices":["Oui","Partiellement","Non"]},{"col":"Q007_Precisions","type":"Text","label":"Précisions"}]}],"notes":true,"notes_col":"S01_Notes"},{"title":"Admissions & documents","sheet":"Admissions & documents","questions":[{"id":"Q008","question":"Quelles fonctionnalités d'Airmes utilisez-vous pour suivre et gérer les préadmissions ?","explanation":"Précisez si vous utilisez la liste d'attente ou un service de préadmission, les étapes suivies et les outils complémentaires. Le recueil est limité aux informations nécessaires à l'admission.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q008_Reponse","type":"Choice","label":"Quelles fonctionnalités d'Airmes utilisez-vous pour suivre et gérer les préadmissions ?","choices":["Oui","Partiellement","Non"]},{"col":"Q008_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q009","question":"Avez-vous intégré dans Airmes des modèles de documents pour le publipostage (courriers, attestations, etc.) ?","explanation":"Précisez les modèles utilisés (courriers, attestations, contrats) et les champs dynamiques mobilisés pour le préremplissage à partir du parcours de vie.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q009_Reponse","type":"Choice","label":"Avez-vous intégré dans Airmes des modèles de documents pour le publipostage (courriers, attestations, etc.) ?","choices":["Oui","Partiellement","Non"]},{"col":"Q009_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q010","question":"Utilisez-vous le module « Outil de requête » d’Airmes ?","explanation":"Indiquez si vous utilisez des requêtes existantes ou personnalisées pour consulter les données du parcours de vie, vérifier leur complétude ou produire des listes.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q010_Reponse","type":"Choice","label":"Utilisez-vous le module « Outil de requête » d’Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q010_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q011","question":"Si oui, à quelles fins utilisez-vous ce module et avez-vous des remarques à son sujet ?","explanation":"Indiquez les données et filtres utilisés, les exports réalisés et les difficultés d'accès. Les données accessibles dépendent du profil d'habilitation.","raw_type":"bloc texte libre","kind":"text","fields":[{"col":"Q011_Texte","type":"Text","label":"Si oui, à quelles fins utilisez-vous ce module et avez-vous des remarques à son sujet ?"}]}],"notes":true,"notes_col":"S02_Notes"},{"title":"Agenda & présences","sheet":"Agenda & présences","questions":[{"id":"Q012","question":"Utilisez-vous d'autres supports d'agenda que celui d'Airmes (papier ou numérique) pour organiser les services ?","explanation":"Précisez les supports complémentaires utilisés, les équipes concernées et les raisons de leur maintien.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q012_Reponse","type":"Choice","label":"Utilisez-vous d'autres supports d'agenda que celui d'Airmes (papier ou numérique) pour organiser les services ?","choices":["Oui","Partiellement","Non"]},{"col":"Q012_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q013","question":"Le champ « Activité » est-il renseigné pour les événements de l'agenda Airmes ?","explanation":"Le champ « Activité » intègre la nomenclature des prestations SERAFIN-PH. Il doit être complété pour les prestations à comptabiliser dans l'outil de mesure de l'activité de la MOAD. Cette catégorisation permet également de suivre les prestations mobilisées pour les objectifs du projet personnalisé.\nPrécisez si l'activité SERAFIN-PH est renseignée pour les prestations à comptabiliser, avec les participants, leur présence et, si nécessaire, le lieu « Prestations en milieu ordinaire ».","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q013_Reponse","type":"Choice","label":"Le champ « Activité » est-il renseigné pour les événements de l'agenda Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q013_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q014","question":"Utilisez-vous les résumés d'activités pour rendre compte des activités réalisées ?","explanation":"Indiquez si les résumés sont rédigés depuis l'événement, pour le groupe ou par participant, afin de relier les observations à la séance et au suivi du projet personnalisé.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q014_Reponse","type":"Choice","label":"Utilisez-vous les résumés d'activités pour rendre compte des activités réalisées ?","choices":["Oui","Partiellement","Non"]},{"col":"Q014_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q015","question":"Avez-vous mis en place le suivi des présences/absences dans Airmes ?","explanation":"Précisez qui valide et enregistre les présences au début de chaque créneau, comment sont distinguées absences et neutralisations, et comment sont traités les écarts.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q015_Reponse","type":"Choice","label":"Avez-vous mis en place le suivi des présences/absences dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q015_Precisions","type":"Text","label":"Précisions"}]}],"notes":true,"notes_col":"S03_Notes"},{"title":"Soins & médicaments","sheet":"Soins & médicaments","questions":[{"id":"Q016","question":"Les prescriptions sont-elles directement rédigées depuis Airmes?","explanation":"Précisez les prescripteurs concernés et, le cas échéant, les situations dans lesquelles les prescriptions sont établies hors d'Airmes.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q016_Reponse","type":"Choice","label":"Les prescriptions sont-elles directement rédigées depuis Airmes?","choices":["Oui","Partiellement","Non"]},{"col":"Q016_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q017","question":"Sont-elles toutes rédigées par le médecin de la structure?","explanation":"","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q017_Reponse","type":"Choice","label":"Sont-elles toutes rédigées par le médecin de la structure?","choices":["Oui","Partiellement","Non"]},{"col":"Q017_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q018","question":"Importez-vous les prescriptions extérieures dans les box usagers Airmes?","explanation":"Indiquez où sont classées les prescriptions externes, comment elles sont actualisées et quelles étiquettes limitent leur accès aux professionnels habilités.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q018_Reponse","type":"Choice","label":"Importez-vous les prescriptions extérieures dans les box usagers Airmes?","choices":["Oui","Partiellement","Non"]},{"col":"Q018_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q019","question":"Faites-vous de l'aide à la prise de médicaments ?","explanation":"","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q019_Reponse","type":"Choice","label":"Faites-vous de l'aide à la prise de médicaments ?","choices":["Oui","Non"]},{"col":"Q019_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q020","question":"Si oui, tracez-vous cette aide à la prise des médicaments dans Airmes ?","explanation":"Le suivi d'administration des médicaments se fait depuis le plan de soins/traitement d'Airmes.\nPrécisez les professionnels qui enregistrent les suivis, le créneau concerné et le traitement des alertes de suivi non renseigné, notamment via une transmission ciblée.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q020_Reponse","type":"Choice","label":"Si oui, tracez-vous cette aide à la prise des médicaments dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q020_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q021","question":"Si vous ne faites pas les suivis d'aide à la prise des médicaments dans Airmes, pouvez-vous en expliquer la raison?","explanation":"","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q021_Reponse","type":"Choice","label":"Si vous ne faites pas les suivis d'aide à la prise des médicaments dans Airmes, pouvez-vous en expliquer la raison?","choices":["Oui","Partiellement","Non"]},{"col":"Q021_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q022","question":"Utilisez-vous au quotidien les plans de soin/nursing dans Airmes?","explanation":"Précisez les soins suivis au quotidien, les modalités d'enregistrement et de traitement des alertes, ainsi que les supports complémentaires utilisés.","raw_type":"bloc texte libre","kind":"text","fields":[{"col":"Q022_Texte","type":"Text","label":"Utilisez-vous au quotidien les plans de soin/nursing dans Airmes?"}]}],"notes":true,"notes_col":"S04_Notes"},{"title":"Projet personnalisé","sheet":"Projet personnalisé","questions":[{"id":"Q023","question":"Comment recueillez-vous les attentes de la personne (guide d'entretien, …)?","explanation":"Précisez les modalités de recueil et les supports adaptés (FALC, communication alternative, etc.). Distinguez les souhaits de la personne de ceux de son entourage.","raw_type":"bloc texte libre","kind":"text","fields":[{"col":"Q023_Texte","type":"Text","label":"Comment recueillez-vous les attentes de la personne (guide d'entretien, …)?"}]},{"id":"Q024","question":"Reportez-vous les attentes de l'usager dans le bloc \"Attentes\" du projet personnalisé d'Airmes?","explanation":"Indiquez comment les attentes sont actualisées lors de la révision du projet et à chaque évolution significative, en identifiant leur origine : personne, entourage ou professionnels.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q024_Reponse","type":"Choice","label":"Reportez-vous les attentes de l'usager dans le bloc \"Attentes\" du projet personnalisé d'Airmes?","choices":["Oui","Partiellement","Non"]},{"col":"Q024_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q025","question":"Les objectifs du PP de la personne sont-ils directement intégrés dans Airmes?","explanation":"Précisez comment les objectifs sont coconstruits et reliés aux besoins et attentes. Indiquez si chaque objectif comporte des actions, des moyens et un mode d'évaluation défini.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q025_Reponse","type":"Choice","label":"Les objectifs du PP de la personne sont-ils directement intégrés dans Airmes?","choices":["Oui","Non"]},{"col":"Q025_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q026","question":"Utilisez-vous les items d'évaluation d'Airmes en lien avec les objectifs ?","explanation":"Indiquez le mode d'évaluation utilisé (libre, grille ou quantifiable), les professionnels concernés et la façon dont les résultats contribuent à ajuster les objectifs.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q026_Reponse","type":"Choice","label":"Utilisez-vous les items d'évaluation d'Airmes en lien avec les objectifs ?","choices":["Oui","Non"]},{"col":"Q026_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q027","question":"Pour les grilles d'évaluation en dehors d'Airmes, comment les intégrez-vous aux dossiers des usagers?","explanation":"Précisez comment les grilles et bilans externes sont intégrés au dossier, notamment en pièces jointes de comptes rendus, avec une rubrique d'accès adaptée.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q027_Reponse","type":"Choice","label":"Pour les grilles d'évaluation en dehors d'Airmes, comment les intégrez-vous aux dossiers des usagers?","choices":["Oui","Non"]},{"col":"Q027_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q028","question":"Par quels moyens suivez-vous le calendrier des étapes du projet personnalisé ?","explanation":"Précisez si les étapes sont planifiées dans le calendrier du projet ou la liste des projets du service, et si les échéances sont générées puis confirmées après réalisation.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q028_Reponse","type":"Choice","label":"Par quels moyens suivez-vous le calendrier des étapes du projet personnalisé ?","choices":["Oui","Non"]},{"col":"Q028_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q029","question":"Utilisez-vous Airmes pour l'édition de vos projets personnalisés?","explanation":"Indiquez le modèle utilisé, les reprises manuelles nécessaires et le classement de la version remise. Précisez si le statut du projet est validé pour maintenir le suivi des objectifs actif.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q029_Reponse","type":"Choice","label":"Utilisez-vous Airmes pour l'édition de vos projets personnalisés?","choices":["Oui","Partiellement","Non"]},{"col":"Q029_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q030","question":"Editez-vous les contrats de séjour à partir d'Airmes?","explanation":"Précisez les modèles générés depuis l'onglet « Pièces jointes » du projet, le classement des copies signées et le renseignement des signatures dans le parcours de vie.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q030_Reponse","type":"Choice","label":"Editez-vous les contrats de séjour à partir d'Airmes?","choices":["Oui","Partiellement","Non"]},{"col":"Q030_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q031","question":"Où sont tracés/enregistrés les consentements des usagers/familles relatifs au PP?","explanation":"Précisez comment l'accord, le refus et les observations sont tracés et réactualisés. Le guide propose une transmission avec la thématique « Droits et citoyenneté ».","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q031_Reponse","type":"Choice","label":"Où sont tracés/enregistrés les consentements des usagers/familles relatifs au PP?","choices":["Oui","Partiellement","Non"]},{"col":"Q031_Precisions","type":"Text","label":"Précisions"}]}],"notes":true,"notes_col":"S05_Notes"},{"title":"Comptes & accès","sheet":"Comptes & accès","questions":[{"id":"Q032","question":"Avez-vous ouvert des comptes utilisateurs à des professionnels non salariés UGECAM?","explanation":"Les partenaires extérieurs (médecins traitants, pharmaciens, professionnels de l'Éducation nationale, etc.) peuvent disposer d'un accès au DUI selon leurs missions et leurs habilitations. Un accès hors RAMAGE est nécessaire lorsqu'ils utilisent un équipement extérieur au réseau UGECAM.\nPrécisez les partenaires concernés, leurs profils et services d'affectation, ainsi que les modalités de revue et de retrait de leurs accès à la fin de l'intervention.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q032_Reponse","type":"Choice","label":"Avez-vous ouvert des comptes utilisateurs à des professionnels non salariés UGECAM?","choices":["Oui","Non"]},{"col":"Q032_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q033","question":"Avez-vous paramétré l'accès en dehors du réseau RAMAGE pour certains utilisateurs?","explanation":"Il est possible d'ouvrir l'accès à Airmes en dehors du réseau RAMAGE, notamment pour les accès depuis une tablette ou un téléphone portable, ou depuis un PC hors UGECAM. Il est également nécessaire que les administrateurs locaux aient un accès paramétré hors RAMAGE en cas d'indisponibilité du réseau AM. Le paramétrage de l'accès hors RAMAGE se fait depuis la sécurité du compte, en mettant un * dans les IP autorisées. L'activation sécurisée à deux facteurs doit être activée dans ce cas (ProSantéConnect, QR code Airmes, ...).\nIndiquez les utilisateurs concernés (partenaires, mobilité, PCA), la procédure d'autorisation et le moyen d'authentification renforcée utilisé hors RAMAGE.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q033_Reponse","type":"Choice","label":"Avez-vous paramétré l'accès en dehors du réseau RAMAGE pour certains utilisateurs?","choices":["Oui","Non"]},{"col":"Q033_Precisions","type":"Text","label":"Précisions"}]}],"notes":true,"notes_col":"S06_Notes"},{"title":"Statistiques et rapports de données","sheet":"Statistiques et rapports de don","questions":[{"id":"Q034","question":"Réalisez-vous des mesures d'activité (comptabilisation des actes) à partir de l'agenda Airmes ?","explanation":"Précisez les extractions utilisées, la période et les services retenus. Indiquez comment sont contrôlés les activités, les participants, les absences et les annulations.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q034_Reponse","type":"Choice","label":"Réalisez-vous des mesures d'activité (comptabilisation des actes) à partir de l'agenda Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q034_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q035","question":"Calculez-vous des indicateurs (par exemple le taux d'occupation) à partir du suivi des présences dans Airmes ?","explanation":"Indiquez les indicateurs calculés et les contrôles sur les créneaux validés, les présences administratives, les absences et les neutralisations.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q035_Reponse","type":"Choice","label":"Calculez-vous des indicateurs (par exemple le taux d'occupation) à partir du suivi des présences dans Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q035_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q036","question":"Utilisez-vous l'outil de la MOAD pour mesurer l'activité à partir du suivi des présences des usagers ?","explanation":"Précisez les extractions d'historique utilisées, la période étudiée et les difficultés pour distinguer les journées, demi-journées et nuits selon les statuts paramétrés.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q036_Reponse","type":"Choice","label":"Utilisez-vous l'outil de la MOAD pour mesurer l'activité à partir du suivi des présences des usagers ?","choices":["Oui","Partiellement","Non"]},{"col":"Q036_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q037","question":"Utilisez-vous l'outil de la MOAD pour mesurer l'activité à partir de l'agenda ?","explanation":"Précisez les indicateurs produits et les contrôles sur la catégorisation SERAFIN-PH. Indiquez si le lieu « Prestations en milieu ordinaire » est exploité lorsque pertinent.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q037_Reponse","type":"Choice","label":"Utilisez-vous l'outil de la MOAD pour mesurer l'activité à partir de l'agenda ?","choices":["Oui","Partiellement","Non"]},{"col":"Q037_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q038","question":"Utilisez-vous l'outil d'aide à la réalisation du rapport FAGERH (pour les ESMS de réadaptation professionnelle concernés) ?","explanation":"Pour les structures concernées, indiquez si les données de réadaptation professionnelle du parcours de vie sont complétées et quels retraitements restent nécessaires.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q038_Reponse","type":"Choice","label":"Utilisez-vous l'outil d'aide à la réalisation du rapport FAGERH (pour les ESMS de réadaptation professionnelle concernés) ?","choices":["Oui","Partiellement","Non"]},{"col":"Q038_Precisions","type":"Text","label":"Précisions"}]}],"notes":true,"notes_col":"S07_Notes"},{"title":"Services socles / DMP","sheet":"Services socles DMP","questions":[{"id":"Q039","question":"À votre connaissance, certains professionnels se sont-ils déjà connectés à Airmes via Pro Santé Connect (en utilisant la carte CPS ou l'application eCPS) ?","explanation":"Pro Santé Connect est un dispositif d'authentification des professionnels. Précisez les usages et les difficultés éventuelles rencontrées.\nPrécisez les profils utilisateurs, le rattachement du numéro RPPS à leur compte et les difficultés d'activation de l'e-CPS ou de connexion via Pro Santé Connect.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q039_Reponse","type":"Choice","label":"À votre connaissance, certains professionnels se sont-ils déjà connectés à Airmes via Pro Santé Connect (en utilisant la carte CPS ou l'application eCPS) ?","choices":["Oui","Non"]},{"col":"Q039_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q040","question":"L'INS des usagers sont-ils systématiquement rapatriés dans le DUI?","explanation":"La bonne identification des personnes accompagnées repose sur les procédures d'identitovigilance et les conditions de qualification de l'INS. Les situations particulières doivent être prises en compte.\nPrécisez les difficultés de validation de l'identité ou de récupération de l'INS. Indiquez si la vue « Identitovigilance » du dossier service est utilisée pour suivre les dossiers à régulariser.","raw_type":"Oui;Plutôt bien;Pas du tout + bloc texte libre","kind":"choice","choices":["Oui","Plutôt bien","Pas du tout"],"fields":[{"col":"Q040_Reponse","type":"Choice","label":"L'INS des usagers sont-ils systématiquement rapatriés dans le DUI?","choices":["Oui","Plutôt bien","Pas du tout"]},{"col":"Q040_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q041","question":"Continuez-vous d'alimenter le DMP des usagers depuis Airmes ? Merci de préciser les types de documents envoyés","explanation":"L'alimentation du DMP doit respecter les règles applicables aux documents concernés, à l'information des personnes et à leurs droits. Précisez les pratiques effectives de la structure.\nIndiquez les documents finalisés produits par le service et transmis au DMP, leur typage, les difficultés rencontrées et les modalités d'information de la personne.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q041_Reponse","type":"Choice","label":"Continuez-vous d'alimenter le DMP des usagers depuis Airmes ? Merci de préciser les types de documents envoyés","choices":["Oui","Non"]},{"col":"Q041_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q042","question":"Consultez-vous le DMP directement depuis Airmes?","explanation":"L'accès au DMP dépend du rôle du professionnel, de son habilitation et des règles applicables à la consultation ; il ne doit pas être présenté comme ouvert indistinctement à tous les professionnels.\nPrécisez les professionnels habilités, le moyen d'authentification utilisé (CPS ou Pro Santé Connect) et les modalités de traçabilité de l'information et de l'accord de la personne.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q042_Reponse","type":"Choice","label":"Consultez-vous le DMP directement depuis Airmes?","choices":["Oui","Non"]},{"col":"Q042_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q043","question":"Utilisez-vous la messagerie sécurisée de santé depuis Airmes ?","explanation":"Précisez les échanges avec les partenaires ou la personne accompagnée via Mon espace santé, les documents transmis et les besoins de réception de pièces externes.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q043_Reponse","type":"Choice","label":"Utilisez-vous la messagerie sécurisée de santé depuis Airmes ?","choices":["Oui","Non"]},{"col":"Q043_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q044","question":"Avez-vous besoin d'accéder à une messagerie MSS nominative ou organisationnelle directement depuis Airmes ?","explanation":"Airmes permet d'accéder directement depuis son interface à la messagerie Médimail : vous pouvez y consulter les messages reçus, et en rédiger depuis cette interface.\nPrécisez les boîtes nominatives ou organisationnelles concernées et les difficultés de paramétrage dans Airmes et Médimail, notamment les accès des professionnels aux boîtes partagées.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q044_Reponse","type":"Choice","label":"Avez-vous besoin d'accéder à une messagerie MSS nominative ou organisationnelle directement depuis Airmes ?","choices":["Oui","Non"]},{"col":"Q044_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q045","question":"Les personnels administratifs utilisent-ils une carte CPE pour les opérations d'identification ou les échanges avec les services socles ?","explanation":"Indiquez les démarches réalisées avec la carte CPE, notamment l'habilitation des gestionnaires RPPS+, et les besoins d'accompagnement des personnels administratifs.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q045_Reponse","type":"Choice","label":"Les personnels administratifs utilisent-ils une carte CPE pour les opérations d'identification ou les échanges avec les services socles ?","choices":["Oui","Non"]},{"col":"Q045_Precisions","type":"Text","label":"Précisions"}]}],"notes":true,"notes_col":"S08_Notes"},{"title":"Informatique & PCA","sheet":"Informatique & PCA","questions":[{"id":"Q046","question":"L'équipement informatique déployé (postes fixes, ordinateurs portables, réseau Internet) répond-il à vos besoins d'accès à Airmes ?","explanation":"Précisez les contraintes rencontrées (disponibilité des postes, mobilité, réseau, performances, accès partagés) et les équipes concernées.","raw_type":"Oui;Plutôt bien;Non + bloc texte libre","kind":"choice","choices":["Oui","Plutôt bien","Non"],"fields":[{"col":"Q046_Reponse","type":"Choice","label":"L'équipement informatique déployé (postes fixes, ordinateurs portables, réseau Internet) répond-il à vos besoins d'accès à Airmes ?","choices":["Oui","Plutôt bien","Non"]},{"col":"Q046_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q047","question":"L'utilisation d'une tablette pour accéder au DUI présenterait-elle un intérêt pour votre structure ? Si oui, précisez les usages envisagés.","explanation":"L'usage de la tablette pour le DUI doit être encadré par les RSI : sécurité du matériel, authentification renforcée et accompagnement des utilisateurs. Les solutions techniques de sécurisation devraient être identifiées début 2027.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q047_Reponse","type":"Choice","label":"L'utilisation d'une tablette pour accéder au DUI présenterait-elle un intérêt pour votre structure ? Si oui, précisez les usages envisagés.","choices":["Oui","Non"]},{"col":"Q047_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q048","question":"L'utilisation d'une tablette pour accéder au DUI présenterait-elle un intérêt pour votre structure ? Si oui, précisez les usages envisagés.","explanation":"L'usage de la tablette pour le DUI doit être encadré par les RSI : sécurité du matériel, authentification renforcée et accompagnement des utilisateurs. Les solutions techniques de sécurisation devraient être identifiées début 2027.","raw_type":"Oui;Non + bloc texte libre","kind":"choice","choices":["Oui","Non"],"fields":[{"col":"Q048_Reponse","type":"Choice","label":"L'utilisation d'une tablette pour accéder au DUI présenterait-elle un intérêt pour votre structure ? Si oui, précisez les usages envisagés.","choices":["Oui","Non"]},{"col":"Q048_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q049","question":"Savez-vous quoi faire si vous n’avez plus accès à Airmes ?","explanation":"Précisez les premières vérifications et les actions à engager : tester l’accès à Internet, vérifier si d’autres postes ou professionnels sont concernés, puis signaler l’incident.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q049_Reponse","type":"Choice","label":"Savez-vous quoi faire si vous n’avez plus accès à Airmes ?","choices":["Oui","Partiellement","Non"]},{"col":"Q049_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q050","question":"Savez-vous qui contacter en cas d’indisponibilité d’Airmes, y compris en soirée ou le week-end ?","explanation":"Indiquez où retrouver les coordonnées du RSI UGECAM, du support Airmes et de son astreinte, ainsi que les destinataires du signalement.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q050_Reponse","type":"Choice","label":"Savez-vous qui contacter en cas d’indisponibilité d’Airmes, y compris en soirée ou le week-end ?","choices":["Oui","Partiellement","Non"]},{"col":"Q050_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q051","question":"Connaissez-vous les conditions de déclenchement du PCA DUI et les personnes autorisées à l’activer dans votre établissement ?","explanation":"Précisez le circuit de décision. Le support prévoit un délai maximal de quatre heures, avec un déclenchement plus rapide, voire immédiat, selon l’urgence, notamment lors de la distribution des médicaments.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q051_Reponse","type":"Choice","label":"Connaissez-vous les conditions de déclenchement du PCA DUI et les personnes autorisées à l’activer dans votre établissement ?","choices":["Oui","Partiellement","Non"]},{"col":"Q051_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q052","question":"Savez-vous quelle solution utiliser selon que l’indisponibilité concerne le réseau RAMAGE ou Airmes et son hébergeur ?","explanation":"Distinguez l’accès à Airmes hors RAMAGE, avec une connexion externe et une authentification renforcée, de la consultation des fichiers PDF du mode dégradé lorsque le logiciel est indisponible.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q052_Reponse","type":"Choice","label":"Savez-vous quelle solution utiliser selon que l’indisponibilité concerne le réseau RAMAGE ou Airmes et son hébergeur ?","choices":["Oui","Partiellement","Non"]},{"col":"Q052_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q053","question":"Savez-vous comment accéder aux données indispensables à l’accompagnement en mode dégradé et quelles précautions prendre pour les utiliser ?","explanation":"Précisez les professionnels habilités, l’emplacement de l’accès et les documents disponibles. Les copies sont récupérées toutes les 24 heures : leur date doit être prise en compte. Leur transmission doit utiliser un canal sécurisé, sans envoi par Outlook.","raw_type":"Oui;Partiellement;Non + bloc texte libre","kind":"choice","choices":["Oui","Partiellement","Non"],"fields":[{"col":"Q053_Reponse","type":"Choice","label":"Savez-vous comment accéder aux données indispensables à l’accompagnement en mode dégradé et quelles précautions prendre pour les utiliser ?","choices":["Oui","Partiellement","Non"]},{"col":"Q053_Precisions","type":"Text","label":"Précisions"}]}],"notes":false},{"title":"Accompagnement aux usages","sheet":"Accompagnement aux usages","questions":[{"id":"Q054","question":"Quel est votre niveau global de satisfaction concernant le support d'accompagnement d'Airmes (coccinelle, e-mail, téléphone) ?","explanation":"Précisez les délais et le suivi des demandes, ainsi que le canal utilisé : coccinelle pour les utilisateurs habilités, référent local, e-mail ou téléphone.","raw_type":"Très satisfait;Satisfait;Moyennement satisfait;Non satisfait;Ne sollicite pas Airmes + bloc texte libre","kind":"choice","choices":["Très satisfait","Satisfait","Moyennement satisfait","Non satisfait","Ne sollicite pas Airmes"],"fields":[{"col":"Q054_Reponse","type":"Choice","label":"Quel est votre niveau global de satisfaction concernant le support d'accompagnement d'Airmes (coccinelle, e-mail, téléphone) ?","choices":["Très satisfait","Satisfait","Moyennement satisfait","Non satisfait","Ne sollicite pas Airmes"]},{"col":"Q054_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q055","question":"Quel est votre niveau global de satisfaction concernant le support MOAD DUI UGECAM ?","explanation":"Précisez les besoins d'appui aux usages, de documentation ou de paramétrage national, ainsi que les modèles à obtenir auprès de la MOAD.","raw_type":"Très satisfait;Satisfait;Moyennement satisfait;Non satisfait;Ne sollicite pas la MOAD + bloc texte libre","kind":"choice","choices":["Très satisfait","Satisfait","Moyennement satisfait","Non satisfait","Ne sollicite pas la MOAD"],"fields":[{"col":"Q055_Reponse","type":"Choice","label":"Quel est votre niveau global de satisfaction concernant le support MOAD DUI UGECAM ?","choices":["Très satisfait","Satisfait","Moyennement satisfait","Non satisfait","Ne sollicite pas la MOAD"]},{"col":"Q055_Precisions","type":"Text","label":"Précisions"}]},{"id":"Q056","question":"Auriez-vous besoin de sessions de formation Airmes complémentaires pour vos équipes ? Si oui, sur quels modules ?","explanation":"Précisez les profils à former et les modules souhaités. Indique turn[q.fields[0].col]}function answered(r,q){const a=answerCols(q);return q.kind==='priority3'?a.every(c=>!empty(r[c])):a.some(c=>!empty(r[c]))}function counts(r,sec=null){const qs=sec?sec.questions:CONFIG.sections.flatMap(s=>s.questions),done=qs.filter(q=>answered(r,q)).length,total=qs.length;return{done,total,pct:Math.round(done/Math.max(1,total)*100)}}function st(r){const p=counts(r).pct;return p===100?'done':p>0?'started':'empty'}function cls(p){return p>=75?'good':p>=40?'mid':'low'}function filtered(){const q=state.q.trim().toLowerCase();return state.rows.filter(r=>(!q||[r.gristHelper_Display,r.gristHelper_Display2].join(' ').toLowerCase().includes(q))&&(!state.ugecam||r.gristHelper_Display2===state.ugecam)&&(!state.status||st(r)===state.status)).sort((a,b)=>counts(b).pct-counts(a).pct)}function fmt(v){if(empty(v))return'—';const n=Number(v),d=Number.isFinite(n)?new Date(n*1000):new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function render(){const all=state.rows,shown=filtered(),ug=[...new Set(all.map(r=>r.gristHelper_Display2).filter(Boolean))].sort(),avg=all.length?Math.round(all.reduce((s,r)=>s+counts(r).pct,0)/all.length):0,done=all.filter(r=>st(r)==='done').length,started=all.filter(r=>st(r)==='started').length,emptyN=all.filter(r=>st(r)==='empty').length;app.innerHTML=`<div class="kpis"><div class="kpi"><div class="lab">Sites</div><div class="val">${all.length}</div></div><div class="kpi"><div class="lab">Non démarrés</div><div class="val">${emptyN}</div></div><div class="kpi"><div class="lab">En cours</div><div class="val">${started}</div></div><div class="kpi"><div class="lab">Terminés</div><div class="val">${done}</div></div><div class="kpi"><div class="lab">Progression moyenne</div><div class="val">${avg}%</div></div></div><section class="card"><div class="head"><div><div class="title">Pilotage Autodiagnostic 2026</div><div class="sub">58 questions · les précisions et notes ne comptent pas dans la progression${state.lastSync?' · actualisé '+state.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</div></div><div class="tools"><input id="q" placeholder="Rechercher un site…" value="${esc(state.q)}"><select id="u"><option value="">Toutes UGECAM</option>${ug.map(x=>`<option ${x===state.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="s"><option value="">Tous états</option><option value="empty" ${state.status==='empty'?'selected':''}>Non démarrés</option><option value="started" ${state.status==='started'?'selected':''}>En cours</option><option value="done" ${state.status==='done'?'selected':''}>Terminés</option></select><button id="r">Actualiser</button></div></div><div class="tableWrap"><table><thead><tr><th>UGECAM</th><th>Site</th><th>Global</th>${CONFIG.sections.map(s=>`<th>${esc(s.title)}</th>`).join('')}<th>Dernière MAJ</th><th>Par</th></tr></thead><tbody>${shown.map(r=>{const p=counts(r);return`<tr><td>${esc(r.gristHelper_Display2||'')}</td><td class="site">${esc(r.gristHelper_Display||'')}</td><td><div class="mini"><div class="bar"><div class="fill" style="width:${p.pct}%"></div></div><span class="pct">${p.done}/${p.total} · ${p.pct}%</span></div></td>${CONFIG.sections.map(s=>{const x=counts(r,s);return`<td><span class="chip ${cls(x.pct)}">${x.done}/${x.total} · ${x.pct}%</span></td>`}).join('')}<td>${esc(fmt(r.Derniere_mise_a_jour))}</td><td>${esc(r.Derniere_mise_a_jour_par||'—')}</td></tr>`}).join('')}</tbody></table></div></section>`;document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};document.getElementById('u').onchange=e=>{state.ugecam=e.target.value;render()};document.getElementById('s').onchange=e=>{state.status=e.target.value;render()};document.getElementById('r').onclick=refresh}async function refresh(){state.rows=(await ft('Autodiagnostic')).filter(r=>!/^SI[EÈ]GE\b/i.test(String(r.gristHelper_Display||'').trim())&&!/^DNGU\b/i.test(String(r.gristHelper_Display||'').trim()));state.lastSync=new Date();render()} (async()=>{try{await grist.ready({requiredAccess:'full'});await refresh();setInterval(refresh,20000)}catch(e){app.innerHTML='<div class="error">'+esc(e?.message||e)+'</div>'}})();
