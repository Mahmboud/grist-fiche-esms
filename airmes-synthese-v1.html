<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthèse AIRMES</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>
:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select{font:inherit}#app{max-width:1700px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px;text-align:center;color:var(--muted)}.head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.title{font-size:20px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:4px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters input,.filters select,.filters button{border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:8px 10px;font-size:11.5px}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.klabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kvalue{font-size:20px;font-weight:900;margin-top:2px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:14px}.ctitle{font-size:12.5px;font-weight:850;margin-bottom:9px}.barrow{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 45px;gap:8px;align-items:center;margin:6px 0}.barlabel{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}.fill{height:100%;background:#93c5fd;border-radius:999px}.barval{font-size:10.5px;font-weight:800;text-align:right}.tableWrap{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 390px)}table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}thead th{position:sticky;top:0;background:#f8fafc;color:#475569;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.04em;z-index:2}tbody td{padding:9px 10px;border-bottom:1px solid #eef2f7;vertical-align:top}tbody tr:hover{background:#f8fbff}.service{font-weight:850;color:#14532d}.path{color:var(--muted);font-size:10.5px;line-height:1.35}.pill{display:inline-flex;border-radius:999px;padding:3px 7px;font-size:9.5px;font-weight:800;background:var(--blueSoft);color:#1d4ed8}.leafpill{background:var(--greenSoft);color:var(--green)}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:950px){.kpis{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.tableWrap{max-height:none}}</style></head><body><main id="app"><div class="loading">Chargement de la synthèse AIRMES…</div></main><script>
const app=document.getElementById('app');const state={rows:[],ugecam:[],esms:[],q:'',u:'',e:'',type:'',sort:'service'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function rows(d){if(!d)return[];if(Array.isArray(d))return d;const ks=Object.keys(d);const n=Math.max(...ks.map(k=>Array.isArray(d[k])?d[k].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(ks.map(k=>[k,Array.isArray(d[k])?d[k][i]:d[k]])))}function list(v){if(v==null||v==='')return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return list(p)}catch{}return[v]}return[v]}function clean(v){return String(v??'').trim()}function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
function uName(r){return clean(byId(state.ugecam,Number(r.NIVEAU1))?.UGECAM)||clean(r.gristHelper_Display3)||clean(r.NIVEAU1)}function eNames(r){return list(r.Rattachement_ESMS_liste_UGECAM).map(Number).map(id=>clean(byId(state.esms,id)?.ESMS_raison_sociale)).filter(Boolean)}function pathOf(r){const p=[];for(let i=0;i<=9;i++){let v=i===1?uName(r):clean(r['NIVEAU'+i]);if(v&&v!=='0'&&!/^b['\"]/i.test(v))p.push(v)}return p}function valid(r){return Number(r.id)>1&&clean(r.ARBORESCENCE)!=='import_path'&&pathOf(r).length>0}
function leaves(){const all=state.rows.filter(valid),root={c:new Map()};for(const r of all){let n=root;for(const part of pathOf(r)){if(!n.c.has(part))n.c.set(part,{name:part,c:new Map(),r:null});n=n.c.get(part)}n.r=r}const out=[];function walk(n,p=[]){if(n!==root&&n.c.size===0)out.push({r:n.r,path:p,service:n.name});for(const x of n.c.values())walk(x,[...p,x.name])}walk(root,[]);return out}
function filtered(){const q=state.q.toLowerCase().trim();let a=leaves().filter(x=>{const r=x.r||{},u=uName(r),es=eNames(r),t=clean(r.type_prestation_name);const hay=[...x.path,...es,t,clean(r.ID_service)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!state.u||u===state.u)&&(!state.e||es.includes(state.e))&&(!state.type||t===state.type)});a.sort((a,b)=>{if(state.sort==='depth')return b.path.length-a.path.length;if(state.sort==='esms')return (eNames(a.r)[0]||'').localeCompare(eNames(b.r)[0]||'','fr');if(state.sort==='type')return clean(a.r?.type_prestation_name).localeCompare(clean(b.r?.type_prestation_name),'fr');return a.service.localeCompare(b.service,'fr')});return a}
function groupCount(arr,key){const m=new Map();for(const x of arr){const k=key(x)||'Non renseigné';m.set(k,(m.get(k)||0)+1)}return [...m.entries()].sort((a,b)=>b[1]-a[1])}function bars(data){const max=Math.max(1,...data.map(x=>x[1]));return data.slice(0,8).map(([k,v])=>`<div class="barrow"><div class="barlabel" title="${esc(k)}">${esc(k)}</div><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><div class="barval">${v}</div></div>`).join('')}
function csvExport(items){const cols=['UGECAM','Établissement','Service le plus fin','Niveau','Type prestation','ID service','Arborescence'];const lines=[cols,...items.map(x=>{const r=x.r||{};return[uName(r),eNames(r).join(' | '),x.service,x.path.length-1,clean(r.type_prestation_name),clean(r.ID_service),x.path.join(' > ')]})];const blob=new Blob([lines.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='synthese-services-airmes.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){const data=filtered(),allLeaves=leaves();const ugecams=[...new Set(allLeaves.map(x=>uName(x.r)).filter(Boolean))].sort();const es=[...new Set(allLeaves.flatMap(x=>eNames(x.r)))].sort();const types=[...new Set(allLeaves.map(x=>clean(x.r?.type_prestation_name)).filter(Boolean))].sort();const maxD=Math.max(0,...data.map(x=>x.path.length-1));app.innerHTML=`<div class="head"><div><div class="title">Tableau de synthèse des services AIRMES</div><div class="sub">Une ligne = un service terminal, c’est-à-dire le dernier niveau renseigné de sa branche.</div></div><div class="filters"><input id="q" placeholder="Rechercher…" value="${esc(state.q)}"><select id="u"><option value="">Toutes UGECAM</option>${ugecams.map(x=>`<option ${x===state.u?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="e"><option value="">Tous établissements</option>${es.map(x=>`<option ${x===state.e?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="type"><option value="">Tous types</option>${types.map(x=>`<option ${x===state.type?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="sort"><option value="service" ${state.sort==='service'?'selected':''}>Tri : service</option><option value="esms" ${state.sort==='esms'?'selected':''}>Tri : établissement</option><option value="type" ${state.sort==='type'?'selected':''}>Tri : type</option><option value="depth" ${state.sort==='depth'?'selected':''}>Tri : profondeur</option></select><button id="exportBtn">Exporter CSV</button></div></div><div class="kpis"><div class="kpi"><div class="klabel">Services terminaux</div><div class="kvalue">${data.length}</div></div><div class="kpi"><div class="klabel">UGECAM</div><div class="kvalue">${new Set(data.map(x=>uName(x.r)).filter(Boolean)).size}</div></div><div class="kpi"><div class="klabel">Établissements</div><div class="kvalue">${new Set(data.flatMap(x=>eNames(x.r))).size}</div></div><div class="kpi"><div class="klabel">Types de prestation</div><div class="kvalue">${new Set(data.map(x=>clean(x.r?.type_prestation_name)).filter(Boolean)).size}</div></div><div class="kpi"><div class="klabel">Profondeur max.</div><div class="kvalue">${maxD}</div></div></div><div class="cards"><div class="card"><div class="ctitle">Services par UGECAM</div>${bars(groupCount(data,x=>uName(x.r)))}</div><div class="card"><div class="ctitle">Principaux types de prestation</div>${bars(groupCount(data,x=>clean(x.r?.type_prestation_name)))}</div></div><div class="tableWrap"><table><thead><tr><th>UGECAM</th><th>Établissement</th><th>Service le plus fin</th><th>Niveau</th><th>Type prestation</th><th>ID service</th><th>Arborescence</th></tr></thead><tbody>${data.length?data.map(x=>{const r=x.r||{};return`<tr><td>${esc(uName(r))}</td><td>${esc(eNames(r).join(', ')||'—')}</td><td><div class="service">${esc(x.service)}</div><span class="pill leafpill">service terminal</span></td><td>${x.path.length-1}</td><td><span class="pill">${esc(clean(r.type_prestation_name)||'—')}</span></td><td>${esc(clean(r.ID_service)||'—')}</td><td><div class="path">${esc(x.path.join(' › '))}</div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Aucun résultat.</td></tr>'}</tbody></table></div>`;
const qEl=document.getElementById('q'),uEl=document.getElementById('u'),eEl=document.getElementById('e'),typeEl=document.getElementById('type'),sortEl=document.getElementById('sort'),exportBtn=document.getElementById('exportBtn');
qEl.addEventListener('input',ev=>{state.q=ev.target.value;render()});uEl.addEventListener('change',ev=>{state.u=ev.target.value;state.e='';render()});eEl.addEventListener('change',ev=>{state.e=ev.target.value;render()});typeEl.addEventListener('change',ev=>{state.type=ev.target.value;render()});sortEl.addEventListener('change',ev=>{state.sort=ev.target.value;render()});exportBtn.addEventListener('click',()=>csvExport(data));}

grist.ready({requiredAccess:'full'});
(async()=>{try{[state.rows,state.ugecam,state.esms]=await Promise.all([ft('Import_entite_AIRMES'),ft('UGECAM'),ft('ESMS_Liste_UGECAM_')]);render()}catch(e){console.error(e);app.innerHTML='<div class="error"><strong>Impossible de charger la synthèse AIRMES.</strong><br>'+esc(e.message||e)+'</div>'}})();
</script></body></html>
