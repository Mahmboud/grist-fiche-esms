<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remontées V2 — Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--violet:#6d28d9;--violetSoft:#f5f3ff;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1650px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:44px 20px;text-align:center;color:var(--muted)}.loading strong,.error strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px}.shell{display:grid;grid-template-columns:365px minmax(0,1fr);gap:14px}.sidebar{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:14px;border-bottom:1px solid var(--line)}.sideTitle{font-size:15px;font-weight:850}.sideSub{font-size:11.5px;color:var(--muted);margin-top:3px}.search{width:100%;margin-top:10px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;outline:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select,.sort{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:7px;font-size:11.5px}.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.qf{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:750;color:#475569}.qf.active{background:var(--blueSoft);border-color:#bfdbfe;color:var(--blue2)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:11.5px;font-weight:700;color:#475569}.listMeta{padding:8px 14px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between}.list{overflow:auto;padding:6px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:11px;padding:9px 10px;color:var(--text);position:relative}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.item.overdue:not(.active){background:#fff7f7}.itemTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.itemName{font-size:12.3px;font-weight:820;line-height:1.3}.itemMeta{margin-top:4px;font-size:10.6px;color:var(--muted);line-height:1.35}.rowBadges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:9.8px;font-weight:800;background:#f1f5f9;color:#475569;white-space:nowrap}.pill.red{background:var(--redSoft);color:var(--red)}.pill.amber{background:var(--amberSoft);color:var(--amber)}.pill.green{background:var(--greenSoft);color:var(--green)}.pill.blue{background:var(--blueSoft);color:var(--blue2)}.pill.violet{background:var(--violetSoft);color:var(--violet)}.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}.kpiLabel{font-size:9.8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:20px;font-weight:900;margin-top:2px}.kpi.red .kpiValue{color:var(--red)}.kpi.amber .kpiValue{color:var(--amber)}.kpi.green .kpiValue{color:var(--green)}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:var(--shadow);margin-bottom:12px}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{font-size:clamp(20px,2.7vw,29px);line-height:1.12;margin:0}.subtitle{font-size:12.5px;color:var(--muted);margin-top:6px}.chips,.actions,.tabs{display:flex;flex-wrap:wrap;gap:6px}.chips{margin-top:11px}.chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--blueSoft);color:var(--blue2);font-size:10.8px;font-weight:780}.actions{margin-top:12px}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#1e293b;border-radius:9px;padding:7px 10px;text-decoration:none;font-size:11.5px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.warn{background:var(--amberSoft);border-color:#fde68a;color:var(--amber)}.tabs{margin:0 0 12px}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:750;color:#475569}.tab.active{background:var(--blueSoft);border-color:#bfdbfe;color:var(--blue2)}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:12px;align-items:start}.stack{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.card.alert{border-color:#fecaca}.cardHead{padding:13px 15px 7px;display:flex;justify-content:space-between;align-items:center;gap:10px}.cardTitle{font-size:13px;font-weight:850;color:#334155}.cardBody{padding:6px 15px 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px 11px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:4px}.value{font-size:12.5px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.value.soft{font-weight:500;line-height:1.45}.contact{display:flex;gap:10px;align-items:flex-start}.avatar{width:36px;height:36px;border-radius:10px;background:var(--blueSoft);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}.muted{font-size:11.8px;color:var(--muted)}.deadline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid #edf2f7}.deadline.overdue{background:var(--redSoft);border-color:#fecaca}.deadline.soon{background:var(--amberSoft);border-color:#fde68a}.deadline strong{font-size:12.5px}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:55px 20px;text-align:center;color:var(--muted)}.footer{font-size:9.5px;color:#94a3b8;padding:7px 2px}@media(max-width:1150px){.shell{grid-template-columns:310px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){body{padding:7px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:430px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main id="app"><div class="loading"><strong>Chargement des remontées V2…</strong>Analyse des statuts et échéances.</div></main>
<script>
const app=document.getElementById('app');
const state={tables:null,selectedId:null,q:'',statut:'',priorite:'',type:'',quick:'all',sort:'recent',tab:'synthese'};
const T={r:'Remontees_editeur_',c:'CONTACTS'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);if(!k.length)return[];const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function txt(v){if(empty(v))return'';if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).join(', ')}return String(v)}
function bool(v){return v===true||v===1||v==='1'||v==='True'||v==='TRUE'||(Array.isArray(v)&&v.length===2&&v[0]==='B'&&Boolean(v[1]))}
function dateObj(v){if(empty(v))return null;const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);return Number.isNaN(d.getTime())?null:d}
function dt(v){const d=dateObj(v);if(!d)return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}
async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
async function load(){const[r,c]=await Promise.all([ft(T.r),ft(T.c)]);state.tables={r,c}}
function norm(v){return txt(v).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function isClosed(r){const s=norm(r.STATUT_MOAD)+' '+norm(r.STATUT_AIRMES);return ['clos','clotur','termine','resolu','livre','finalise'].some(x=>s.includes(x))}
function isOpen(r){return !isClosed(r)}
function priorityRank(v){const s=norm(v);if(!s)return 99;const n=parseInt(s,10);if(Number.isFinite(n))return n;if(s.includes('urgent')||s.includes('critique')||s.includes('haute')||s.includes('eleve'))return 1;if(s.includes('moy')||s.includes('normal'))return 2;if(s.includes('basse')||s.includes('faible'))return 3;return 9}
function isPriority(r){return priorityRank(r.PRIORITE)<=2}
function deadlineInfo(r){const d=dateObj(r.ECHEANCE);if(!d)return{date:null,overdue:false,soon:false,days:null};const now=new Date();now.setHours(0,0,0,0);d.setHours(0,0,0,0);const days=Math.round((d-now)/86400000);return{date:d,days,overdue:isOpen(r)&&days<0,soon:isOpen(r)&&days>=0&&days<=14}}
function statusClass(v){const s=norm(v);if(['clos','clotur','termine','resolu','livre'].some(x=>s.includes(x)))return'green';if(['incident','bloq','rejet','annul'].some(x=>s.includes(x)))return'red';if(['attente','cours','qualifie','analyse'].some(x=>s.includes(x)))return'blue';return''}
function priorityClass(v){const r=priorityRank(v);return r===1?'red':r===2?'amber':r===3?'green':''}
function quickMatch(r){const d=deadlineInfo(r);if(state.quick==='open')return isOpen(r);if(state.quick==='closed')return isClosed(r);if(state.quick==='priority')return isPriority(r);if(state.quick==='overdue')return d.overdue;if(state.quick==='incident')return bool(r.INCIDENT);return true}
function filtered(){const q=state.q.trim().toLowerCase();let arr=state.tables.r.filter(r=>{const hay=[r.REF_GRIST_remontees,r.REF,r.LIBELLE,r.DESCRIPTION,r.CONTEXTE,r.RESULTAT_ACTUEL,r.RESULTAT_ATTENDU,r.THEME,r.SOUS_THEME,r.TYPE_DE_DEMANDE,r.PRIORITE,r.STATUT_MOAD,r.STATUT_AIRMES,r.ESMS,r.N_REF_ASSOCIEE].map(txt).join(' ').toLowerCase();return(!q||hay.includes(q))&&(!state.statut||txt(r.STATUT_MOAD)===state.statut)&&(!state.priorite||txt(r.PRIORITE)===state.priorite)&&(!state.type||txt(r.TYPE_DE_DEMANDE)===state.type)&&quickMatch(r)});arr.sort((a,b)=>{if(state.sort==='priority')return priorityRank(a.PRIORITE)-priorityRank(b.PRIORITE)||Number(b.id)-Number(a.id);if(state.sort==='deadline'){const A=dateObj(a.ECHEANCE)?.getTime()??Infinity,B=dateObj(b.ECHEANCE)?.getTime()??Infinity;return A-B}if(state.sort==='ref')return txt(a.REF_GRIST_remontees).localeCompare(txt(b.REF_GRIST_remontees),'fr');return Number(b.id)-Number(a.id)});return arr}
function pill(v,cls=''){return empty(v)?'':`<span class="pill ${cls}">${esc(v)}</span>`}
function sidebar(){const all=state.tables.r;const sts=[...new Set(all.map(x=>txt(x.STATUT_MOAD)).filter(Boolean))].sort();const ps=[...new Set(all.map(x=>txt(x.PRIORITE)).filter(Boolean))].sort();const ts=[...new Set(all.map(x=>txt(x.TYPE_DE_DEMANDE)).filter(Boolean))].sort();const items=filtered();return`<aside class="sidebar"><div class="sideHead"><div class="sideTitle">Remontées éditeur</div><div class="sideSub">Recherche, suivi et priorisation</div><input id="q" class="search" placeholder="Référence, libellé, thème, ESMS…" value="${esc(state.q)}"><div class="filters"><select id="st"><option value="">Tous statuts MOAD</option>${sts.map(x=>`<option ${x===state.statut?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="pr"><option value="">Toutes priorités</option>${ps.map(x=>`<option ${x===state.priorite?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="quick">${[['all','Toutes'],['open','Ouvertes'],['priority','Prioritaires'],['overdue','En retard'],['incident','Incidents'],['closed','Clôturées']].map(([k,l])=>`<button class="qf ${state.quick===k?'active':''}" data-qf="${k}">${l}</button>`).join('')}</div><div class="tools"><select id="ty" class="sort"><option value="">Tous types</option>${ts.map(x=>`<option ${x===state.type?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="sort" class="sort"><option value="recent" ${state.sort==='recent'?'selected':''}>Tri : récent</option><option value="priority" ${state.sort==='priority'?'selected':''}>Tri : priorité</option><option value="deadline" ${state.sort==='deadline'?'selected':''}>Tri : échéance</option><option value="ref" ${state.sort==='ref'?'selected':''}>Tri : référence</option></select></div><div class="tools"><button id="reset" class="ghost">Réinitialiser</button><button id="collapse" class="ghost">Liste compacte</button></div></div><div class="listMeta"><span>${items.length} remontée${items.length>1?'s':''}</span><span>${state.selectedId?'1 sélectionnée':''}</span></div><div class="list">${items.map(r=>{const d=deadlineInfo(r);return`<button class="item ${Number(r.id)===Number(state.selectedId)?'active':''} ${d.overdue?'overdue':''}" data-id="${r.id}"><div class="itemTop"><div class="itemName">${esc(txt(r.LIBELLE)||txt(r.REF_GRIST_remontees)||'Remontée')}</div>${r.PRIORITE?pill(r.PRIORITE,priorityClass(r.PRIORITE)):''}</div><div class="itemMeta">${esc([txt(r.REF_GRIST_remontees),txt(r.THEME)].filter(Boolean).join(' • '))}</div><div class="rowBadges">${pill(txt(r.STATUT_MOAD)||'Sans statut',statusClass(r.STATUT_MOAD))}${d.overdue?pill(`Retard ${Math.abs(d.days)} j`,'red'):d.soon?pill(`Échéance ${d.days} j`,'amber'):''}${bool(r.INCIDENT)?pill('Incident','red'):''}</div></button>`}).join('')}</div></aside>`}
function field(l,v,full=false,soft=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value ${soft?'soft':''}">${esc(v)}</div></div>`}
function contactBlock(r){const c=byId(state.tables.c,r.NOM_CONTACT);if(!c)return'<div class="muted">Aucun contact associé.</div>';const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact';const initials=((c.PRENOM||'').slice(0,1)+(c.NOM||'').slice(0,1)).toUpperCase()||'•';return`<div class="contact"><div class="avatar">${esc(initials)}</div><div><div style="font-weight:850;font-size:13px">${esc(name)}</div><div class="muted">${esc(c.FONCTION||'')}</div>${c.EMAIL?`<a href="mailto:${esc(c.EMAIL)}" style="font-size:11.5px;color:#1d4ed8;text-decoration:none">${esc(c.EMAIL)}</a>`:''}</div></div>`}
function deadlineBlock(r){const d=deadlineInfo(r);if(!d.date)return'<div class="muted">Aucune échéance renseignée.</div>';const cls=d.overdue?'overdue':d.soon?'soon':'';const label=d.overdue?`${Math.abs(d.days)} jour(s) de retard`:d.soon?`Dans ${d.days} jour(s)`:'Échéance planifiée';return`<div class="deadline ${cls}"><div><div class="label">Échéance</div><strong>${esc(dt(r.ECHEANCE))}</strong></div><span class="pill ${d.overdue?'red':d.soon?'amber':'blue'}">${esc(label)}</span></div>`}
function tabContent(r){if(state.tab==='contexte')return`<div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Contexte & résultats</div></div><div class="cardBody"><div class="grid">${field('Description',r.DESCRIPTION,true,true)}${field('Contexte',r.CONTEXTE,true,true)}${field('Résultat actuel',r.RESULTAT_ACTUEL,true,true)}${field('Résultat attendu',r.RESULTAT_ATTENDU,true,true)}</div></div></section></div>`;if(state.tab==='reponse')return`<div class="stack"><section class="card ${empty(r.REPONSE_AIRMES_ECHANGES)?'':'alert'}"><div class="cardHead"><div class="cardTitle">Réponse AIRMES / échanges</div></div><div class="cardBody">${r.REPONSE_AIRMES_ECHANGES?`<div class="value soft">${esc(r.REPONSE_AIRMES_ECHANGES)}</div>`:'<div class="muted">Aucune réponse AIRMES renseignée.</div>'}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Commentaires MOAD</div></div><div class="cardBody">${r.COMMENTAIRES?`<div class="value soft">${esc(r.COMMENTAIRES)}</div>`:'<div class="muted">Aucun commentaire.</div>'}</div></section></div>`;if(state.tab==='suivi')return`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Suivi opérationnel</div></div><div class="cardBody"><div class="grid">${field('Statut MOAD',r.STATUT_MOAD)}${field('Statut AIRMES',r.STATUT_AIRMES)}${field('Priorité',r.PRIORITE)}${field('N° réf associée',r.N_REF_ASSOCIEE)}${field('Version livrée',bool(r.VERSION_LIVREE)?'Oui':'Non')}${field('Incident',bool(r.INCIDENT)?'Oui':'Non')}${field('Création',r.Creation)}${field('Modification',r.Modification)}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Échéance</div></div><div class="cardBody">${deadlineBlock(r)}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Contact</div></div><div class="cardBody">${contactBlock(r)}</div></section></aside></div>`;return`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Synthèse</div></div><div class="cardBody"><div class="grid">${field('Référence',txt(r.REF_GRIST_remontees)||r.REF)}${field('Type de demande',r.TYPE_DE_DEMANDE)}${field('Thème',r.THEME)}${field('Sous-thème',r.SOUS_THEME)}${field('Priorité',r.PRIORITE)}${field('ESMS',r.ESMS,true)}${field('Libellé',r.LIBELLE,true,true)}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Besoin exprimé</div></div><div class="cardBody"><div class="grid">${field('Description',r.DESCRIPTION,true,true)}${field('Résultat attendu',r.RESULTAT_ATTENDU,true,true)}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Échéance</div></div><div class="cardBody">${deadlineBlock(r)}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Statuts</div></div><div class="cardBody"><div class="grid">${field('AIRMES',r.STATUT_AIRMES,true)}${field('MOAD',r.STATUT_MOAD,true)}${field('Version livrée',bool(r.VERSION_LIVREE)?'Oui':'Non',true)}${field('Incident',bool(r.INCIDENT)?'Oui':'Non',true)}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Contact</div></div><div class="cardBody">${contactBlock(r)}</div></section></aside></div>`}
function detail(){const r=byId(state.tables.r,state.selectedId);if(!r)return'<div class="empty">Sélectionnez une remontée.</div>';const d=deadlineInfo(r);const ref=txt(r.REF_GRIST_remontees)||txt(r.REF)||`#${r.id}`;return`<div class="detail"><div class="hero"><div class="heroTop"><div><div class="eyebrow">Remontée éditeur</div><h1>${esc(txt(r.LIBELLE)||ref)}</h1><div class="subtitle">${esc([ref,txt(r.THEME),txt(r.ESMS)].filter(Boolean).join(' • '))}</div><div class="chips">${pill(r.PRIORITE,priorityClass(r.PRIORITE))}${pill(r.STATUT_MOAD,statusClass(r.STATUT_MOAD))}${d.overdue?pill('En retard','red'):d.soon?pill('Échéance proche','amber'):''}${bool(r.INCIDENT)?pill('Incident','red'):''}</div><div class="actions">${r.MAILTO?`<a class="btn primary" href="${esc(r.MAILTO)}">✉ Contacter AIRMES</a>`:''}<button id="copyRef" class="btn">⧉ Copier la référence</button>${r.N_REF_ASSOCIEE?`<button id="copyAssoc" class="btn warn">⧉ Réf associée</button>`:''}</div></div></div></div><div class="tabs">${[['synthese','Synthèse'],['contexte','Contexte & résultats'],['reponse','Réponse AIRMES'],['suivi','Suivi']].map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</div>${tabContent(r)}<div class="footer">Remontées V2 • données lues directement depuis Grist</div></div>`}
function kpis(){const a=state.tables.r;const open=a.filter(isOpen).length,prio=a.filter(r=>isOpen(r)&&isPriority(r)).length,over=a.filter(r=>deadlineInfo(r).overdue).length,inc=a.filter(r=>isOpen(r)&&bool(r.INCIDENT)).length,closed=a.filter(isClosed).length;return`<div class="kpis"><div class="kpi"><div class="kpiLabel">Total</div><div class="kpiValue">${a.length}</div></div><div class="kpi"><div class="kpiLabel">Ouvertes</div><div class="kpiValue">${open}</div></div><div class="kpi amber"><div class="kpiLabel">Prioritaires</div><div class="kpiValue">${prio}</div></div><div class="kpi red"><div class="kpiLabel">En retard</div><div class="kpiValue">${over}</div></div><div class="kpi green"><div class="kpiLabel">Clôturées</div><div class="kpiValue">${closed}</div></div></div>`}
function render(){if(!state.tables)return;const f=filtered();if(state.selectedId&&!byId(state.tables.r,state.selectedId))state.selectedId=null;if(!state.selectedId&&f[0])state.selectedId=f[0].id;app.innerHTML=`${kpis()}<div class="shell">${sidebar()}${detail()}</div>`;bind();setTimeout(()=>document.querySelector('.item.active')?.scrollIntoView({block:'nearest'}),0)}
function bind(){document.getElementById('q')?.addEventListener('input',e=>{state.q=e.target.value;render()});document.getElementById('st')?.addEventListener('change',e=>{state.statut=e.target.value;render()});document.getElementById('pr')?.addEventListener('change',e=>{state.priorite=e.target.value;render()});document.getElementById('ty')?.addEventListener('change',e=>{state.type=e.target.value;render()});document.getElementById('sort')?.addEventListener('change',e=>{state.sort=e.target.value;render()});document.getElementById('reset')?.addEventListener('click',()=>{Object.assign(state,{q:'',statut:'',priorite:'',type:'',quick:'all',sort:'recent'});render()});document.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{state.quick=b.dataset.qf;render()});document.querySelectorAll('.item').forEach(b=>b.onclick=async()=>{state.selectedId=Number(b.dataset.id);render();try{await grist.setCursorPos({rowId:state.selectedId})}catch{}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.getElementById('copyRef')?.addEventListener('click',async()=>{const r=byId(state.tables.r,state.selectedId);const ref=txt(r.REF_GRIST_remontees)||txt(r.REF);if(ref)await navigator.clipboard.writeText(ref)});document.getElementById('copyAssoc')?.addEventListener('click',async()=>{const r=byId(state.tables.r,state.selectedId);if(r.N_REF_ASSOCIEE)await navigator.clipboard.writeText(txt(r.N_REF_ASSOCIEE))})}
grist.ready({requiredAccess:'full'});grist.onRecord(r=>{if(r?.id){state.selectedId=r.id;if(state.tables)render()}});load().then(()=>render()).catch(e=>{console.error(e);app.innerHTML=`<div class="error"><strong>Impossible de charger les remontées</strong>${esc(e.message||e)}<br><br>Vérifiez que le widget a un accès complet au document.</div>`});
</script></body></html>
