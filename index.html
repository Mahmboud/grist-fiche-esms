<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiche ESMS - Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --radius: 16px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    body {
      padding: 18px;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
    }

    .empty {
      background: var(--surface);
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 18px;
    }

    .hero {
      background: linear-gradient(135deg, #ffffff, #f8fbff);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 18px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 18px 10px;
      font-size: 14px;
      font-weight: 800;
      color: #334155;
    }

    .card-body {
      padding: 6px 18px 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      background: var(--surface-soft);
      border: 1px solid #eef2f7;
      border-radius: 12px;
      padding: 12px 14px;
      min-width: 0;
    }

    .field.full { grid-column: 1 / -1; }

    .label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .value {
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .value.soft {
      font-weight: 500;
      line-height: 1.6;
    }

    .contact {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      background: var(--surface-soft);
      border: 1px solid #eef2f7;
      border-radius: 12px;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 12px;
      font-weight: 800;
    }

    .muted {
      color: var(--muted);
      font-weight: 500;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .action {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .action.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      body { padding: 10px; }
      .hero { padding: 18px; }
      .grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <div class="empty">
      <strong>Sélectionnez un établissement</strong>
      La fiche ESMS apparaîtra ici.
    </div>
  </main>

  <script>
    const app = document.getElementById("app");

    function empty(v) {
      return v === null || v === undefined || v === "" ||
             (Array.isArray(v) && v.length === 0);
    }

    function text(v) {
      if (empty(v)) return "";
      if (Array.isArray(v)) return v.filter(Boolean).join(", ");
      if (typeof v === "object") {
        if ("displayValue" in v) return v.displayValue || "";
        return String(v);
      }
      return String(v);
    }

    function esc(v) {
      return text(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function field(label, value, full = false, soft = false) {
      if (empty(value)) return "";
      return `
        <div class="field ${full ? "full" : ""}">
          <div class="label">${esc(label)}</div>
          <div class="value ${soft ? "soft" : ""}">${esc(value)}</div>
        </div>
      `;
    }

    function chip(value) {
      if (empty(value)) return "";
      return `<span class="chip">${esc(value)}</span>`;
    }

    function render(record) {
      if (!record) {
        app.innerHTML = `
          <div class="empty">
            <strong>Sélectionnez un établissement</strong>
            La fiche ESMS apparaîtra ici.
          </div>`;
        return;
      }

      const title =
        text(record.ESMS_raison_sociale) ||
        text(record.UGECAM_ESMS) ||
        "Établissement";

      const site = text(record.SITES_nomenclature_UGECAM);
      const ugecam = text(record.UGECAM);
      const typologie = text(record.Typologie_ESMS);
      const contacts = text(record.CONTACTS);

      const addressBlock = [
        text(record.ADRESSE),
        record.Latitude && record.Longitude
          ? `${record.Latitude}, ${record.Longitude}`
          : ""
      ].filter(Boolean).join("\n");

      app.innerHTML = `
        <section class="hero">
          <div class="hero-top">
            <div>
              <div class="eyebrow">Fiche ESMS</div>
              <h1>${esc(title)}</h1>
              ${site ? `<div class="subtitle">${esc(site)}</div>` : ""}
              <div class="chips">
                ${chip(ugecam)}
                ${chip(typologie)}
                ${record.FINESS ? chip("FINESS " + record.FINESS) : ""}
              </div>
            </div>
          </div>

          <div class="actions">
            ${record.ADRESSE ? `
              <a class="action primary"
                 target="_blank"
                 rel="noopener"
                 href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(record.ADRESSE)}">
                 Voir sur la carte
              </a>` : ""}
          </div>
        </section>

        <div class="layout">

          <div class="stack">

            <section class="card">
              <div class="card-header">Informations générales</div>
              <div class="card-body">
                <div class="grid">
                  ${field("Raison sociale", record.ESMS_raison_sociale)}
                  ${field("FINESS", record.FINESS)}
                  ${field("UGECAM", record.UGECAM)}
                  ${field("Site", record.SITES_nomenclature_UGECAM)}
                  ${field("Typologie", record.Typologie_ESMS)}
                  ${field("Directeur", record.Directeur)}
                  ${field("Adresse", addressBlock, true)}
                </div>
              </div>
            </section>

            <section class="card">
              <div class="card-header">Notes</div>
              <div class="card-body">
                <div class="grid">
                  ${field("Notes", record.Notes, true, true) ||
                    `<div class="muted">Aucune note renseignée.</div>`}
                </div>
              </div>
            </section>

          </div>

          <aside class="stack">

            <section class="card">
              <div class="card-header">Contacts</div>
              <div class="card-body">
                ${
                  contacts
                    ? `<div class="contact">
                         <div class="status">Contacts associés</div>
                         <div class="value soft">${esc(contacts)}</div>
                       </div>`
                    : `<div class="muted">Aucun contact associé.</div>`
                }
              </div>
            </section>

            <section class="card">
              <div class="card-header">Rattachement</div>
              <div class="card-body">
                <div class="grid">
                  ${field("Rattachement site UGECAM", record.Rattachement_site_UGECAM, true)}
                  ${field("Libellé complet", record.UGECAM_ESMS, true, true)}
                </div>
              </div>
            </section>

            <section class="card">
              <div class="card-header">Traçabilité</div>
              <div class="card-body">
                <div class="grid">
                  ${field("Créé par", record.Cree_par, true)}
                  ${field("Dernière modification", record.Derniere_mise_a_jour, true)}
                  ${field("Modifié par", record.Derniere_mise_a_jour_par, true)}
                </div>
              </div>
            </section>

          </aside>
        </div>
      `;
    }

    grist.ready({ requiredAccess: "read table" });
    grist.onRecord(render);
  </script>
</body>
</html>
