<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Explorateur ESMS — Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04);--r:16px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,a{font:inherit}#app{max-width:1500px;margin:0 auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:44px 22px;text-align:center;color:var(--muted)}.loading strong,.error strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}.error{border-color:#fecaca}.shell{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}.sidebar{position:sticky;top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;max-height:calc(100vh - 24px);display:flex;flex-direction:column}.side-head{padding:16px;border-bottom:1px solid var(--line)}.side-title{font-size:15px;font-weight:850}.side-sub{font-size:12px;color:var(--muted);margin-top:3px}.search{margin-top:12px;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;outline:none}.search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.filters select{width:100%;border:1px solid #dbe3ee;border-radius:9px;padding:8px;background:#fff;color:#334155;font-size:12px}.list-meta{padding:9px 15px;color:var(--muted);font-size:11.5px;border-bottom:1px solid #eef2f7}.esms-list{overflow:auto;padding:7px}.esms-item{width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:10px 11px;cursor:pointer;color:var(--text);display:block}.esms-item:hover{background:#f8fafc}.esms-item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.esms-name{font-size:12.5px;font-weight:800;line-height:1.35}.esms-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}.detail{min-width:0}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:6px}h1{font-size:clamp(22px,3vw,33px);line-height:1.14;margin:0}.subtitle{color:var(--muted);margin-top:8px;font-size:14px}.chips,.badges,.actions{display:flex;flex-wrap:wrap;gap:7px}.chips{margin-top:14px}.actions{margin-top:15px}.chip,.badge{display:inline-flex;align-items:center;min-height:27px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:750;background:var(--blueSoft);color:var(--blue2)}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.amber{background:var(--amberSoft);color:var(--amber)}.badge.gray{background:#f1f5f9;color:#475569}.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:#1e293b;border-radius:10px;padding:8px 11px;text-decoration:none;font-size:12.5px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:14px;align-items:start}.stack{display:flex;flex-direction:column;gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.card-head{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}.card-title{font-size:13.5px;font-weight:850;color:#334155}.count{font-size:11px;font-weight:800;color:var(--muted);background:#f1f5f9;border-radius:999px;padding:3px 8px}.card-body{padding:6px 16px 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:11px;padding:10px 12px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:4px}.value{font-size:13px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.value.soft{font-weight:500;line-height:1.5}.contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.person{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:7px}.person-top{display:flex;gap:9px}.avatar{width:32px;height:32px;border-radius:9px;background:var(--blueSoft);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 auto}.person-name{font-weight:850;font-size:13px}.person-role{font-size:11.5px;color:var(--muted);margin-top:2px}.email{font-size:11.5px;color:var(--blue2);overflow-wrap:anywhere;text-decoration:none}.small-btn{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:5px 7px;text-decoration:none;font-size:11px;font-weight:750}.timeline{display:flex;flex-direction:column}.event{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #eef2f7}.event:last-child{border-bottom:0}.event-date{font-size:11px;color:var(--muted);font-weight:750}.event-title{font-size:12.5px;font-weight:800}.event-desc{font-size:12px;color:#475569;margin-top:3px;line-height:1.45;white-space:pre-wrap}.muted{color:var(--muted);font-size:12.5px}.footer{padding:8px 3px 2px;color:#94a3b8;font-size:10px}.empty-detail{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.shell{grid-template-columns:290px minmax(0,1fr)}.layout{grid-template-columns:1fr}.contacts{grid-template-columns:1fr 1fr}}
@media(max-width:760px){body{padding:8px}.shell{grid-template-columns:1fr}.sidebar{position:static;max-height:420px}.contacts,.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.event{grid-template-columns:1fr;gap:3px}}
</style>
</head>
<body>
<main id="app"><div class="loading"><strong>Chargement des ESMS…</strong>Connexion à Grist.</div></main>
<script>
const app=document.getElementById('app');
const state={tables:null,selectedId:null,query:'',ugecam:'',site:''};
const TABLES={esms:'ESMS_Liste_UGECAM_',contacts:'CONTACTS',ugecam:'UGECAM',sites:'SITES_nomenclature_UGECAM',interactions:'Interactions'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
function rows(data){if(!data)return[];if(Array.isArray(data))return data;const ks=Object.keys(data);if(!ks.length)return[];const n=Math.max(...ks.map(k=>Array.isArray(data[k])?data[k].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(ks.map(k=>[k,Array.isArray(data[k])?data[k][i]:data[k]])))}
function rawRefList(v){if(empty(v))return[];if(typeof v==='number')return v?[v]:[];if(typeof v==='string'){try{return rawRefList(JSON.parse(v))}catch{return[]}}if(!Array.isArray(v))return[];const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.map(Number).filter(x=>Number.isFinite(x)&&x>0)}
function bool(v){return v===true||v===1||v==='1'||v==='True'||v==='TRUE'||(Array.isArray(v)&&v.length===2&&v[0]==='B'&&Boolean(v[1]))}
function listText(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).map(String)}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return listText(p)}catch{}return[v]}return[String(v)]}
function txt(v){if(empty(v))return'';if(typeof v==='string'||typeof v==='number')return String(v);if(Array.isArray(v))return listText(v).join(', ');return String(v)}
function date(v){if(empty(v))return'';let d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);if(Number.isNaN(d.getTime()))return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function initials(n,p){return((p||'').slice(0,1)+(n||'').slice(0,1)).toUpperCase()||'•'}
function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}
function field(l,v,full=false,soft=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value ${soft?'soft':''}">${esc(v)}</div></div>`}
function chip(v){return empty(v)?'':`<span class="chip">${esc(v)}</span>`}
function badge(v,c='gray'){return`<span class="badge ${c}">${esc(v)}</span>`}
async function fetchTable(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error("API du document indisponible")}
async function load(){const [esms,contacts,ugecam,sites,interactions]=await Promise.all([fetchTable(TABLES.esms),fetchTable(TABLES.contacts),fetchTable(TABLES.ugecam),fetchTable(TABLES.sites),fetchTable(TABLES.interactions)]);state.tables={esms,contacts,ugecam,sites,interactions}}
function labelsForEsms(r){const t=state.tables;return{ugecam:txt(byId(t.ugecam,r.UGECAM)?.UGECAM),site:txt(byId(t.sites,r.SITES_nomenclature_UGECAM)?.SITES_nomenclature_UGECAM),name:txt(r.ESMS_raison_sociale)||'Établissement',finess:txt(r.FINESS),type:txt(r.Typologie_ESMS)}}
function contactCard(c){const b=[];if(bool(c.Referent_DUI))b.push(badge('Référent DUI','green'));if(bool(c.ACCES))b.push(badge('Accès','green'));if(bool(c.Invite_aux_comites))b.push(badge('Invité comités','amber'));if(bool(c.CAMSP_CMPP))b.push(badge('CAMSP / CMPP'));if(bool(c.MEDICALISE))b.push(badge('Médicalisé'));const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact';const email=txt(c.EMAIL);return`<article class="person"><div class="person-top"><div class="avatar">${esc(initials(c.NOM,c.PRENOM))}</div><div><div class="person-name">${esc(name)}</div><div class="person-role">${esc(c.FONCTION||'Fonction non renseignée')}</div></div></div>${b.length?`<div class="badges">${b.join('')}</div>`:''}${email?`<a class="email" href="mailto:${esc(email)}">${esc(email)}</a><div><a class="small-btn" href="mailto:${esc(email)}">✉ Envoyer un mail</a></div>`:''}</article>`}
function interactionsFor(ids){const s=new Set(ids.map(Number));return state.tables.interactions.filter(r=>rawRefList(r.CONTACT).some(id=>s.has(id))).sort((a,b)=>Number(b.DATE_INTERACTION||0)-Number(a.DATE_INTERACTION||0)).slice(0,8)}
function interactionRow(r){const title=[listText(r.TYPE).join(' • '),txt(r.Theme)].filter(Boolean).join(' — ')||'Interaction';return`<div class="event"><div class="event-date">${esc(date(r.DATE_INTERACTION)||'Date inconnue')}</div><div><div class="event-title">${esc(title)}</div>${r.DESCRIPTION?`<div class="event-desc">${esc(r.DESCRIPTION)}</div>`:''}</div></div>`}
function filteredEsms(){const q=state.query.trim().toLowerCase();return state.tables.esms.filter(r=>{const l=labelsForEsms(r);const matchQ=!q||[l.name,l.finess,l.ugecam,l.site,l.type,txt(r.ADRESSE),txt(r.Directeur)].join(' ').toLowerCase().includes(q);const matchU=!state.ugecam||l.ugecam===state.ugecam;const matchS=!state.site||l.site===state.site;return matchQ&&matchU&&matchS}).sort((a,b)=>labelsForEsms(a).name.localeCompare(labelsForEsms(b).name,'fr'))}
function sidebarHtml(){const all=state.tables.esms.map(labelsForEsms);const ugecams=[...new Set(all.map(x=>x.ugecam).filter(Boolean))].sort();const sites=[...new Set(all.filter(x=>!state.ugecam||x.ugecam===state.ugecam).map(x=>x.site).filter(Boolean))].sort();const items=filteredEsms();return`<aside class="sidebar"><div class="side-head"><div class="side-title">Établissements ESMS</div><div class="side-sub">Rechercher et sélectionner un établissement</div><input id="search" class="search" placeholder="Nom, FINESS, ville, directeur…" value="${esc(state.query)}"><div class="filters"><select id="filterU"><option value="">Toutes les UGECAM</option>${ugecams.map(x=>`<option ${x===state.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="filterS"><option value="">Tous les sites</option>${sites.map(x=>`<option ${x===state.site?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="list-meta">${items.length} établissement${items.length>1?'s':''}</div><div class="esms-list">${items.map(r=>{const l=labelsForEsms(r);return`<button class="esms-item ${Number(r.id)===Number(state.selectedId)?'active':''}" data-id="${r.id}"><div class="esms-name">${esc(l.name)}</div><div class="esms-meta"><span>${esc(l.site||l.ugecam)}</span>${l.finess?`<span>• FINESS ${esc(l.finess)}</span>`:''}</div></button>`}).join('')||'<div class="muted" style="padding:14px">Aucun résultat.</div>'}</div></aside>`}
function detailHtml(r){if(!r)return'<div class="empty-detail">Sélectionnez un établissement dans la liste.</div>';const l=labelsForEsms(r);const contactIds=rawRefList(r.CONTACTS);const contacts=contactIds.map(id=>byId(state.tables.contacts,id)).filter(Boolean);const ratt=rawRefList(r.Rattachement_site_UGECAM).map(id=>byId(state.tables.esms,id)).filter(Boolean);const inter=interactionsFor(contactIds);const lat=Number(r.Latitude),lon=Number(r.Longitude),address=txt(r.ADRESSE),mapQ=Number.isFinite(lat)&&Number.isFinite(lon)?`${lat},${lon}`:address;return`<div class="detail"><section class="hero"><div class="eyebrow">Fiche établissement</div><h1>${esc(l.name)}</h1><div class="subtitle">${esc([l.ugecam,l.site].filter(Boolean).join(' • '))}</div><div class="chips">${chip(l.type)}${l.finess?chip('FINESS '+l.finess):''}</div>${mapQ?`<div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQ)}">📍 Voir sur la carte</a></div>`:''}</section><div class="layout"><div class="stack"><section class="card"><div class="card-head"><div class="card-title">Informations générales</div></div><div class="card-body"><div class="grid">${field('Raison sociale',l.name)}${field('FINESS',l.finess)}${field('UGECAM',l.ugecam)}${field('Site',l.site)}${field('Typologie',l.type)}${field('Directeur',r.Directeur)}${field('Adresse',address,true,true)}</div></div></section><section class="card"><div class="card-head"><div class="card-title">Contacts associés</div><div class="count">${contacts.length}</div></div><div class="card-body">${contacts.length?`<div class="contacts">${contacts.map(contactCard).join('')}</div>`:'<div class="muted">Aucun contact associé.</div>'}</div></section><section class="card"><div class="card-head"><div class="card-title">Interactions récentes</div><div class="count">${inter.length}</div></div><div class="card-body">${inter.length?`<div class="timeline">${inter.map(interactionRow).join('')}</div>`:'<div class="muted">Aucune interaction récente.</div>'}</div></section></div><aside class="stack"><section class="card"><div class="card-head"><div class="card-title">Rattachement</div></div><div class="card-body">${ratt.length?ratt.map(x=>field('Établissement rattaché',txt(x.ESMS_raison_sociale),true,true)).join(''):'<div class="muted">Aucun rattachement renseigné.</div>'}</div></section><section class="card"><div class="card-head"><div class="card-title">Notes</div></div><div class="card-body">${txt(r.Notes)?`<div class="value soft">${esc(txt(r.Notes))}</div>`:'<div class="muted">Aucune note renseignée.</div>'}</div></section><section class="card"><div class="card-head"><div class="card-title">Traçabilité</div></div><div class="card-body"><div class="grid">${field('Créé par',r.Cree_par,true)}${field('Dernière mise à jour',date(r.Derniere_mise_a_jour),true)}${field('Modifié par',r.Derniere_mise_a_jour_par,true)}</div></div></section></aside></div><div class="footer">Explorateur ESMS • données lues directement depuis Grist</div></div>`}
function render(){const selected=byId(state.tables.esms,state.selectedId)||filteredEsms()[0]||null;if(selected&&!state.selectedId)state.selectedId=selected.id;app.innerHTML=`<div class="shell">${sidebarHtml()}${detailHtml(selected)}</div>`;document.querySelectorAll('.esms-item').forEach(b=>b.onclick=()=>{state.selectedId=Number(b.dataset.id);render()});document.getElementById('search').oninput=e=>{state.query=e.target.value;render()};document.getElementById('filterU').onchange=e=>{state.ugecam=e.target.value;state.site='';render()};document.getElementById('filterS').onchange=e=>{state.site=e.target.value;render()}}
async function init(){try{await load();render()}catch(e){console.error(e);app.innerHTML=`<div class="error"><strong>Impossible de charger les données</strong>${esc(e.message||e)}<br><br>Vérifie que le widget dispose de l’accès complet au document.</div>`}}
grist.ready({requiredAccess:'full'});grist.onRecord(rec=>{if(rec?.id&&state.tables){state.selectedId=rec.id;render()}else if(rec?.id){state.selectedId=rec.id}});init();
</script>
</body>
</html>
