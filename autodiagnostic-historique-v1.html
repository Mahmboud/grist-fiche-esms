<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historique Autodiagnostic</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}input,select,button{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:44px 20px;text-align:center;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.lab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.val{font-size:20px;font-weight:900;margin-top:2px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:15px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:2px}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools input,.tools select,.tools button{border:1px solid #cbd5e1;border-radius:9px;padding:7px 9px;background:#fff;font-size:11.5px}.timeline{padding:7px 14px 14px}.event{display:grid;grid-template-columns:150px minmax(180px,.8fr) minmax(220px,1fr) minmax(0,1.5fr);gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7;align-items:start}.event:last-child{border-bottom:0}.date{font-size:11px;color:var(--muted);font-weight:750}.site{font-size:12px;font-weight:850}.volet{font-size:10.5px;color:var(--muted);margin-top:3px}.q{font-size:12px;font-weight:800}.type{display:inline-flex;margin-top:5px;padding:3px 7px;border-radius:999px;background:var(--blueSoft);color:#1d4ed8;font-size:10px;font-weight:800}.chg{display:grid;grid-template-columns:1fr 22px 1fr;gap:7px;align-items:center}.old,.new{border-radius:10px;padding:8px 9px;font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere}.old{background:#f8fafc;color:#64748b}.new{background:var(--greenSoft);color:#166534}.arrow{text-align:center;color:#94a3b8}.author{font-size:10.5px;color:var(--muted);margin-top:5px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:1000px){.event{grid-template-columns:120px 1fr 1fr}.event>div:last-child{grid-column:2/-1}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.event{grid-template-columns:1fr}.event>div:last-child{grid-column:auto}.chg{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><main id="app"><div class="loading">Chargement de l’historique…</div></main><script>const app=document.getElementById('app'),H='Autodiagnostic_Historique';const state={rows:[],q:'',site:'',volet:'',author:'',type:''};function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{}),n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API indisponible')}function dt(v){if(!v)return'—';const n=Number(v),d=Number.isFinite(n)?new Date(n*(n<1e12?1000:1)):new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function filtered(){const q=state.q.trim().toLowerCase();return state.rows.filter(r=>(!q||[r.Site_nom,r.UGECAM,r.Volet,r.Question,r.Ancienne_valeur,r.Nouvelle_valeur,r.Auteur].join(' ').toLowerCase().includes(q))&&(!state.site||r.Site_nom===state.site)&&(!state.volet||r.Volet===state.volet)&&(!state.author||r.Auteur===state.author)&&(!state.type||r.Type_champ===state.type)).sort((a,b)=>Number(b.Horodatage||0)-Number(a.Horodatage||0))}function opts(values,current,label){return`<option value="">${label}</option>`+values.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('')}function render(){const shown=filtered(),sites=[...new Set(state.rows.map(r=>r.Site_nom).filter(Boolean))].sort(),volets=[...new Set(state.rows.map(r=>r.Volet).filter(Boolean))].sort(),authors=[...new Set(state.rows.map(r=>r.Auteur).filter(Boolean))].sort(),types=[...new Set(state.rows.map(r=>r.Type_champ).filter(Boolean))].sort();const today=new Date();today.setHours(0,0,0,0);const recent=state.rows.filter(r=>Number(r.Horodatage||0)*1000>=today.getTime()).length,questions=new Set(state.rows.map(r=>r.Question_id).filter(Boolean)).size,contributors=authors.length;app.innerHTML=`<div class="kpis"><div class="kpi"><div class="lab">Modifications</div><div class="val">${state.rows.length}</div></div><div class="kpi"><div class="lab">Aujourd’hui</div><div class="val">${recent}</div></div><div class="kpi"><div class="lab">Questions modifiées</div><div class="val">${questions}</div></div><div class="kpi"><div class="lab">Contributeurs</div><div class="val">${contributors}</div></div></div><section class="card"><div class="head"><div><div class="title">Historique Autodiagnostic</div><div class="sub">Traçabilité question par question, tous sites confondus</div></div><div class="tools"><input id="q" placeholder="Rechercher…" value="${esc(state.q)}"><select id="site">${opts(sites,state.site,'Tous les sites')}</select><select id="volet">${opts(volets,state.volet,'Tous les volets')}</select><select id="author">${opts(authors,state.author,'Tous les contributeurs')}</select><select id="type">${opts(types,state.type,'Tous les champs')}</select><button id="refresh">Actualiser</button></div></div><div class="timeline">${shown.length?shown.slice(0,300).map(r=>`<div class="event"><div><div class="date">${esc(dt(r.Horodatage))}</div><div class="author">${esc(r.Auteur||'Utilisateur non identifié')}</div></div><div><div class="site">${esc(r.Site_nom||'Site')}</div><div class="volet">${esc([r.UGECAM,r.Volet].filter(Boolean).join(' · '))}</div></div><div><div class="q">${esc(r.Question||r.Question_id||'Question')}</div><span class="type">${esc(r.Type_champ||'Modification')}</span></div><div><div class="chg"><div class="old">${esc(r.Ancienne_valeur||'∅')}</div><div class="arrow">→</div><div class="new">${esc(r.Nouvelle_valeur||'∅')}</div></div></div></div>`).join(''):'<div class="empty">Aucune modification correspondant aux filtres.</div>'}</div></section>`;bind()}function bind(){document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};for(const id of['site','volet','author','type'])document.getElementById(id).onchange=e=>{state[id]=e.target.value;render()};document.getElementById('refresh').onclick=load}async function load(){try{const tables=await grist.docApi.listTables();if(!tables.includes(H)){app.innerHTML='<div class="error">La table d’historique n’existe pas encore. Ouvre d’abord le questionnaire Autodiagnostic V3.</div>';return}state.rows=await ft(H);render()}catch(e){app.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}}grist.ready({requiredAccess:'full'});load();setInterval(load,20000);</script></body></html>
