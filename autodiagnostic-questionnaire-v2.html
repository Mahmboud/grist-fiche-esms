<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autodiagnostic collaboratif V2</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:12px}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:1500px;margin:auto}
.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}
.shell{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.sideHead{padding:15px;border-bottom:1px solid var(--line);flex:0 0 auto}.title{font-size:16px;font-weight:900}.sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.select{width:100%;margin-top:10px;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff}
.progress{margin-top:12px}.progressTop{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:8px}.bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:5px}.fill{height:100%;background:var(--blue)}
.nav{padding:8px;overflow:auto}.navBtn{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;display:flex;justify-content:space-between;gap:8px;color:#334155}.navBtn:hover{background:#f8fafc}.navBtn.active{background:var(--blueSoft);color:#1d4ed8;font-weight:800}
.count{font-size:10.5px;color:var(--muted);white-space:nowrap}.main{min-width:0}.hero{position:sticky;top:12px;z-index:5;background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}
.heroTop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.siteName{font-size:24px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:5px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:750}.pill.green{background:var(--greenSoft);color:var(--green)}.pill.amber{background:var(--amberSoft);color:var(--amber)}
.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:4px 0 10px}.sectionTitle{font-size:17px;font-weight:900}.sectionCount{font-size:11px;color:var(--muted);font-weight:750}
.qcard{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:15px;margin-bottom:10px}.qcard.answered{border-left:4px solid #86efac}.qhead{display:flex;justify-content:space-between;gap:12px}.qtext{font-size:13.5px;font-weight:800;line-height:1.45}.saveState{font-size:10.5px;color:var(--muted);white-space:nowrap}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11.5px;font-weight:750}.choice.on{background:var(--blueSoft);border-color:#93c5fd;color:#1d4ed8}
.prec{margin-top:10px;width:100%;min-height:70px;resize:vertical;border:1px solid #dbe3ee;border-radius:10px;padding:10px;font-size:12px}.prec:focus{outline:0;border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
.note{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);margin-top:10px}.sync{font-size:10.5px;color:var(--muted);margin-top:7px}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:static;max-height:none}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.hero{position:static}}
</style></head>
<body><main id="app"><div class="loading">Chargement de l’autodiagnostic…</div></main>
<script>
const app=document.getElementById('app');
const GROUPS=[
['Transmissions & écrits',['transmission1','Tranmissions2','CR1','CR2','CR3','Troublesetcrises1','troublesetcrises2','transmissions_ciblees']],
['Admissions & documents',['Preadmission1','Modeles_de_documents','requete1','requete2']],
['Agenda & présences',['Agenda1','Agenda2','Agenda3','Presences']],
['Soins & médicaments',['Prescription1','Prescription2','Prescription3','Administration_des_medicaments1','Administration_des_medicaments2','Administration_des_medicaments3','Suivi_soin_nursing']],
['Projet personnalisé',['PP1','PP2','PP3','PP4','PP5','PP6','PP7','PP8','PP9']],
['Comptes & accès',['comptes_utilisateurs1','comptes_utilisateurs2','comptes_utilisateurs3']],
['Services socles / DMP',['Services_socles','Services_socles2','Services_socles3']],
['Usages transverses & accompagnement',['transverses1','transverses2','transverses3','transverses4','transverses5','transverses6','transverses7']],
['Statistiques & pilotage',['Statistiques1','Statistiques2','Statistiques3','Statistiques4','Statistiques5','Statistiques6','Statistiques7','Statistiques8']]
];
const state={rows:[],sites:[],meta:{},group:0,current:null,saving:{},dirty:new Set(),lastSync:null,remoteNotice:''};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{});const n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
function stamp(v){if(empty(v))return null;const n=Number(v);if(Number.isFinite(n))return n;const d=new Date(v);return Number.isNaN(d.getTime())?null:d.getTime()/1000}
function fmtStamp(v){const s=stamp(v);if(!s)return '—';return new Date(s*1000).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
async function loadMeta(){try{const tabs=await ft('_grist_Tables'),cols=await ft('_grist_Tables_column');const t=tabs.find(x=>x.tableId==='Autodiagnostic');if(t){for(const c of cols.filter(x=>Number(x.parentId)===Number(t.id))){let wo={};try{wo=JSON.parse(c.widgetOptions||'{}')}catch{}state.meta[c.colId]={label:c.label||c.colId,type:c.type,choices:wo.choices||[]}}}}catch(e){console.warn(e)}}
function precisionCol(id){const c=[id+'_Precisions',id+'_precisions',id+'_Precisions2',id+'_precisions2'];return c.find(x=>Object.prototype.hasOwnProperty.call(state.current||{},x))||null}
function qmeta(id){const m=state.meta[id]||{};return{label:m.label||id.replaceAll('_',' '),choices:m.choices?.length?m.choices:['OUI','PARTIELLEMENT','NON']}}
function answerFields(){return GROUPS.flatMap(g=>g[1])}
function isAnswered(v){return !empty(v)}
function counts(row,ids=answerFields()){const total=ids.length,done=row?ids.filter(id=>isAnswered(row[id])).length:0;return{done,total,pct:Math.round(done/Math.max(1,total)*100)}}
function currentSiteName(){return state.current?.gristHelper_Display||state.sites.find(s=>Number(s.id)===Number(state.current?.SITES_nomenclature_UGECAM))?.SITES_nomenclature_UGECAM||'Site'}
async function pullLatest(showNotice=false){if(!state.current||state.dirty.size)return;try{const latestRows=await ft('Autodiagnostic');const fresh=latestRows.find(r=>Number(r.id)===Number(state.current.id));if(!fresh)return;const old=stamp(state.current.Derniere_mise_a_jour),neu=stamp(fresh.Derniere_mise_a_jour);state.rows=latestRows;state.current=fresh;state.lastSync=new Date();if(showNotice&&old&&neu&&neu>old){state.remoteNotice='Réponses actualisées depuis Grist';setTimeout(()=>{state.remoteNotice='';render()},2500)}render()}catch(e){console.warn('refresh',e)}}
async function saveField(col,value){if(!state.current)return;state.dirty.add(col);state.saving[col]='Enregistrement…';render();try{await grist.docApi.applyUserActions([['UpdateRecord','Autodiagnostic',state.current.id,{[col]:value}]]);state.current[col]=value;state.saving[col]='Enregistré à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});state.dirty.delete(col);const latest=await ft('Autodiagnostic');const fresh=latest.find(r=>Number(r.id)===Number(state.current.id));if(fresh){state.rows=latest;state.current=fresh}state.lastSync=new Date();render();setTimeout(()=>{delete state.saving[col];render()},1800)}catch(e){state.dirty.delete(col);state.saving[col]='Erreur de sauvegarde';render()}}
function questionHtml(id){const m=qmeta(id),val=state.current?.[id],pc=precisionCol(id),pv=pc?state.current?.[pc]:'',answered=isAnswered(val);return `<div class="qcard ${answered?'answered':''}"><div class="qhead"><div class="qtext">${esc(m.label)}</div><div class="saveState">${esc(state.saving[id]||'')}</div></div><div class="choices">${m.choices.map(c=>`<button class="choice ${String(val)===String(c)?'on':''}" data-answer="${esc(id)}" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div>${pc?`<textarea class="prec" data-prec="${esc(pc)}" placeholder="Précisions utiles…">${esc(pv||'')}</textarea>`:''}</div>`}
function render(){if(!state.rows.length){app.innerHTML='<div class="loading">Aucun autodiagnostic trouvé.</div>';return}const row=state.current||state.rows[0];if(!state.current)state.current=row;const all=counts(row),g=GROUPS[state.group],gc=counts(row,g[1]);const last=fmtStamp(row?.Derniere_mise_a_jour),by=row?.Derniere_mise_a_jour_par||'—';app.innerHTML=`<div class="shell"><aside class="side"><div class="sideHead"><div class="title">Autodiagnostic</div><div class="sub">Réponse collaborative par site</div><select id="site" class="select">${state.rows.map(r=>`<option value="${r.id}" ${r.id===row?.id?'selected':''}>${esc(r.gristHelper_Display||('Site '+r.id))}</option>`).join('')}</select><div class="progress"><div class="progressTop"><span>Progression globale</span><strong>${all.done}/${all.total} · ${all.pct}%</strong></div><div class="bar"><div class="fill" style="width:${all.pct}%"></div></div></div></div><div class="nav">${GROUPS.map((x,i)=>{const c=counts(row,x[1]);return `<button class="navBtn ${i===state.group?'active':''}" data-group="${i}"><span>${esc(x[0])}</span><span class="count">${c.done}/${c.total} · ${c.pct}%</span></button>`}).join('')}</div></aside><section class="main"><div class="hero"><div class="heroTop"><div><div class="siteName">${esc(currentSiteName())}</div><div class="meta">${esc(row?.gristHelper_Display2||'')} · réponses partagées par tous les utilisateurs du site</div></div></div><div class="status"><span class="pill green">✓ Sauvegarde champ par champ</span><span class="pill">Dernière modification : ${esc(last)}</span><span class="pill">Par : ${esc(by)}</span>${state.remoteNotice?`<span class="pill amber">${esc(state.remoteNotice)}</span>`:''}</div><div class="sync">Actualisation collaborative automatique toutes les 15 s${state.lastSync?' · dernière synchro '+state.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</div></div><div class="sectionHead"><div class="sectionTitle">${esc(g[0])}</div><div class="sectionCount">${gc.done} réponse${gc.done>1?'s':''} sur ${gc.total} · ${gc.pct}%</div></div>${g[1].map(questionHtml).join('')}<div class="note"><div class="qtext">Notes générales du site</div><textarea id="notes" class="prec" placeholder="Synthèse, points de vigilance, commentaires transverses…">${esc(row?.Notes_Generales||'')}</textarea><div class="saveState">${esc(state.saving.Notes_Generales||'')}</div></div></section></div>`;bind()}
function bind(){document.getElementById('site')?.addEventListener('change',e=>{state.current=state.rows.find(r=>Number(r.id)===Number(e.target.value));state.group=0;render()});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.group=Number(b.dataset.group);render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>saveField(b.dataset.answer,b.dataset.value));document.querySelectorAll('[data-prec]').forEach(t=>{let timer;t.oninput=()=>{state.dirty.add(t.dataset.prec);clearTimeout(timer);timer=setTimeout(()=>saveField(t.dataset.prec,t.value),750)};t.onblur=()=>{if(state.dirty.has(t.dataset.prec))saveField(t.dataset.prec,t.value)}});const n=document.getElementById('notes');if(n){let timer;n.oninput=()=>{state.dirty.add('Notes_Generales');clearTimeout(timer);timer=setTimeout(()=>saveField('Notes_Generales',n.value),750)};n.onblur=()=>{if(state.dirty.has('Notes_Generales'))saveField('Notes_Generales',n.value)}}}
(async()=>{try{await Promise.all([loadMeta(),(async()=>{state.rows=await ft('Autodiagnostic');state.sites=await ft('SITES_nomenclature_UGECAM')})()]);state.current=state.rows[0]||null;render();setInterval(()=>pullLatest(true),15000)}catch(e){app.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}})();
grist.ready({requiredAccess:'full'});grist.onRecord(r=>{if(r&&state.rows.length&&!state.dirty.size){const x=state.rows.find(a=>Number(a.id)===Number(r.id));if(x){state.current=x;render()}}});
</script></body></html>
