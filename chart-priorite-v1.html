<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphique par priorité</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--green:#16a34a;--gray:#94a3b8;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{padding:10px}.card{background:var(--s);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.title{font-size:14px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:3px}.total{font-size:11px;color:var(--muted);font-weight:800}.rows{display:flex;flex-direction:column;gap:10px}.row{display:grid;grid-template-columns:82px minmax(0,1fr) 92px;gap:10px;align-items:center}.label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%}.barWrap{height:22px;background:#eef2f7;border-radius:999px;overflow:hidden}.bar{height:100%;border-radius:999px;min-width:2px}.stats{text-align:right}.count{font-size:12px;font-weight:850}.pct{font-size:10.5px;color:var(--muted);margin-top:1px}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.kpi{border:1px solid var(--line);border-radius:11px;padding:8px 9px;background:#fafcff}.kpiLabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:850}.kpiValue{font-size:16px;font-weight:900;margin-top:2px}.empty,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:35px 15px;text-align:center;color:var(--muted)}@media(max-width:700px){.row{grid-template-columns:74px minmax(0,1fr) 72px}.legend{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="app"><div class="empty">Chargement des priorités…</div></div><script>const app=document.getElementById('app');function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function txt(v){if(v===null||v===undefined||v==='')return'';if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(Boolean).join(', ')}return String(v)}function norm(v){const s=txt(v).trim();if(!s)return'Non renseignée';const m=s.match(/\d+/);if(m)return m[0];const l=s.toLowerCase();if(l.includes('urgent')||l.includes('crit'))return'1';if(l.includes('haut')||l.includes('élev'))return'2';if(l.includes('moy')||l.includes('normal'))return'3';if(l.includes('bas')||l.includes('faib'))return'4';return s}function colorFor(k){if(k==='1')return'var(--red)';if(k==='2')return'var(--amber)';if(k==='3')return'var(--blue)';if(k==='4')return'var(--green)';return'var(--gray)'}function labelFor(k){if(k==='1')return'Priorité 1';if(k==='2')return'Priorité 2';if(k==='3')return'Priorité 3';if(k==='4')return'Priorité 4';return k}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}async function render(){try{const data=await ft('Remontees_editeur_');const counts={};for(const r of data){const k=norm(r.PRIORITE);counts[k]=(counts[k]||0)+1}const order=['1','2','3','4',...Object.keys(counts).filter(k=>!['1','2','3','4'].includes(k)).sort()];const items=order.filter(k=>counts[k]);const total=data.length||1;const max=Math.max(...items.map(k=>counts[k]),1);const top1=counts['1']||0,top2=counts['2']||0,top3=counts['3']||0,top4=counts['4']||0;app.innerHTML=`<div class="card"><div class="head"><div><div class="title">Répartition par priorité</div><div class="sub">Volume et part des remontées par niveau de priorité</div></div><div class="total">${data.length} remontées</div></div><div class="rows">${items.map(k=>{const c=counts[k],pct=c/total*100,w=c/max*100;return`<div class="row"><div class="label"><span class="dot" style="background:${colorFor(k)}"></span>${labelFor(k)}</div><div class="barWrap"><div class="bar" style="width:${w}%;background:${colorFor(k)}"></div></div><div class="stats"><div class="count">${c}</div><div class="pct">${pct.toFixed(1).replace('.',',')} %</div></div></div>`}).join('')}</div><div class="legend"><div class="kpi"><div class="kpiLabel">P1 critiques</div><div class="kpiValue">${top1}</div></div><div class="kpi"><div class="kpiLabel">P2 élevées</div><div class="kpiValue">${top2}</div></div><div class="kpi"><div class="kpiLabel">P3 normales</div><div class="kpiValue">${top3}</div></div><div class="kpi"><div class="kpiLabel">P4 faibles</div><div class="kpiValue">${top4}</div></div></div></div>`}catch(e){app.innerHTML=`<div class="error">Impossible de lire les données : ${String(e?.message||e)}</div>`}}grist.ready({requiredAccess:'full'});render();</script></body></html>
