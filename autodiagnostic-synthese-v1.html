<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthèse Autodiagnostic</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}input,select{font:inherit}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}.kLabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kVal{font-size:22px;font-weight:900;margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:15px;font-weight:900}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px;background:#fff;font-size:11.5px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:10px 11px;border-bottom:1px solid #eef2f7;text-align:left;font-size:11.5px;vertical-align:middle}th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.site{font-weight:800}.bar{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden;min-width:100px}.fill{height:100%;background:var(--blue)}.pct{font-weight:850;margin-left:7px}.mini{display:flex;align-items:center;gap:7px}.chip{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}.good{background:var(--greenSoft);color:var(--green)}.mid{background:var(--amberSoft);color:var(--amber)}.low{background:var(--redSoft);color:var(--red)}.foot{padding:10px 14px;color:var(--muted);font-size:10.5px}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"><div class="loading">Chargement de la synthèse…</div></main><script>
const app=document.getElementById('app');
const GROUPS=[['Transmissions',['transmission1','Tranmissions2','CR1','CR2','CR3','Troublesetcrises1','troublesetcrises2','transmissions_ciblees']],['Admissions',['Preadmission1','Modeles_de_documents','requete1','requete2']],['Agenda',['Agenda1','Agenda2','Agenda3','Presences']],['Soins',['Prescription1','Prescription2','Prescription3','Administration_des_medicaments1','Administration_des_medicaments2','Administration_des_medicaments3','Suivi_soin_nursing']],['Projet personnalisé',['PP1','PP2','PP3','PP4','PP5','PP6','PP7','PP8','PP9']],['Comptes',['comptes_utilisateurs1','comptes_utilisateurs2','comptes_utilisateurs3']],['Services socles',['Services_socles','Services_socles2','Services_socles3']],['Transverses',['transverses1','transverses2','transverses3','transverses4','transverses5','transverses6','transverses7']],['Statistiques',['Statistiques1','Statistiques2','Statistiques3','Statistiques4','Statistiques5','Statistiques6','Statistiques7','Statistiques8']]];
const state={rows:[],q:'',ugecam:''};function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{}),n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API indisponible')}function allIds(){return GROUPS.flatMap(g=>g[1])}function completion(r,ids=allIds()){return Math.round(ids.filter(id=>!empty(r[id])).length/Math.max(1,ids.length)*100)}function cls(p){return p>=75?'good':p>=40?'mid':'low'}function filtered(){const q=state.q.trim().toLowerCase();return state.rows.filter(r=>(!q||[r.gristHelper_Display,r.gristHelper_Display2].join(' ').toLowerCase().includes(q))&&(!state.ugecam||r.gristHelper_Display2===state.ugecam)).sort((a,b)=>completion(b)-completion(a))}function render(){const all=state.rows,shown=filtered(),ugecams=[...new Set(all.map(r=>r.gristHelper_Display2).filter(Boolean))].sort();const avg=all.length?Math.round(all.reduce((s,r)=>s+completion(r),0)/all.length):0,done=all.filter(r=>completion(r)===100).length,started=all.filter(r=>completion(r)>0).length;app.innerHTML=`<div class="kpis"><div class="kpi"><div class="kLabel">Sites</div><div class="kVal">${all.length}</div></div><div class="kpi"><div class="kLabel">Sites démarrés</div><div class="kVal">${started}</div></div><div class="kpi"><div class="kLabel">Terminés</div><div class="kVal">${done}</div></div><div class="kpi"><div class="kLabel">Progression moyenne</div><div class="kVal">${avg}%</div></div></div><section class="card"><div class="head"><div><div class="title">Synthèse Autodiagnostic par site</div></div><div class="tools"><input id="q" placeholder="Rechercher un site…" value="${esc(state.q)}"><select id="u"><option value="">Toutes les UGECAM</option>${ugecams.map(x=>`<option ${x===state.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="tableWrap"><table><thead><tr><th>UGECAM</th><th>Site</th><th>Global</th>${GROUPS.map(g=>`<th>${esc(g[0])}</th>`).join('')}<th>Dernière mise à jour</th><th>Par</th></tr></thead><tbody>${shown.map(r=>{const p=completion(r);return`<tr><td>${esc(r.gristHelper_Display2||'')}</td><td class="site">${esc(r.gristHelper_Display||('Site '+r.id))}</td><td><div class="mini"><div class="bar"><div class="fill" style="width:${p}%"></div></div><span class="pct">${p}%</span></div></td>${GROUPS.map(g=>{const x=completion(r,g[1]);return`<td><span class="chip ${cls(x)}">${x}%</span></td>`}).join('')}<td>${r.Derniere_mise_a_jour?new Date(Number(r.Derniere_mise_a_jour)*1000).toLocaleDateString('fr-FR'):'—'}</td><td>${esc(r.Derniere_mise_a_jour_par||'—')}</td></tr>`}).join('')}</tbody></table></div><div class="foot">${shown.length} site(s) affiché(s). Une réponse est considérée complétée dès qu’une valeur principale est renseignée ; les champs “Précisions” n’entrent pas dans le calcul.</div></section>`;document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};document.getElementById('u').onchange=e=>{state.ugecam=e.target.value;render()}}
(async()=>{try{state.rows=await ft('Autodiagnostic');render()}catch(e){app.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}})();grist.ready({requiredAccess:'full'});</script></body></html>
