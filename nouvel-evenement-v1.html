<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouvel événement MOAD</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:14px}#app{max-width:980px;margin:auto}.hero,.card,.success,.error{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:20px;margin-bottom:12px}.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:12.5px;margin-top:5px}.card{padding:18px}.sectionTitle{font-size:14px;font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:11px;font-weight:800;color:#475569}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;font:inherit;background:#fff;color:var(--text)}textarea{min-height:115px;resize:vertical}.help{font-size:10.5px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.success,.error{padding:16px;margin-top:12px}.success{background:var(--greenSoft);border-color:#bbf7d0;color:var(--green)}.error{background:var(--redSoft);border-color:#fecaca;color:var(--red)}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><main id="app"><div class="hero"><div class="eyebrow">Événements MOAD</div><h1>Créer un nouvel événement</h1><div class="sub">Le formulaire crée directement une ligne dans EVENEMENTS_MOAD.</div></div><form id="form" class="card"><h2 class="sectionTitle">Informations principales</h2><div class="grid"><div class="field full"><label>Titre *</label><input id="title" required placeholder="Ex. Webinaire AIRMES pour cadres UGECAM"></div><div class="field"><label>Début *</label><input id="start" type="datetime-local" required></div><div class="field"><label>Fin</label><input id="end" type="datetime-local"></div><div class="field"><label>Type</label><select id="type"><option value="">Sélectionner…</option><option>Webinaire</option><option>Interventions sur sites</option><option>Comité</option><option>Réunion</option><option>Formation</option><option>Autre</option></select></div><div class="field"><label>Organisateur</label><input id="org" placeholder="Nom de l’organisateur"></div><div class="field full"><label>Description</label><textarea id="desc" placeholder="Objectifs, programme, liens, informations pratiques…"></textarea><div class="help">Le texte peut contenir du markdown simple comme **gras** et des listes avec *.</div></div></div><div class="actions"><button type="button" class="btn" id="reset">Réinitialiser</button><button type="submit" class="btn primary" id="save">Créer l’événement</button></div><div id="msg"></div></form></main><script>const form=document.getElementById('form'),msg=document.getElementById('msg'),save=document.getElementById('save');function v(id){return document.getElementById(id).value.trim()}function epoch(x){if(!x)return null;const d=new Date(x);return Math.floor(d.getTime()/1000)}async function add(values){if(grist?.docApi?.applyUserActions)return grist.docApi.applyUserActions([['AddRecord','EVENEMENTS_MOAD',null,values]]);if(grist?.raw?.docApi?.applyUserActions)return grist.raw.docApi.applyUserActions([['AddRecord','EVENEMENTS_MOAD',null,values]]);throw Error('API d’écriture Grist indisponible')}function clear(){form.reset();msg.innerHTML=''}document.getElementById('reset').onclick=clear;form.onsubmit=async e=>{e.preventDefault();msg.innerHTML='';if(!v('title')||!v('start'))return;save.disabled=true;save.textContent='Création…';try{const values={TITRE_EVENEMENT:v('title'),DEBUT_EVENEMENT:epoch(v('start')),DESCRIPTION_EVENEMENT:v('desc')};if(v('end'))values.FIN_EVENEMENT=epoch(v('end'));if(v('type'))values.TYPE_EVENEMENT=['L',v('type')];if(v('org'))values.ORGANISATEUR_EVENEMENT=['L',v('org')];await add(values);msg.innerHTML='<div class="success"><strong>Événement créé.</strong><br>La ligne a été ajoutée dans Grist.</div>';form.reset()}catch(err){console.error(err);msg.innerHTML='<div class="error"><strong>Création impossible.</strong><br>'+String(err.message||err)+'</div>'}finally{save.disabled=false;save.textContent='Créer l’événement'}};grist.ready({requiredAccess:'full'});</script></body></html>
