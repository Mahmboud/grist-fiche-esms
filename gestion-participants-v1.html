<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion participants</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>body{margin:0;padding:14px;background:#f5f7fb;font-family:Inter,system-ui;color:#0f172a}*{box-sizing:border-box}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.04);margin-bottom:12px}.title{font-size:22px;font-weight:900}.muted{color:#64748b;font-size:12px}.search{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-top:12px}.list{max-height:520px;overflow:auto;margin-top:10px}.row{display:flex;align-items:flex-start;gap:9px;padding:9px;border-radius:10px}.row:hover{background:#f8fafc}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.btn{border:1px solid #dbe3ee;background:#fff;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}.kpi b{font-size:20px}.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:10px;margin-top:10px}.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:10px;margin-top:10px}</style></head><body><div id="app" class="card"><div class="muted">Sélectionnez un événement dans Grist.</div></div><script>const E='EVENEMENTS_MOAD',C='CONTACTS';let contacts=[],current=null;const app=document.getElementById('app');function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{});const n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function list(v){if(!v)return[];if(Array.isArray(v))return(v[0]==='L'||v[0]==='l')?v.slice(1):v;return[v]}async function ft(t){return rows(await grist.docApi.fetchTable(t))}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function render(q=''){if(!current){app.innerHTML='<div class="muted">Sélectionnez un événement dans Grist.</div>';return}const selected=new Set(list(current.inscrits).map(Number));const s=q.toLowerCase();const visible=contacts.filter(c=>{const h=`${c.PRENOM||''} ${c.NOM||''} ${c.EMAIL||''} ${c.FONCTION||''}`.toLowerCase();return !s||h.includes(s)});app.innerHTML=`<div class="title">Gérer les participants</div><div class="muted">${esc(current.TITRE_EVENEMENT||'Événement')}</div><div class="kpis"><div class="kpi"><div class="muted">Inscrits</div><b>${selected.size}</b></div><div class="kpi"><div class="muted">Contacts disponibles</div><b>${contacts.length}</b></div></div><input id="q" class="search" placeholder="Rechercher un contact…"><div id="list" class="list">${visible.map(c=>`<label class="row"><input type="checkbox" value="${c.id}" ${selected.has(Number(c.id))?'checked':''}><span><b>${esc((c.PRENOM||'')+' '+(c.NOM||''))}</b><br><span class="muted">${esc(c.FONCTION||'')}${c.EMAIL?' · '+esc(c.EMAIL):''}</span></span></label>`).join('')}</div><div class="actions"><button id="clear" class="btn">Tout décocher</button><button id="save" class="btn primary">Enregistrer</button></div><div id="msg"></div>`;document.getElementById('q').oninput=e=>render(e.target.value);document.getElementById('clear').onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=false);document.getElementById('save').onclick=save}async function save(){const ids=[...document.querySelectorAll('#list input:checked')].map(x=>Number(x.value));try{await grist.docApi.applyUserActions([['UpdateRecord',E,current.id,{inscrits:['L',...ids]}]]);current.inscrits=['L',...ids];document.getElementById('msg').innerHTML='<div class="ok">Participants mis à jour.</div>';render()}catch(e){document.getElementById('msg').innerHTML=`<div class="err">${esc(e.message||e)}</div>`}}async function init(){contacts=await ft(C);grist.onRecord(r=>{current=r;render()})}grist.ready({requiredAccess:'full'});init();</script></body></html>
