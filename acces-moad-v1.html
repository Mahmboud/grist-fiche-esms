<!doctype html><html lang="fr"><head><meta charset="utf-8"><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
body{font:14px system-ui;background:#f5f7fb;margin:0;padding:20px;color:#172033}main{max-width:900px;margin:auto;background:#fff;border:1px solid #dde5ee;border-radius:16px;padding:22px}
h1{margin:0 0 6px}p{color:#64748b}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}
input,select{padding:9px;border:1px solid #ccd5e0;border-radius:8px}#es{border:1px solid #dde5ee;border-radius:9px;padding:8px;max-height:220px;overflow:auto}#es label{display:block;padding:5px}
.hidden{display:none!important}.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:9px;padding:10px;font-size:12px}.found{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:9px;padding:12px}
button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.state{padding:16px;border-radius:12px;background:#fffbeb}.ok{background:#f0fdf4}
.email{font-weight:700;color:#334155}@media(max-width:650px){.g{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main id="a">Chargement…</main><script>
const a=document.getElementById('a'),S={e:[],r:[],d:[],f:[],c:[]};
const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(x=>Array.isArray(x)?x.length:0))},(_,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));
const ft=async t=>{try{return rows(await grist.docApi.fetchTable(t))}catch(e){console.warn(t,e);return[]}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const L=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):[];
const ref=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
function currentContact(){return S.c.length===1?S.c[0]:null}
function show(){
  if(S.d.length){a.innerHTML='<h1>✅ Accès actif</h1><div class="state ok">Vous pouvez ouvrir la page <b>✅ AUTODIAGNOSTIC 🌟 ACCUEIL</b>. Périmètre : '+S.d.length+' site(s).</div>';return}
  const pending=S.r.filter(x=>x.STATUT==='À valider').sort((x,y)=>y.id-x.id);
  if(pending.length){const r=pending[0];a.innerHTML='<h1>Votre demande d’accès</h1><div class="state"><b>À valider</b><br><br>'+esc(r.PRENOM)+' '+esc(r.NOM)+'<br>'+esc(r.EMAIL)+'<br><br>Votre demande est en attente de validation par un administrateur MOAD.</div>';return}
  form();
}
function form(){
  const c=currentContact();
  const ugecams=[...new Map(S.e.filter(x=>x.UGECAM_nom).map(x=>[x.UGECAM_nom,x.UGECAM_ID])).entries()].sort((x,y)=>String(x[0]).localeCompare(String(y[0]),'fr'));
  const intro=c
   ? '<div class="wide found"><b>✅ Nous avons retrouvé votre fiche dans CONTACTS.</b><br>Les informations ci-dessous ont été préremplies. Vérifiez-les et corrigez-les si nécessaire. Après validation par un administrateur, <b>votre ligne CONTACTS existante sera mise à jour</b>.</div>'
   : '<div class="wide info"><b>Nouvel utilisateur.</b> Aucune fiche CONTACTS n’a été retrouvée pour votre adresse de connexion. Après validation, une nouvelle ligne sera créée dans CONTACTS.</div>';
  a.innerHTML='<h1>Bienvenue dans l’Autodiagnostic MOAD</h1><p>Vérifiez votre rattachement professionnel. L’adresse utilisée est celle de votre compte Grist.</p><form id="f" class="g" autocomplete="off">'+intro+
   '<div class="f"><label>Prénom *</label><input id="p" required></div>'+
   '<div class="f"><label>Nom *</label><input id="n" required></div>'+
   '<div class="f"><label>Fonction *</label><select id="fn" required><option value="">Choisir…</option>'+S.f.slice().sort((x,y)=>String(x.LIBELLE||'').localeCompare(String(y.LIBELLE||''),'fr')).map(x=>'<option value="'+x.id+'">'+esc(x.LIBELLE)+'</option>').join('')+'</select></div>'+
   '<div class="f"><label>UGECAM *</label><select id="u" required><option value="">Choisir…</option>'+ugecams.map(x=>'<option value="'+x[1]+'">'+esc(x[0])+'</option>').join('')+'</select></div>'+
   '<div class="f"><label>Site principal</label><select id="s" required disabled><option value="">Choisir…</option></select></div>'+'<div class="f wide"><label>Autres sites en responsabilités</label><div id="ms" class="checks">Choisissez une UGECAM.</div><div class="sub">À utiliser notamment si vous êtes responsable de plusieurs sites. Le site principal ci-dessus reste obligatoire.</div></div>'+
   '<div class="f wide" id="esWrap"><label>ESMS rattachés à votre site principal</label><div id="es">Choisissez UGECAM puis site.</div></div>'+
   '<div class="wide info hidden" id="siegeInfo"></div>'+
   '<label class="wide"><input id="confirm" type="checkbox" required> Je confirme l’exactitude de ces informations professionnelles.</label>'+
   '<div class="wide"><button>Soumettre à validation</button><span id="msg"></span></div></form>';
  const uEl=document.getElementById('u'),sEl=document.getElementById('s'),esEl=document.getElementById('es'),esWrap=document.getElementById('esWrap'),siegeInfo=document.getElementById('siegeInfo');const msEl=document.getElementById('ms');
  const pEl=document.getElementById('p'),nEl=document.getElementById('n'),fnEl=document.getElementById('fn'),msgEl=document.getElementById('msg'),fEl=document.getElementById('f');
  function fillSites(selected=[]){
    const uid=+uEl.value;
    const z=[...new Map(S.e.filter(x=>+x.UGECAM_ID===uid&&x.SITE_ID).map(x=>[x.SITE_ID,x.SITE_nom])).entries()].sort((x,y)=>String(x[1]).localeCompare(String(y[1]),'fr'));
    sEl.disabled=!uid;sEl.innerHTML='<option value="">Choisir…</option>'+z.map(x=>'<option value="'+x[0]+'">'+esc(x[1])+'</option>').join('');
    const sel=new Set(selected.map(Number));msEl.innerHTML=z.length?z.map(x=>'<label><input name="ms" type="checkbox" value="'+x[0]+'" '+(sel.has(+x[0])?'checked':'')+'> '+esc(x[1])+'</label>').join(''):'Aucun site.';
    esEl.innerHTML='Choisissez un site.';esWrap.classList.remove('hidden');siegeInfo.classList.add('hidden');
  }
  function fillEsms(selected=[]){
    const siteLabel=(sEl.options[sEl.selectedIndex]?.text||'').trim(),siege=/^SI[EÈ]GE\b/i.test(siteLabel),dngu=/^DNGU\b/i.test(siteLabel),global=siege||dngu;
    esWrap.classList.toggle('hidden',global);siegeInfo.classList.toggle('hidden',!global);
    if(global){siegeInfo.textContent=dngu?'Profil DNGU : après validation, accès à toutes les UGECAM.':'Profil Siège : après validation, accès aux sites rattachés à votre UGECAM.';esEl.innerHTML='';return}
    const z=S.e.filter(x=>+x.UGECAM_ID===+uEl.value&&+x.SITE_ID===+sEl.value),sel=new Set(selected.map(Number));
    esEl.innerHTML=z.map(x=>'<label><input name="e" type="checkbox" value="'+x.ESMS_ID+'" '+(sel.has(+x.ESMS_ID)?'checked':'')+'> '+esc(x.ESMS_nom)+'</label>').join('')||'Aucun ESMS.';
  }
  uEl.onchange=()=>fillSites();sEl.onchange=()=>fillEsms();
  if(c){
    pEl.value=c.PRENOM||'';nEl.value=c.NOM||'';fnEl.value=ref(c.FONCTION)||'';
    uEl.value=ref(c.UGECAM)||'';fillSites(L(c.SITES_EN_RESPONSABILITE));
    sEl.value=ref(c.SITES_nomenclature_UGECAM)||'';
    fillEsms(L(c.ESMS_Liste_UGECAM_));
  }
  fEl.onsubmit=async e=>{
    e.preventDefault();msgEl.textContent='';
    const siteLabel=(sEl.options[sEl.selectedIndex]?.text||'').trim(),siege=/^SI[EÈ]GE\b/i.test(siteLabel),dngu=/^DNGU\b/i.test(siteLabel),global=siege||dngu;
    const ids=[...document.querySelectorAll('[name=e]:checked')].map(x=>+x.value);const msIds=[...document.querySelectorAll('[name=ms]:checked')].map(x=>+x.value);const primary=+sEl.value;if(primary&&!msIds.includes(primary))msIds.unshift(primary);
    if(!global&&!ids.length){msgEl.textContent=' Sélectionnez au moins un ESMS.';return}
    try{
      const rec={NOM:nEl.value.trim().toUpperCase(),PRENOM:pEl.value.trim(),FONCTION:+fnEl.value,UGECAM:+uEl.value,SITE:+sEl.value,SITES_EN_RESPONSABILITE:['L',...msIds],ESMS:['L',...ids],PROFIL_ACCES:(dngu?'DNGU':(siege?'SIEGE':'SITE')),CONFIRMATION:true,STATUT:'À valider',DATE_DEMANDE:Date.now()/1000,CONTACT:c?+c.id:0};
      await grist.docApi.applyUserActions([['AddRecord','DEMANDES_ACCES',null,rec]]);
      S.r=await ft('DEMANDES_ACCES');show();
    }catch(err){console.error(err);msgEl.textContent=' Erreur Grist : '+(err?.message||String(err))}
  };
}
(async()=>{await grist.ready({requiredAccess:'full'});[S.d,S.r,S.e,S.f,S.c]=await Promise.all([ft('Autodiagnostic'),ft('DEMANDES_ACCES'),ft('REFERENTIEL_INSCRIPTION_ESMS'),ft('REFERENTIEL_FONCTIONS'),ft('CONTACTS')]);show()})()
</script></body></html>
