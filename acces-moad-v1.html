<!doctype html><html lang="fr"><head><meta charset="utf-8">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://mahmboud.github.io/grist-fiche-esms/moad-ref-config.js?v=2"></script>
<style>
body{font:14px system-ui;background:#f5f7fb;margin:0;padding:20px;color:#172033}main{max-width:900px;margin:auto;background:#fff;border:1px solid #dde5ee;border-radius:16px;padding:22px}h1{margin:0 0 6px}p{color:#64748b}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}input,select{padding:9px;border:1px solid #ccd5e0;border-radius:8px}.checks{border:1px solid #dde5ee;border-radius:9px;padding:8px;max-height:220px;overflow:auto}.checks label{display:inline-block;margin:4px 10px 4px 0}.hidden{display:none!important}.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:9px;padding:10px;font-size:12px}.found{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:9px;padding:12px}.sub{font-size:11px;color:#64748b}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.state{padding:16px;border-radius:12px;background:#fffbeb}.ok{background:#f0fdf4}.privacy{grid-column:1/-1;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc;padding:12px 14px;color:#334155;font-size:12px;line-height:1.55}.privacy summary{cursor:pointer;font-weight:800;color:#0f172a;font-size:13px}.privacyText{margin-top:9px}.privacyText b{color:#0f172a}.privacyFoot{margin-top:9px;padding-top:8px;border-top:1px solid #e2e8f0}.privacy a{color:#2563eb}@media(max-width:650px){.g{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main id="a">Chargement…</main><script>
const a=document.getElementById('a'),S={sites:[],r:[],d:[],f:[],c:[]};
const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(x=>Array.isArray(x)?x.length:0))},(_,i)=>Object.fromEntries(Object.entries(d||{}).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));
const ft=async t=>{try{return rows(await grist.docApi.fetchTable(t))}catch(e){console.warn(t,e);return[]}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const L=v=>{if(Array.isArray(v))return v[0]==='L'?v.slice(1):v;if(typeof v==='string'){try{return L(JSON.parse(v))}catch{return[]}}return[]};
const ref=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
function currentContact(){return S.c.length===1?S.c[0]:null}
function siteById(id){return S.sites.find(x=>Number(x.SITE_ID)===Number(id))}
function siteType(id){return String(siteById(id)?.TYPE_SITE||'').toUpperCase()}
function show(){if(S.d.length){a.innerHTML='<h1>✅ Accès actif</h1><div class="state ok">Votre accès est validé. Vous pouvez utiliser les pages autorisées du dispositif MOAD.</div>';return}const pending=S.r.filter(x=>x.STATUT==='À valider').sort((x,y)=>y.id-x.id);if(pending.length){const r=pending[0];a.innerHTML='<h1>Votre demande d’accès</h1><div class="state"><b>À valider</b><br><br>'+esc(r.PRENOM)+' '+esc(r.NOM)+'<br>'+esc(r.EMAIL)+'<br><br>Votre demande est en attente de validation par un administrateur MOAD.</div>';return}form()}
function form(){
 const c=currentContact();
 const ugecams=[...new Map(S.sites.filter(x=>x.UGECAM_nom).map(x=>[x.UGECAM_nom,x.UGECAM_ID])).entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'fr'));
 const intro=c?'<div class="wide found"><b>✅ Nous avons retrouvé votre fiche dans CONTACTS.</b><br>Les informations ont été préremplies. Vérifiez-les et corrigez-les si nécessaire. Après validation, votre fiche CONTACTS existante sera mise à jour.</div>':'<div class="wide info"><b>Nouvel utilisateur.</b> Aucune fiche CONTACTS n’a été retrouvée pour votre adresse de connexion. Après validation, une nouvelle fiche sera créée.</div>';
 a.innerHTML='<h1>Bienvenue dans l’Autodiagnostic MOAD</h1><p>Vérifiez votre rattachement professionnel. L’adresse utilisée est celle de votre compte Grist.</p><form id="f" class="g" autocomplete="off">'+intro+
 '<div class="f"><label>Prénom *</label><input id="p" required></div><div class="f"><label>Nom *</label><input id="n" required></div>'+
 '<div class="f"><label>Fonction *</label><select id="fn" required><option value="">Choisir…</option>'+S.f.slice().sort((a,b)=>String(a.LIBELLE).localeCompare(String(b.LIBELLE),'fr')).map(x=>'<option value="'+x.id+'">'+esc(x.LIBELLE)+'</option>').join('')+'</select></div>'+
 '<div class="f"><label>UGECAM *</label><select id="u" required><option value="">Choisir…</option>'+ugecams.map(x=>'<option value="'+x[1]+'">'+esc(x[0])+'</option>').join('')+'</select></div>'+
 '<div class="f"><label>Site principal *</label><select id="s" required disabled><option value="">Choisir…</option></select></div>'+
 '<div class="f wide"><label>Autres sites en responsabilité</label><div id="ms" class="checks">Choisissez une UGECAM.</div><div class="sub">Facultatif. Les ESMS/services accessibles sont déduits automatiquement des sites sélectionnés.</div></div>'+
 '<div class="wide info hidden" id="profileInfo"></div>'+
 '<details class="privacy" open><summary>🔐 Information sur le traitement de vos données professionnelles</summary><div class="privacyText"><b>Finalités :</b> gérer votre inscription, votre rattachement professionnel, vos habilitations et l’accès à l’Autodiagnostic MOAD. <b>Données traitées :</b> nom, prénom, mail professionnel, fonction, UGECAM, site(s) et habilitations nécessaires au fonctionnement du dispositif. <b>Vos droits :</b> vous pouvez demander l’accès ou la rectification de vos données et contacter le DPO de votre organisme pour toute question relative à leur traitement. <b>Confidentialité et sécurité :</b> les données sont accessibles uniquement aux personnes habilitées selon leur périmètre et font l’objet de mesures de sécurité adaptées.</div><div class="privacyFoot">Contact dispositif : <a href="mailto:moad.dui.ug-bfc@ugecam.assurance-maladie.fr">moad.dui.ug-bfc@ugecam.assurance-maladie.fr</a>. La validation ci-dessous porte uniquement sur l’exactitude de vos informations professionnelles et ne constitue pas un consentement au traitement.</div></details>'+
 '<label class="wide"><input id="confirm" type="checkbox" required> Je confirme l’exactitude de ces informations professionnelles.</label><div class="wide"><button>Soumettre à validation</button><span id="msg"></span></div></form>';
 const u=document.getElementById('u'),s=document.getElementById('s'),ms=document.getElementById('ms'),info=document.getElementById('profileInfo'),p=document.getElementById('p'),n=document.getElementById('n'),fn=document.getElementById('fn'),msg=document.getElementById('msg'),form=document.getElementById('f');
 function fillSites(selected=[]){
   const uid=Number(u.value),z=S.sites.filter(x=>Number(x.UGECAM_ID)===uid).sort((a,b)=>String(a.SITE_nom).localeCompare(String(b.SITE_nom),'fr'));
   s.disabled=!uid;s.innerHTML='<option value="">Choisir…</option>'+z.map(x=>'<option value="'+x.SITE_ID+'">'+esc(x.SITE_nom)+'</option>').join('');
   const sel=new Set(selected.map(Number));ms.innerHTML=z.filter(x=>!['SIEGE','DNGU'].includes(String(x.TYPE_SITE).toUpperCase())).map(x=>'<label><input name="ms" type="checkbox" value="'+x.SITE_ID+'" '+(sel.has(Number(x.SITE_ID))?'checked':'')+'> '+esc(x.SITE_nom)+'</label>').join('')||'Aucun autre site.';
   info.classList.add('hidden');
 }
 function updateProfile(){const t=siteType(s.value);info.classList.toggle('hidden',!['SIEGE','DNGU'].includes(t));if(t==='SIEGE')info.textContent='Profil Siège : après validation, accès au périmètre de votre UGECAM.';if(t==='DNGU')info.textContent='Profil DNGU : après validation, accès au périmètre national.'}
 u.onchange=()=>fillSites();s.onchange=updateProfile;
 if(c){p.value=c.PRENOM||'';n.value=c.NOM||'';fn.value=ref(c.FONCTION)||'';u.value=ref(c.UGECAM)||'';fillSites(L(c.SITES_EN_RESPONSABILITE));s.value=ref(c.SITE_PRINCIPAL)||'';updateProfile()}
 form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const primary=Number(s.value),type=siteType(primary),extra=[...document.querySelectorAll('[name=ms]:checked')].map(x=>Number(x.value)).filter(x=>x!==primary);try{await grist.docApi.applyUserActions([['AddRecord','DEMANDES_ACCES',null,{NOM:n.value.trim().toUpperCase(),PRENOM:p.value.trim(),FONCTION:Number(fn.value),UGECAM:Number(u.value),SITE:primary,SITES_EN_RESPONSABILITE:['L',...new Set(extra)],PROFIL_ACCES:type==='DNGU'?'DNGU':(type==='SIEGE'?'SIEGE':'SITE'),CONFIRMATION:true,STATUT:'À valider',DATE_DEMANDE:Date.now()/1000,CONTACT:c?Number(c.id):0}]]) ;S.r=await ft('DEMANDES_ACCES');show()}catch(err){console.error(err);msg.textContent=' Erreur Grist : '+(err?.message||String(err))}}
}
(async()=>{await grist.ready({requiredAccess:'full'});const cfg=await loadMoadRefConfig(),rawSites=await ft('SITES');S.sites=rawSites.map(x=>({UGECAM_ID:x.UGECAM,UGECAM_nom:x.gristHelper_Display2||'',SITE_ID:x.id,SITE_nom:x.NOM_SITE,TYPE_SITE:x.TYPE_SITE||''}));S.f=(cfg.fonctions||[]).map(x=>({id:x[0],LIBELLE:x[1]}));[S.d,S.r,S.c]=await Promise.all([ft('Autodiagnostic'),ft('DEMANDES_ACCES'),ft('CONTACTS')]);show()})()
</script></body></html>
