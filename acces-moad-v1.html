<!doctype html><html lang=fr><head><meta charset=utf-8><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>body{font:14px system-ui;background:#f5f7fb;margin:0;padding:20px;color:#172033}main{max-width:900px;margin:auto;background:#fff;border:1px solid #dde5ee;border-radius:16px;padding:22px}h1{margin:0 0 6px}p{color:#64748b}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}input,select{padding:9px;border:1px solid #ccd5e0;border-radius:8px}#es{border:1px solid #dde5ee;border-radius:9px;padding:8px;max-height:220px;overflow:auto}#es label{display:block;padding:5px}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.state{padding:16px;border-radius:12px;background:#fffbeb}.ok{background:#f0fdf4}@media(max-width:650px){.g{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main id=a>Chargement…</main><script>
const a=document.getElementById('a'),S={e:[],r:[],d:[]};const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(x=>Array.isArray(x)?x.length:0))},(_,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));const ft=async t=>{try{return rows(await grist.docApi.fetchTable(t))}catch{return[]}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const L=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):[];
function show(){if(S.d.length){a.innerHTML='<h1>✅ Accès actif</h1><div class="state ok">Vous pouvez ouvrir la page <b>✅ AUTODIAGNOSTIC 🌟 ACCUEIL</b>. Périmètre : '+S.d.length+' site(s).</div>';return}if(S.r.length){let r=S.r.sort((x,y)=>y.id-x.id)[0];a.innerHTML='<h1>Votre demande d’accès</h1><div class="state"><b>'+esc(r.STATUT||'À valider')+'</b><br><br>'+esc(r.PRENOM)+' '+esc(r.NOM)+'<br>'+esc(r.EMAIL)+'<br><br>Un administrateur MOAD doit valider votre rattachement avant ouverture de l’autodiagnostic.</div>';return}form()}
function form(){let u=[...new Map(S.e.filter(x=>x.gristHelper_Display4).map(x=>[x.gristHelper_Display4,x.UGECAM])).entries()].sort();a.innerHTML='<h1>Bienvenue dans l’Autodiagnostic MOAD</h1><p>Première connexion : renseignez vos informations professionnelles. Votre accès sera ouvert après validation.</p><form id=f class=g><div class=f><label>Prénom *</label><input id=p required></div><div class=f><label>Nom *</label><input id=n required></div><div class=f><label>Email du compte Grist *</label><input id=m type=email required></div><div class=f><label>Fonction</label><input id=fn></div><div class=f><label>UGECAM *</label><select id=u required><option value="">Choisir…</option>'+u.map(x=>'<option value='+x[1]+'>'+esc(x[0])+'</option>').join('')+'</select></div><div class=f><label>Site *</label><select id=s required disabled></select></div><div class="f wide"><label>ESMS *</label><div id=es>Choisissez UGECAM puis site.</div></div><label class=wide><input id=c type=checkbox required> Je confirme l’exactitude de mon rattachement professionnel.</label><div class=wide><button>Envoyer ma demande</button><span id=msg></span></div></form>';const uEl=document.getElementById('u'),sEl=document.getElementById('s'),esEl=document.getElementById('es'),fEl=document.getElementById('f'),msgEl=document.getElementById('msg'),mEl=document.getElementById('m'),nEl=document.getElementById('n'),pEl=document.getElementById('p'),fnEl=document.getElementById('fn');uEl.onchange=()=>{let uid=+uEl.value,z=[...new Map(S.e.filter(x=>+x.UGECAM===uid&&x.SITES_nomenclature_UGECAM).map(x=>[x.SITES_nomenclature_UGECAM,x.gristHelper_Display5])).entries()];sEl.disabled=!uid;sEl.innerHTML='<option value="">Choisir…</option>'+z.map(x=>'<option value='+x[0]+'>'+esc(x[1])+'</option>').join('')};sEl.onchange=()=>{let z=S.e.filter(x=>+x.UGECAM===+uEl.value&&+x.SITES_nomenclature_UGECAM===+sEl.value);esEl.innerHTML=z.map(x=>'<label><input name=e type=checkbox value='+x.id+'> '+esc(x.ESMS_raison_sociale)+'</label>').join('')||'Aucun ESMS.'};fEl.onsubmit=async e=>{e.preventDefault();let ids=[...document.querySelectorAll('[name=e]:checked')].map(x=>+x.value);if(!ids.length)return msgEl.textContent=' Sélectionnez au moins un ESMS.';try{await grist.docApi.applyUserActions([['AddRecord','DEMANDES_ACCES',null,{EMAIL:mEl.value.trim().toLowerCase(),NOM:nEl.value.trim().toUpperCase(),PRENOM:pEl.value.trim(),FONCTION:fnEl.value.trim(),UGECAM:+uEl.value,SITE:+sEl.value,ESMS:['L',...ids],CONFIRMATION:true,STATUT:'À valider',DATE_DEMANDE:Date.now()/1000}]]);S.r=await ft('DEMANDES_ACCES');show()}catch{msgEl.textContent=' Email différent du compte Grist ou erreur de saisie.'}}}
(async()=>{await grist.ready({requiredAccess:'full'});[S.d,S.r,S.e]=await Promise.all([ft('Autodiagnostic'),ft('DEMANDES_ACCES'),ft('ESMS_Liste_UGECAM_')]);show()})()
</script></body></html>
