<!doctype html><html lang=fr><head><meta charset=utf-8><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>body{font:14px system-ui;background:#f5f7fb;margin:0;padding:20px;color:#172033}main{max-width:900px;margin:auto;background:#fff;border:1px solid #dde5ee;border-radius:16px;padding:22px}h1{margin:0 0 6px}p{color:#64748b}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}input,select{padding:9px;border:1px solid #ccd5e0;border-radius:8px}#es{border:1px solid #dde5ee;border-radius:9px;padding:8px;max-height:220px;overflow:auto}#es label{display:block;padding:5px}.hidden{display:none!important}.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:9px;padding:10px;font-size:12px}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.state{padding:16px;border-radius:12px;background:#fffbeb}.ok{background:#f0fdf4}@media(max-width:650px){.g{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main id=a>Chargement…</main><script>
const a=document.getElementById('a'),S={e:[],r:[],d:[],f:[]};const rows=d=>Array.isArray(d)?d:Array.from({length:Math.max(0,...Object.values(d||{}).map(x=>Array.isArray(x)?x.length:0))},(_,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,Array.isArray(v)?v[i]:v])));const ft=async t=>{try{return rows(await grist.docApi.fetchTable(t))}catch{return[]}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const L=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):[];
function show(){if(S.d.length){a.innerHTML='<h1>✅ Accès actif</h1><div class="state ok">Vous pouvez ouvrir la page <b>✅ AUTODIAGNOSTIC 🌟 ACCUEIL</b>. Périmètre : '+S.d.length+' site(s).</div>';return}if(S.r.length){let r=S.r.sort((x,y)=>y.id-x.id)[0];a.innerHTML='<h1>Votre demande d’accès</h1><div class="state"><b>'+esc(r.STATUT||'À valider')+'</b><br><br>'+esc(r.PRENOM)+' '+esc(r.NOM)+'<br>'+esc(r.EMAIL)+'<br><br>Un administrateur MOAD doit valider votre rattachement avant ouverture de l’autodiagnostic.</div>';return}form()}
function form(){let u=[...new Map(S.e.filter(x=>x.UGECAM_nom).map(x=>[x.UGECAM_nom,x.UGECAM_ID])).entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'fr'));a.innerHTML='<h1>Bienvenue dans l’Autodiagnostic MOAD</h1><p>Première connexion : renseignez vos informations professionnelles. Votre adresse de connexion Grist sera enregistrée automatiquement avec la demande. Votre accès sera ouvert après validation.</p><form id=f class=g autocomplete=off><div class=f><label>Prénom *</label><input id=p required></div><div class=f><label>Nom *</label><input id=n required></div><div class=f><label>Fonction *</label><select id=fn name=fonction required><option value="">Choisir…</option>'+S.f.slice().sort((x,y)=>String(x.LIBELLE||'').localeCompare(String(y.LIBELLE||''),'fr')).map(x=>'<option value='+x.id+'>'+esc(x.LIBELLE)+'</option>').join('')+'</select></div><div class=f><label>UGECAM *</label><select id=u required><option value="">Choisir…</option>'+u.map(x=>'<option value='+x[1]+'>'+esc(x[0])+'</option>').join('')+'</select></div><div class=f><label>Site *</label><select id=s required disabled></select></div><div class="f wide" id=esWrap><label>ESMS *</label><div id=es>Choisissez UGECAM puis site.</div></div><div class="wide info hidden" id=siegeInfo>Profil Siège : après validation, vous aurez accès à l’ensemble des formulaires Autodiagnostic des sites rattachés à votre UGECAM.</div><label class=wide><input id=c type=checkbox required> Je confirme l’exactitude de mon rattachement professionnel.</label><div class=wide><button>Envoyer ma demande</button><span id=msg></span></div></form>';const uEl=document.getElementById('u'),sEl=document.getElementById('s'),esEl=document.getElementById('es'),esWrap=document.getElementById('esWrap'),siegeInfo=document.getElementById('siegeInfo'),fEl=document.getElementById('f'),msgEl=document.getElementById('msg'),nEl=document.getElementById('n'),pEl=document.getElementById('p'),fnEl=document.getElementById('fn');uEl.onchange=()=>{let uid=+uEl.value,z=[...new Map(S.e.filter(x=>+x.UGECAM_ID===uid&&x.SITE_ID).map(x=>[x.SITE_ID,x.SITE_nom])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'fr'));sEl.disabled=!uid;sEl.innerHTML='<option value="">Choisir…</option>'+z.map(x=>'<option value='+x[0]+'>'+esc(x[1])+'</option>').join('');esWrap.classList.remove('hidden');siegeInfo.classList.add('hidden');esEl.innerHTML='Choisissez un site.'};sEl.onchange=()=>{let siteLabel=(sEl.options[sEl.selectedIndex]?.text||'').trim(),siege=/^SI[EÈ]GE\b/i.test(siteLabel),dngu=/^DNGU\b/i.test(siteLabel),global=siege||dngu;esWrap.classList.toggle('hidden',global);siegeInfo.classList.toggle('hidden',!global);siegeInfo.textContent=dngu?'Profil DNGU : après validation, vous aurez accès à l’ensemble des formulaires Autodiagnostic de toutes les UGECAM.':'Profil Siège : après validation, vous aurez accès à l’ensemble des formulaires Autodiagnostic des sites rattachés à votre UGECAM.';if(global){esEl.innerHTML='';return}let z=S.e.filter(x=>+x.UGECAM_ID===+uEl.value&&+x.SITE_ID===+sEl.value);esEl.innerHTML=z.map(x=>'<label><input name=e type=checkbox value='+x.ESMS_ID+'> '+esc(x.ESMS_nom)+'</label>').join('')||'Aucun ESMS.'};fEl.onsubmit=async e=>{e.preventDefault();let siteLabel=(sEl.options[sEl.selectedIndex]?.text||'').trim(),siege=/^SI[EÈ]GE\b/i.test(siteLabel),dngu=/^DNGU\b/i.test(siteLabel),global=siege||dngu,ids=[...document.querySelectorAll('[name=e]:checked')].map(x=>+x.value);if(!global&&!ids.length)return msgEl.textContent=' Sélectionnez au moins un ESMS.';try{await grist.docApi.applyUserActions([['AddRecord','DEMANDES_ACCES',null,{NOM:nEl.value.trim().toUpperCase(),PRENOM:pEl.value.trim(),FONCTION:+fnEl.value,UGECAM:+uEl.value,SITE:+sEl.value,ESMS:['L',...ids],PROFIL_ACCES:(dngu?'DNGU':(siege?'SIEGE':'SITE')),CONFIRMATION:true,STATUT:'À valider',DATE_DEMANDE:Date.now()/1000}]]);S.r=await ft('DEMANDES_ACCES');show()}catch(err){console.error(err);msgEl.textContent=' Erreur Grist : '+(err?.message||String(err))}}}
(async()=>{await grist.ready({requiredAccess:'full'});[S.d,S.r,S.e,S.f]=await Promise.all([ft('Autodiagnostic'),ft('DEMANDES_ACCES'),ft('REFERENTIEL_INSCRIPTION_ESMS'),ft('REFERENTIEL_FONCTIONS')]);show()})()
</script></body></html>
