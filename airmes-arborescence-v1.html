<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arborescence AIRMES</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>
:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px;text-align:center;color:var(--muted)}.head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.title{font-size:20px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:4px}.tools{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.tools input,.tools select,.tools button{border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:8px 10px;font-size:11.5px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.klabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kvalue{font-size:20px;font-weight:900;margin-top:2px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.legend{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted)}.tree{padding:10px 12px 18px;overflow:auto;max-height:calc(100vh - 220px)}details{margin:1px 0}summary{list-style:none;cursor:pointer;border-radius:9px;padding:6px 8px;display:flex;align-items:center;gap:7px}summary::-webkit-details-marker{display:none}summary:hover{background:#f8fafc}.chev{width:15px;color:#64748b;font-size:10px}.nodeName{font-size:12.5px;font-weight:720}.meta{font-size:10.5px;color:var(--muted)}.children{margin-left:17px;border-left:1px solid #e8edf4;padding-left:8px}.leaf{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;margin:1px 0;border-radius:9px;background:var(--greenSoft);border:1px solid #dcfce7}.leafIcon{font-size:12px}.leafMain{min-width:0}.leafName{font-size:12.5px;font-weight:850;color:#14532d}.leafMeta{font-size:10.5px;color:#4b5563;margin-top:2px}.badge{display:inline-flex;border-radius:999px;padding:2px 6px;font-size:9.5px;font-weight:800;background:var(--blueSoft);color:#1d4ed8;margin-left:4px}.empty{padding:30px;text-align:center;color:var(--muted)}mark{background:#fef08a;border-radius:2px;padding:0 1px}@media(max-width:850px){.head{grid-template-columns:1fr}.tools{justify-content:flex-start}.kpis{grid-template-columns:repeat(2,1fr)}.tree{max-height:none}}</style></head><body><main id="app"><div class="loading">Chargement de l’arborescence AIRMES…</div></main><script>
const app=document.getElementById('app');const state={rows:[],ugecam:[],esms:[],q:'',u:'',e:'',onlyLeaves:false};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function rows(d){if(!d)return[];if(Array.isArray(d))return d;const ks=Object.keys(d);const n=Math.max(...ks.map(k=>Array.isArray(d[k])?d[k].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(ks.map(k=>[k,Array.isArray(d[k])?d[k][i]:d[k]])))}
function list(v){if(v==null||v==='')return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return list(p)}catch{}return[v]}return[v]}
function clean(v){return String(v??'').trim()}
function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}
async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
function ugecamName(r){const ref=Number(r.NIVEAU1);return clean(byId(state.ugecam,ref)?.UGECAM)||clean(r.gristHelper_Display3)||clean(r.NIVEAU1)}
function esmsNames(r){return list(r.Rattachement_ESMS_liste_UGECAM).map(Number).map(id=>clean(byId(state.esms,id)?.ESMS_raison_sociale)).filter(Boolean)}
function pathOf(r){const p=[];for(let i=0;i<=9;i++){let v=i===1?ugecamName(r):clean(r['NIVEAU'+i]);if(v&&v!=='0'&&!/^b['\"]/i.test(v))p.push(v)}return p}
function valid(r){return Number(r.id)>1&&clean(r.ARBORESCENCE)!=='import_path'&&pathOf(r).length>0}
function buildTree(source){const root={name:'root',children:new Map(),record:null};for(const r of source){let n=root;for(const part of pathOf(r)){if(!n.children.has(part))n.children.set(part,{name:part,children:new Map(),record:null});n=n.children.get(part)}n.record=r}return root}
function allLeafRows(source){const root=buildTree(source),out=[];function walk(n,path=[]){if(n!==root&&n.children.size===0){out.push({node:n,path,record:n.record})}for(const c of n.children.values())walk(c,[...path,c.name])}walk(root,[]);return out}
function filteredRows(){const q=state.q.toLowerCase().trim();return state.rows.filter(valid).filter(r=>{const p=pathOf(r),u=ugecamName(r),es=esmsNames(r);const hay=[...p,...es,clean(r.type_prestation_name),clean(r.ID_service)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!state.u||u===state.u)&&(!state.e||es.includes(state.e))})}
function hi(s){if(!state.q)return esc(s);const q=state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return esc(s).replace(new RegExp('('+q+')','ig'),'<mark>$1</mark>')}
function nodeHtml(n,depth=0){const kids=[...n.children.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));const isLeaf=kids.length===0;if(isLeaf){const r=n.record||{},es=esmsNames(r),type=clean(r.type_prestation_name);return `<div class="leaf"><div class="leafIcon">◆</div><div class="leafMain"><div class="leafName">${hi(n.name)} <span class="badge">Service le plus fin</span></div><div class="leafMeta">${type?esc(type):'Type non renseigné'}${es.length?' • '+esc(es.join(', ')):''}${r.LEVEL!==undefined?' • niveau '+esc(r.LEVEL):''}</div></div></div>`}if(state.onlyLeaves)return kids.map(k=>nodeHtml(k,depth+1)).join('');return `<details ${depth<2?'open':''}><summary><span class="chev">▶</span><span class="nodeName">${hi(n.name)}</span><span class="meta">${kids.length} sous-niveau${kids.length>1?'x':''}</span></summary><div class="children">${kids.map(k=>nodeHtml(k,depth+1)).join('')}</div></details>`}
function render(){const fr=filteredRows(),tree=buildTree(fr),leaves=allLeafRows(fr);const ugecams=[...new Set(state.rows.filter(valid).map(ugecamName).filter(Boolean))].sort();const esAll=[...new Set(state.rows.filter(valid).flatMap(esmsNames))].sort();const maxDepth=Math.max(0,...fr.map(r=>pathOf(r).length));app.innerHTML=`<div class="head"><div><div class="title">Arborescence des entités AIRMES</div><div class="sub">Chaque feuille verte correspond au service le plus fin renseigné dans sa branche.</div></div><div class="tools"><input id="q" placeholder="Rechercher un service…" value="${esc(state.q)}"><select id="u"><option value="">Toutes les UGECAM</option>${ugecams.map(x=>`<option ${x===state.u?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="e"><option value="">Tous les établissements</option>${esAll.map(x=>`<option ${x===state.e?'selected':''}>${esc(x)}</option>`).join('')}</select><button id="expand">Tout déplier</button><button id="collapse">Tout replier</button></div></div><div class="kpis"><div class="kpi"><div class="klabel">Lignes hiérarchiques</div><div class="kvalue">${fr.length}</div></div><div class="kpi"><div class="klabel">Services les plus fins</div><div class="kvalue">${leaves.length}</div></div><div class="kpi"><div class="klabel">Établissements</div><div class="kvalue">${new Set(fr.flatMap(esmsNames)).size}</div></div><div class="kpi"><div class="klabel">Profondeur max.</div><div class="kvalue">${maxDepth}</div></div></div><div class="panel"><div class="legend">◆ feuille = service le plus fin <label style="margin-left:auto"><input id="leaves" type="checkbox" ${state.onlyLeaves?'checked':''}> afficher uniquement les feuilles</label></div><div class="tree">${tree.children.size?[...tree.children.values()].map(n=>nodeHtml(n,0)).join(''):'<div class="empty">Aucun résultat.</div>'}</div></div>`;bind()}
function bind(){q.oninput=e=>{state.q=e.target.value;render()};u.onchange=e=>{state.u=e.target.value;state.e='';render()};e.onchange=e=>{state.e=e.target.value;render()};leaves.onchange=e=>{state.onlyLeaves=e.target.checked;render()};expand.onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);collapse.onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false)}
(async()=>{try{[state.rows,state.ugecam,state.esms]=await Promise.all([ft('Import_entite_AIRMES'),ft('UGECAM'),ft('ESMS_Liste_UGECAM_')]);render()}catch(e){app.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}})();grist.ready({requiredAccess:'full'});
</script></body></html>
