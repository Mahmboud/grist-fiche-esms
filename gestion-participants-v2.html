<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion participants — Grist</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:1300px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.head{padding:16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:var(--blue)}h1{font-size:20px;margin:4px 0 3px}.sub{font-size:12px;color:var(--muted)}.toolbar{padding:14px 16px;display:grid;grid-template-columns:2fr 1fr auto;gap:8px;border-bottom:1px solid var(--line)}select,input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;background:#fff}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.meta{padding:10px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fbfdff;border-bottom:1px solid var(--line)}.eventName{font-weight:850}.count{font-size:12px;color:var(--muted)}.list{padding:12px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:520px;overflow:auto}.person{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.person input{width:auto;margin-top:4px}.name{font-size:12.5px;font-weight:800}.role{font-size:11px;color:var(--muted);margin-top:2px}.email{font-size:10.5px;color:#1d4ed8;overflow-wrap:anywhere}.footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.msg{font-size:12px;color:var(--muted)}.loading,.empty{padding:40px;text-align:center;color:var(--muted)}.ok{color:var(--green);font-weight:750}@media(max-width:900px){.list{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}}@media(max-width:600px){.list{grid-template-columns:1fr}}</style></head><body><main id="app"><div class="card"><div class="loading">Chargement…</div></div></main><script>const app=document.getElementById('app');const state={events:[],contacts:[],eventId:null,q:'',selected:new Set(),saving:false};function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function list(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x))}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return list(p)}catch{}return[v]}return[v]}function refs(v){return list(v).map(Number).filter(x=>Number.isFinite(x)&&x>0)}function asDate(v){if(empty(v))return null;const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);return Number.isNaN(d.getTime())?null:d}function dt(v){const d=asDate(v);if(!d)return'';return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API document indisponible')}async function init(){const[e,c]=await Promise.all([ft('EVENEMENTS_MOAD'),ft('CONTACTS')]);state.events=e.sort((a,b)=>(asDate(b.DEBUT_EVENEMENT)?.getTime()||0)-(asDate(a.DEBUT_EVENEMENT)?.getTime()||0));state.contacts=c.sort((a,b)=>String(a.NOM||'').localeCompare(String(b.NOM||''),'fr'));if(!state.eventId&&state.events.length)state.eventId=state.events[0].id;loadSelection();render()}function current(){return state.events.find(e=>Number(e.id)===Number(state.eventId))}function loadSelection(){const e=current();state.selected=new Set(e?refs(e.inscrits):[])}function contactName(c){return [c.PRENOM,c.NOM].filter(Boolean).join(' ')||c.NOM_PRENOM_contact||'Contact'}function filteredContacts(){const q=state.q.trim().toLowerCase();return state.contacts.filter(c=>!q||[contactName(c),c.FONCTION,c.EMAIL].join(' ').toLowerCase().includes(q))}function render(){const e=current();const fc=filteredContacts();app.innerHTML=`<section class="card"><div class="head"><div class="eyebrow">Événements MOAD</div><h1>Gérer les participants</h1><div class="sub">Sélection autonome de l’événement + mise à jour directe du champ inscrits.</div></div><div class="toolbar"><select id="event">${state.events.map(x=>`<option value="${x.id}" ${Number(x.id)===Number(state.eventId)?'selected':''}>${esc(dt(x.DEBUT_EVENEMENT))} — ${esc(x.TITRE_EVENEMENT||'Événement')}</option>`).join('')}</select><input id="q" placeholder="Rechercher un contact…" value="${esc(state.q)}"><button id="all" class="btn">Tout cocher</button></div><div class="meta"><div><div class="eventName">${esc(e?.TITRE_EVENEMENT||'Aucun événement')}</div><div class="count">${state.selected.size} inscrit${state.selected.size>1?'s':''}</div></div><button id="none" class="btn">Tout décocher</button></div><div class="list">${fc.map(c=>`<label class="person"><input type="checkbox" data-id="${c.id}" ${state.selected.has(Number(c.id))?'checked':''}><div><div class="name">${esc(contactName(c))}</div><div class="role">${esc(c.FONCTION||'')}</div>${c.EMAIL?`<div class="email">${esc(c.EMAIL)}</div>`:''}</div></label>`).join('')}</div><div class="footer"><div id="msg" class="msg">Les changements ne sont enregistrés qu’au clic sur Enregistrer.</div><button id="save" class="btn primary" ${state.saving?'disabled':''}>${state.saving?'Enregistrement…':'Enregistrer les participants'}</button></div></section>`;bind()}function bind(){document.getElementById('event').onchange=e=>{state.eventId=Number(e.target.value);loadSelection();render()};document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};document.querySelectorAll('input[type=checkbox][data-id]').forEach(ch=>ch.onchange=e=>{const id=Number(e.target.dataset.id);e.target.checked?state.selected.add(id):state.selected.delete(id);document.querySelector('.count').textContent=`${state.selected.size} inscrit${state.selected.size>1?'s':''}`});document.getElementById('all').onclick=()=>{filteredContacts().forEach(c=>state.selected.add(Number(c.id)));render()};document.getElementById('none').onclick=()=>{state.selected.clear();render()};document.getElementById('save').onclick=save}async function save(){const e=current();if(!e)return;state.saving=true;render();try{const vals=['L',...Array.from(state.selected)];if(grist?.docApi?.applyUserActions){await grist.docApi.applyUserActions([['UpdateRecord','EVENEMENTS_MOAD',Number(e.id),{inscrits:vals}]])}else if(grist?.raw?.docApi?.applyUserActions){await grist.raw.docApi.applyUserActions([['UpdateRecord','EVENEMENTS_MOAD',Number(e.id),{inscrits:vals}]])}else throw new Error('Écriture indisponible');e.inscrits=vals;state.saving=false;render();const m=document.getElementById('msg');m.textContent='Participants enregistrés.';m.className='msg ok'}catch(err){state.saving=false;render();document.getElementById('msg').textContent='Erreur : '+(err?.message||err)}}grist.ready({requiredAccess:'full'});grist.onRecord(r=>{if(r?.id&&state.events.some(e=>Number(e.id)===Number(r.id))){state.eventId=Number(r.id);loadSelection();render()}});init().catch(err=>app.innerHTML=`<div class="card"><div class="empty">Erreur : ${esc(err?.message||err)}</div></div>`);</script></body></html>
