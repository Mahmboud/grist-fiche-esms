<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autodiagnostic 2026 — Pilotage et détail des réponses</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script><script src="https://mahmboud.github.io/grist-fiche-esms/dev/refonte-v1/moad-ref-questions-v1.js"></script>
<style>
:root{--bg:#f5f7fb;--s:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}input,select,button{font:inherit}button{cursor:pointer}#app{max-width:1800px;margin:auto}
.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}
/* Pilotage */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.kpi,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kpi{padding:12px 14px}.lab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.val{font-size:22px;font-weight:900;margin-top:3px}.card{overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:15px;font-weight:900}.sub{font-size:10.5px;color:var(--muted)}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools input,.tools select,.tools button,.filters input,.filters select,.filters button{border:1px solid #cbd5e1;border-radius:9px;padding:8px;background:#fff;font-size:11.5px}.tableWrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #eef2f7;text-align:left;font-size:11px;vertical-align:top}th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:9.5px;text-transform:uppercase;z-index:2}.site{font-weight:800}.bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--blue)}.mini{display:flex;align-items:center;gap:6px}.pct{font-weight:800;white-space:nowrap}.chip{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:9.5px;font-weight:800;white-space:nowrap}.good{background:var(--greenSoft);color:var(--green)}.mid{background:var(--amberSoft);color:var(--amber)}.low{background:var(--redSoft);color:var(--red)}
/* Detail */
.top{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;position:sticky;top:8px;z-index:20}.topRow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.bigTitle{font-size:21px;font-weight:900}.scope{display:inline-flex;margin-top:7px;padding:5px 9px;border-radius:999px;background:var(--blueSoft);color:#1d4ed8;font-size:10.5px;font-weight:850}.filters{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.detailKpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.detailKpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--shadow)}.detailKpi .n{font-size:19px;font-weight:900;margin-top:2px}
.shell{display:grid;grid-template-columns:285px minmax(0,1fr);gap:12px;align-items:start}.side{position:sticky;top:135px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:calc(100vh - 150px)}.sideHead{padding:12px 14px;border-bottom:1px solid var(--line)}.sideTitle{font-size:12px;font-weight:900}.sideSub{font-size:10.5px;color:var(--muted);margin-top:2px}.nav{padding:7px;overflow:auto;max-height:calc(100vh - 215px)}.navBtn{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.navBtn:hover{background:#f8fafc}.navBtn.active{background:var(--blueSoft);color:#1d4ed8}.navName{font-size:11.5px;font-weight:800;line-height:1.25}.navPct{font-size:9.5px;color:var(--muted);font-weight:800}.main{min-width:0}.blockHero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);margin-bottom:10px}.blockTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.blockTitle{font-size:18px;font-weight:900}.blockMeta{font-size:11px;color:var(--muted);margin-top:3px}.blockPct{font-size:24px;font-weight:900}
.qcard{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}.qHead{padding:13px 14px;border-bottom:1px solid #edf2f7}.qid{font-size:9.5px;color:var(--blue);font-weight:900}.qtext{font-size:13px;font-weight:850;line-height:1.4;margin-top:2px}.qmeta{font-size:10px;color:var(--muted);margin-top:5px}.qbody{padding:13px 14px}.chartGrid{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(420px,1.2fr);gap:14px;align-items:start}.chartBox{background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;padding:12px}.chartTitle{font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase;margin-bottom:8px}.bars{display:grid;gap:8px}.barRow{display:grid;grid-template-columns:minmax(100px,180px) minmax(100px,1fr) 70px;gap:8px;align-items:center}.barBtn{border:0;background:transparent;text-align:left;font-size:11px;font-weight:800;padding:3px 0}.barBtn.sel{color:var(--blue)}.barNum{font-size:10px;font-weight:850;text-align:right}.answerTable{border:1px solid #edf2f7;border-radius:12px;overflow:auto;max-height:380px}.answerTable table{min-width:620px}.answerTable th{top:0}.answerTable tr.clickable{cursor:pointer}.answerTable tr.clickable:hover{background:#f8fafc}.pill{display:inline-flex;padding:3px 7px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:9.5px;font-weight:800}.prec{white-space:pre-wrap;line-height:1.35}.rank{display:grid;gap:8px}.rankRow{display:grid;grid-template-columns:26px minmax(180px,1fr) 90px;gap:8px;align-items:center}.rankPos{font-size:12px;font-weight:900}.rankLabel{font-size:11px;font-weight:750}.rankPts{font-size:10px;color:var(--muted);text-align:right}.searchMini{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-size:11px;margin-bottom:8px}
@media(max-width:1100px){.chartGrid{grid-template-columns:1fr}.shell{grid-template-columns:250px minmax(0,1fr)}}@media(max-width:800px){body{padding:6px}.kpis,.detailKpis{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.side,.top{position:static}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}}
</style></head><body><main id="app"><div class="loading">Chargement…</div></main><script>
let CONFIG={version:'2026',sections:[]};
const app=document.getElementById('app'), mode=new URLSearchParams(location.search).get('mode')||'pilotage';
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{}),n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function empty(v){if(v===null||v===undefined)return true;if(typeof v==='string')return v.replace(/\u00a0/g,' ').trim()==='';if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.length===0||a.every(x=>empty(x))}return false}
async function ft(id){return rows(await grist.docApi.fetchTable(id))}
function listVals(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).map(String)}if(typeof v==='string'){try{return listVals(JSON.parse(v))}catch{return[v]}}return[String(v)]}
async function loadConfig(){const cfg=await loadMoadRefConfig(),rr=(cfg.questions||[]).map(x=>({ORDRE:x[0],VOLET:x[1],QUESTION_ID:x[2],QUESTION:x[3],EXPLICATION:x[4],KIND:x[5],CHOICES_JSON:JSON.stringify(x[6]||[]),COL_REPONSE:x[7],COL_PRECISIONS:x[8],COL_CHOIX1:x[9],COL_CHOIX2:x[10],COL_CHOIX3:x[11],NOTES_COL:x[12]})).sort((a,b)=>Number(a.ORDRE||0)-Number(b.ORDRE||0)),sections=[],by=new Map();for(const r of rr){let s=by.get(r.VOLET);if(!s){s={title:r.VOLET,sheet:r.VOLET,questions:[],notes:true,notes_col:r.NOTES_COL||''};by.set(r.VOLET,s);sections.push(s)}let choices=[];try{choices=JSON.parse(r.CHOICES_JSON||'[]')}catch{}const q={id:r.QUESTION_ID,question:r.QUESTION||'',explanation:r.EXPLICATION||'',raw_type:r.RAW_TYPE||'',kind:r.KIND||'text',choices,options:choices,fields:[]};if(q.kind==='choice'||q.kind==='multichoice'){q.fields.push({col:r.COL_REPONSE,type:q.kind==='multichoice'?'ChoiceList':'Choice',label:q.question,choices});if(r.COL_PRECISIONS)q.fields.push({col:r.COL_PRECISIONS,type:'Text',label:'Précisions'})}else if(q.kind==='text'){q.fields.push({col:r.COL_REPONSE,type:'Text',label:q.question})}else if(q.kind==='priority3'){q.fields=[{col:r.COL_CHOIX1,type:'Choice',label:q.question+' — Choix 1',choices},{col:r.COL_CHOIX2,type:'Choice',label:q.question+' — Choix 2',choices},{col:r.COL_CHOIX3,type:'Choice',label:q.question+' — Choix 3',choices},{col:r.COL_PRECISIONS,type:'Text',label:'Précisions'}]}s.questions.push(q)}return{version:'2026',sections}}
function answerCols(q){if(q.kind==='priority3')return q.fields.slice(0,3).map(f=>f.col);return q.fields.length?[q.fields[0].col]:[]}
function answered(r,q){const a=answerCols(q);return q.kind==='priority3'?a.every(c=>!empty(r[c])):a.some(c=>!empty(r[c]))}
function counts(r,sec=null){const qs=sec?sec.questions:CONFIG.sections.flatMap(s=>s.questions),done=qs.filter(q=>answered(r,q)).length,total=qs.length;return{done,total,pct:Math.round(done/Math.max(1,total)*100)}}
function statusOf(r){const p=counts(r).pct;return p===100?'done':p>0?'started':'empty'}
function cleanRows(a){return a.filter(r=>!/^SI[EÈ]GE\b/i.test(String(r.gristHelper_Display||'').trim())&&!/^DNGU\b/i.test(String(r.gristHelper_Display||'').trim()))}
function scopeInfo(a){const u=[...new Set(a.map(r=>r.gristHelper_Display2).filter(Boolean))],s=[...new Set(a.map(r=>r.gristHelper_Display).filter(Boolean))];if(u.length>1)return{kind:'national',label:'🌐 Vue nationale · DNGU'};if(s.length>1)return{kind:'regional',label:'🏢 Vue UGECAM · '+(u[0]||'')};return{kind:'site',label:'📍 Vue site · '+(s[0]||'')}}
function cls(p){return p>=75?'good':p>=40?'mid':'low'}
function fmt(v){if(empty(v))return'—';const n=Number(v),d=Number.isFinite(n)?new Date(n*1000):new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}

/* PILOTAGE */
const P={rows:[],q:'',ugecam:'',status:'',lastSync:null};
function pFiltered(){const q=P.q.trim().toLowerCase();return P.rows.filter(r=>(!q||[r.gristHelper_Display,r.gristHelper_Display2].join(' ').toLowerCase().includes(q))&&(!P.ugecam||r.gristHelper_Display2===P.ugecam)&&(!P.status||statusOf(r)===P.status)).sort((a,b)=>counts(b).pct-counts(a).pct)}
function renderPilotage(){const all=P.rows,shown=pFiltered(),ug=[...new Set(all.map(r=>r.gristHelper_Display2).filter(Boolean))].sort(),avg=all.length?Math.round(all.reduce((s,r)=>s+counts(r).pct,0)/all.length):0,done=all.filter(r=>statusOf(r)==='done').length,started=all.filter(r=>statusOf(r)==='started').length,emptyN=all.filter(r=>statusOf(r)==='empty').length;app.innerHTML=`<div class="kpis"><div class="kpi"><div class="lab">Sites</div><div class="val">${all.length}</div></div><div class="kpi"><div class="lab">Non démarrés</div><div class="val">${emptyN}</div></div><div class="kpi"><div class="lab">En cours</div><div class="val">${started}</div></div><div class="kpi"><div class="lab">Terminés</div><div class="val">${done}</div></div><div class="kpi"><div class="lab">Progression moyenne</div><div class="val">${avg}%</div></div></div><section class="card"><div class="head"><div><div class="title">Pilotage Autodiagnostic 2026</div><div class="sub">${CONFIG.sections.reduce((n,s)=>n+s.questions.length,0)} questions · les précisions et notes ne comptent pas dans la progression${P.lastSync?' · actualisé '+P.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</div></div><div class="tools"><input id="pq" placeholder="Rechercher un site…" value="${esc(P.q)}"><select id="pu"><option value="">Toutes UGECAM</option>${ug.map(x=>`<option ${x===P.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="ps"><option value="">Tous états</option><option value="empty" ${P.status==='empty'?'selected':''}>Non démarrés</option><option value="started" ${P.status==='started'?'selected':''}>En cours</option><option value="done" ${P.status==='done'?'selected':''}>Terminés</option></select><button id="pr">Actualiser</button></div></div><div class="tableWrap"><table style="min-width:1450px"><thead><tr><th>UGECAM</th><th>Site</th><th>Global</th>${CONFIG.sections.map(s=>`<th>${esc(s.title)}</th>`).join('')}<th>Dernière MAJ</th><th>Par</th></tr></thead><tbody>${shown.map(r=>{const p=counts(r);return`<tr><td>${esc(r.gristHelper_Display2||'')}</td><td class="site">${esc(r.gristHelper_Display||'')}</td><td><div class="mini"><div class="bar" style="min-width:85px"><div class="fill" style="width:${p.pct}%"></div></div><span class="pct">${p.done}/${p.total} · ${p.pct}%</span></div></td>${CONFIG.sections.map(s=>{const x=counts(r,s);return`<td><span class="chip ${cls(x.pct)}">${x.done}/${x.total} · ${x.pct}%</span></td>`}).join('')}<td>${esc(fmt(r.Derniere_mise_a_jour))}</td><td>${esc(r.Derniere_mise_a_jour_par||'—')}</td></tr>`}).join('')}</tbody></table></div></section>`;document.getElementById('pq').oninput=e=>{P.q=e.target.value;renderPilotage()};document.getElementById('pu').onchange=e=>{P.ugecam=e.target.value;renderPilotage()};document.getElementById('ps').onchange=e=>{P.status=e.target.value;renderPilotage()};document.getElementById('pr').onclick=refreshPilotage}
async function refreshPilotage(){P.rows=cleanRows(await ft('Autodiagnostic'));P.lastSync=new Date();renderPilotage()}

/* DETAIL */
const D={rows:[],section:0,ugecam:'',site:'',status:'',search:'',question:'',answerFilter:{},tableSearch:{}};
function dBase(){const q=D.search.trim().toLowerCase();return D.rows.filter(r=>(!D.ugecam||r.gristHelper_Display2===D.ugecam)&&(!D.site||r.gristHelper_Display===D.site)&&(!D.status||statusOf(r)===D.status)&&(!q||[r.gristHelper_Display,r.gristHelper_Display2].join(' ').toLowerCase().includes(q)))}
function avgPct(a,sec=null){if(!a.length)return 0;return Math.round(a.reduce((s,r)=>s+counts(r,sec).pct,0)/a.length)}
function precisionCol(q){return q.fields.find(f=>f.col.endsWith('_Precisions'))?.col||null}
function answerText(r,q){if(q.kind==='priority3')return q.fields.slice(0,3).map((f,i)=>r[f.col]?((i+1)+'. '+r[f.col]):'').filter(Boolean).join(' | ');if(q.kind==='multichoice')return listVals(r[q.fields[0].col]).join(' ; ');return r[q.fields[0].col]??''}
function respondentRows(a,q){const pc=precisionCol(q),af=D.answerFilter[q.id]||'',term=(D.tableSearch[q.id]||'').toLowerCase();return a.map(r=>({u:r.gristHelper_Display2||'',s:r.gristHelper_Display||'',a:answerText(r,q),p:pc?(r[pc]||''):''})).filter(x=>(!af||String(x.a)===af)&&(!term||[x.u,x.s,x.a,x.p].join(' ').toLowerCase().includes(term))).filter(x=>!empty(x.a)||!empty(x.p))}
function tableHtml(a,q){const rr=respondentRows(a,q);return`<div><input class="searchMini" data-ts="${esc(q.id)}" placeholder="Rechercher dans les répondants…" value="${esc(D.tableSearch[q.id]||'')}"><div class="answerTable"><table><thead><tr><th>UGECAM</th><th>Site</th><th>Réponse</th><th>Précision / commentaire</th></tr></thead><tbody>${rr.length?rr.map(x=>`<tr><td>${esc(x.u)}</td><td class="site">${esc(x.s)}</td><td><span class="pill">${esc(x.a||'—')}</span></td><td class="prec">${esc(x.p||'')}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">Aucun répondant pour ce filtre.</td></tr>'}</tbody></table></div></div>`}
function choiceChart(a,q){const col=q.fields[0].col,get=r=>q.kind==='multichoice'?listVals(r[col]):(empty(r[col])?[]:[String(r[col])]),total=a.filter(r=>get(r).length).length,den=Math.max(1,total);const items=q.choices.map(ch=>({ch,n:a.filter(r=>get(r).includes(String(ch))).length}));const af=D.answerFilter[q.id]||'';return`<div class="chartBox"><div class="chartTitle">${q.kind==='multichoice'?'Fréquence des choix':'Répartition des réponses'}</div><div class="bars">${items.map(x=>{const p=Math.round(x.n/den*100);return`<div class="barRow"><button class="barBtn ${af===x.ch?'sel':''}" data-af-q="${esc(q.id)}" data-af-v="${esc(x.ch)}">${esc(x.ch)}</button><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="barNum">${x.n} · ${p}%</div></div>`}).join('')}<div class="barRow"><button class="barBtn ${af===''?'sel':''}" data-af-q="${esc(q.id)}" data-af-v="">Toutes</button><div></div><div class="barNum">${total}/${a.length}</div></div></div></div>`}
function priorityChart(a,q){const score={};for(const o of q.options)score[o]={pts:0,c1:0,c2:0,c3:0};for(const r of a){q.fields.slice(0,3).forEach((f,i)=>{const v=r[f.col];if(!empty(v)){if(!score[v])score[v]={pts:0,c1:0,c2:0,c3:0};score[v].pts+=3-i;score[v]['c'+(i+1)]++}})}const ranked=Object.entries(score).sort((x,y)=>y[1].pts-x[1].pts),max=Math.max(1,...ranked.map(x=>x[1].pts));return`<div class="chartBox"><div class="chartTitle">Classement pondéré · choix 1 = 3 pts, choix 2 = 2 pts, choix 3 = 1 pt</div><div class="rank">${ranked.map(([lab,x],i)=>`<div class="rankRow"><div class="rankPos">${i+1}</div><div><div class="rankLabel">${esc(lab)}</div><div class="bar" style="margin-top:4px"><div class="fill" style="width:${Math.round(x.pts/max*100)}%"></div></div><div class="sub">Choix 1: ${x.c1} · Choix 2: ${x.c2} · Choix 3: ${x.c3}</div></div><div class="rankPts">${x.pts} pts</div></div>`).join('')}</div></div>`}
function questionHtml(a,q){const n=a.filter(r=>answered(r,q)).length;let left;if(q.kind==='choice'||q.kind==='multichoice')left=choiceChart(a,q);else if(q.kind==='priority3')left=priorityChart(a,q);else left=`<div class="chartBox"><div class="chartTitle">Question ouverte</div><div class="val">${n}</div><div class="sub">réponse${n>1?'s':''} textuelle${n>1?'s':''} sur ${a.length} site${a.length>1?'s':''}</div></div>`;return`<section class="qcard" data-qid="${esc(q.id)}"><div class="qHead"><div class="qid">${esc(q.id)}</div><div class="qtext">${esc(q.question)}</div><div class="qmeta">${n}/${a.length} site${a.length>1?'s':''} répondant${n>1?'s':''}</div></div><div class="qbody"><div class="chartGrid">${left}${tableHtml(a,q)}</div></div></section>`}
function renderDetail(){const visible=D.rows,a=dBase(),scope=scopeInfo(visible),ug=[...new Set(visible.map(r=>r.gristHelper_Display2).filter(Boolean))].sort(),sites=[...new Set(visible.filter(r=>!D.ugecam||r.gristHelper_Display2===D.ugecam).map(r=>r.gristHelper_Display).filter(Boolean))].sort(),sec=CONFIG.sections[D.section],done=a.filter(r=>statusOf(r)==='done').length,started=a.filter(r=>statusOf(r)==='started').length,bp=avgPct(a,sec),questionOptions=CONFIG.sections.map((s,si)=>`<optgroup label="${esc(s.title)}">${s.questions.map(q=>`<option value="${esc(q.id)}" ${D.question===q.id?'selected':''}>${esc(q.id+' — '+q.question)}</option>`).join('')}</optgroup>`).join('');app.innerHTML=`<header class="top"><div class="topRow"><div><div class="bigTitle">📈 Détail des réponses</div><div class="sub">Graphiques question par question et tableau synchronisé des répondants.</div><div class="scope">${esc(scope.label)}</div></div><div class="filters">${scope.kind==='national'?'<select id="du"><option value="">Toutes les UGECAM</option>'+ug.map(x=>`<option ${x===D.ugecam?'selected':''}>${esc(x)}</option>`).join('')+'</select>':''}${scope.kind!=='site'?'<select id="ds"><option value="">Tous les sites</option>'+sites.map(x=>`<option ${x===D.site?'selected':''}>${esc(x)}</option>`).join('')+'</select>':''}<select id="dst"><option value="">Tous états</option><option value="empty" ${D.status==='empty'?'selected':''}>Non démarrés</option><option value="started" ${D.status==='started'?'selected':''}>En cours</option><option value="done" ${D.status==='done'?'selected':''}>Terminés</option></select><select id="dquestion" title="Aller directement à une question"><option value="">Toutes les questions…</option>${questionOptions}</select><input id="dq" placeholder="Rechercher un site…" value="${esc(D.search)}"><button id="dr">Actualiser</button></div></div></header><div class="detailKpis"><div class="detailKpi"><div class="lab">Sites analysés</div><div class="n">${a.length}</div></div><div class="detailKpi"><div class="lab">Complétion globale</div><div class="n">${avgPct(a)}%</div></div><div class="detailKpi"><div class="lab">Terminés</div><div class="n">${done}</div></div><div class="detailKpi"><div class="lab">En cours</div><div class="n">${started}</div></div></div><div class="shell"><aside class="side"><div class="sideHead"><div class="sideTitle">Blocs du questionnaire</div><div class="sideSub">Sélectionnez un bloc pour afficher ses questions.</div></div><div class="nav">${CONFIG.sections.map((s,i)=>`<button class="navBtn ${i===D.section?'active':''}" data-sec="${i}"><span class="navName">${esc(s.title)}</span><span class="navPct">${avgPct(a,s)}%</span></button>`).join('')}</div></aside><main class="main"><section class="blockHero"><div class="blockTop"><div><div class="blockTitle">${esc(sec.title)}</div><div class="blockMeta">${sec.questions.length} question${sec.questions.length>1?'s':''} · ${a.length} site${a.length>1?'s':''}</div></div><div class="blockPct">${bp}%</div></div><div class="bar" style="margin-top:10px"><div class="fill" style="width:${bp}%"></div></div></section>${a.length?sec.questions.map(q=>questionHtml(a,q)).join(''):'<div class="panel" style="padding:24px;text-align:center;color:var(--muted)">Aucun site dans le filtre courant.</div>'}</main></div>`;bindDetail()}
function bindDetail(){document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{D.section=Number(b.dataset.sec);D.question='';window.scrollTo({top:0,behavior:'smooth'});renderDetail()});document.querySelectorAll('[data-af-q]').forEach(b=>b.onclick=()=>{D.answerFilter[b.dataset.afQ]=b.dataset.afV;renderDetail()});document.querySelectorAll('[data-ts]').forEach(i=>i.oninput=e=>{D.tableSearch[i.dataset.ts]=e.target.value;renderDetail()});document.getElementById('du')?.addEventListener('change',e=>{D.ugecam=e.target.value;D.site='';renderDetail()});document.getElementById('ds')?.addEventListener('change',e=>{D.site=e.target.value;renderDetail()});document.getElementById('dst')?.addEventListener('change',e=>{D.status=e.target.value;renderDetail()});document.getElementById('dquestion')?.addEventListener('change',e=>{const qid=e.target.value;if(!qid){D.question='';return}const si=CONFIG.sections.findIndex(s=>s.questions.some(q=>q.id===qid));if(si<0)return;D.section=si;D.question=qid;renderDetail();setTimeout(()=>{const el=[...document.querySelectorAll('[data-qid]')].find(x=>x.dataset.qid===qid);el?.scrollIntoView({behavior:'smooth',block:'start'})},50)});document.getElementById('dq')?.addEventListener('input',e=>{D.search=e.target.value;renderDetail()});document.getElementById('dr')?.addEventListener('click',refreshDetail)}
async function refreshDetail(){D.rows=cleanRows(await ft('Autodiagnostic'));renderDetail()}

(async()=>{try{await grist.ready({requiredAccess:'full'});CONFIG=await loadConfig();if(mode==='detail'){await refreshDetail()}else{await refreshPilotage();setInterval(refreshPilotage,20000)}}catch(e){app.innerHTML='<div class="error">'+esc(e?.message||e)+'</div>'}})();
</script></body></html>
