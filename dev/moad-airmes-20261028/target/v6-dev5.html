<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sites et ESMS — DEV</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><script src="finess-core-v1-dev.js"></script><script src="finess-ui-v2-dev.js"></script><style>
:root{font:14px system-ui;color:#172b40;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.env{background:#fff1cc;color:#835408;padding:6px 10px;border-radius:8px;font-weight:700;font-size:11px}h1{font-size:24px;margin:0}h2{margin:6px 0 18px;font-size:26px}h3{font-size:15px}small,.muted{color:#61768a}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px}nav,article,.card{background:white;border:1px solid #dde6ef;border-radius:14px}nav{padding:16px;max-height:calc(100vh - 100px);overflow:auto;position:sticky;top:12px}article{padding:28px}input{width:100%;border:1px solid #cbd8e4;border-radius:8px;padding:10px;margin:12px 0}button{font:inherit;cursor:pointer}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:7px 9px;border-radius:6px;color:#29455d}nav button.active,nav button:hover{background:#e8f1ff;color:#1856a8}details{margin:6px 0}summary{cursor:pointer;font-weight:700;padding:6px 0}.site{margin-left:8px;border-left:1px solid #e3eaf1;padding-left:8px}.entity{margin-left:18px;font-size:12px!important}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{padding:16px}.card button{font-weight:700;background:transparent;color:#155e9c;border:0;padding:0;text-align:left}.card p{font-size:12px;line-height:1.6;margin-bottom:0}.direction{padding:16px;background:#f0f6ff;border-radius:10px;margin:20px 0;white-space:pre-line}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#3175ad;font-weight:700}.error{background:#fff4f1;color:#9a3412;padding:20px}.back{background:white;border:1px solid #ccd9e5;border-radius:7px;padding:8px 12px;margin-bottom:18px}#status{font-size:12px;color:#64748b}#status:empty{display:none}@media(max-width:750px){.layout{grid-template-columns:1fr}nav{position:static;max-height:380px}article{padding:18px}}
.ugecam-banner{background:#f5f9ff;border:1px solid #d5e4f7;border-radius:12px;padding:18px;margin:0 0 24px}.ugecam-banner h3{font-size:19px;margin:5px 0 14px}.ugecam-roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.ugecam-roles>div{background:white;border:1px solid #e1eaf4;border-radius:8px;padding:12px}.ugecam-roles span{display:block;font-size:10px;color:#61768a;text-transform:uppercase;margin-bottom:7px}.ugecam-roles strong{white-space:pre-line;font-size:13px;overflow-wrap:anywhere}.location{margin-top:26px;border-top:1px solid #dae4ee;padding-top:8px}.location-item{border:1px solid #dbe5ef;border-radius:10px;margin:12px 0;overflow:hidden}.location-item p,.location-item a{margin:12px;display:block}.location iframe{display:block;width:100%;height:270px;border:0;margin-top:12px}@media(max-width:1150px){.ugecam-roles{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.ugecam-roles{grid-template-columns:1fr}}
.direction{white-space:normal}.direction h3{margin-top:0}.direction-contact{display:grid;grid-template-columns:minmax(150px,1fr) minmax(170px,1.2fr) minmax(120px,.7fr);gap:12px;padding:12px 0;border-top:1px solid #d8e5f5;align-items:start}.direction-contact small{display:block;margin-top:4px}.direction-contact a{color:#175f9e;overflow-wrap:anywhere;text-decoration:none}@media(max-width:950px){.direction-contact{grid-template-columns:1fr}}
.direction-contact{grid-template-columns:46px minmax(0,1fr);background:white;border:1px solid #dce6f1;border-radius:12px;padding:16px;margin-top:10px;box-shadow:0 2px 8px #1f416307}.direction-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e5effc;color:#245c98;font-weight:750}.direction-name{font-weight:750;font-size:15px}.direction-role{font-size:11px;color:#62788d;margin-top:4px}.direction-methods{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:13px}.direction-methods>div{background:#f7fafd;border-radius:8px;padding:9px 11px}.method-label{display:block;color:#60768d;font-size:10px;text-transform:uppercase;letter-spacing:.045em;margin-bottom:5px}.direction-methods a{font-size:12px;font-weight:600}.legal-codes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 15px}.legal-codes>span{font-size:10px;color:#61788d}.legal-codes code{font:11px ui-monospace,monospace;padding:4px 8px;border-radius:6px;border:1px solid #d9e5f3;background:white;color:#3e5e7b}.finess-list{display:inline-flex;flex-wrap:wrap;gap:5px}.origin-note{padding:10px;border-radius:8px;background:#fff5db;font-size:11px;color:#795d25}.unlinked{border-top:1px solid #dbe5ee;padding-top:9px;margin-top:12px}@media(max-width:750px){.direction-methods{grid-template-columns:1fr}.direction-contact{grid-template-columns:36px minmax(0,1fr);gap:9px;padding:12px}.direction-avatar{width:34px;height:34px}}
.device-tag{display:inline-block;background:#e9f4f2;color:#14655b;padding:5px 9px;border-radius:6px;font-size:12px}.site-devices{margin:18px 0;padding:14px;background:#f0f8f6;border-radius:10px}</style><script src="public-data-ui-v1-dev.js"></script></head><body><header><div><h1>Sites & ESMS / services</h1><small>Référentiel Airmes · UGECAM → Site → ESMS</small></div><span class="env">DEV · Recette requise</span></header><p id="status" role="status"></p><div class="layout"><nav><b>Arborescence</b><input id="search" aria-label="Rechercher un site ou un ESMS" placeholder="Site, ESMS, FINESS…"><div id="tree">Chargement…</div></nav><article id="detail">Sélectionnez un site dans l’arborescence.</article></div><script>
const S={u:[],s:[],e:[],site:0,entity:0,query:'',busy:false,contacts:[],finess:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows=d=>Array.isArray(d)?d:(d.id||[]).map((id,i)=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v[i]])));
const ft=async t=>rows(await grist.docApi.fetchTable(t));
const by=(a,id)=>a.find(r=>+r.id===+id);
const services=id=>S.e.filter(e=>+e.SITE===+id).sort((a,b)=>a.RAISON_SOCIALE.localeCompare(b.RAISON_SOCIALE,'fr'));
function matches(s){const q=S.query.toLocaleLowerCase('fr');return !q||[s.NOM,by(S.u,s.UGECAM)?.UGECAM,...services(s.id).flatMap(e=>[e.RAISON_SOCIALE,...histNames(e),...finCodes(e),e.TYPOLOGIE,e.SECTEUR,e.DISPOSITIF])].join(' ').toLocaleLowerCase('fr').includes(q)}
function tree(){const ss=S.s.filter(matches),q=S.query.trim().toLocaleLowerCase('fr'),unlinked=S.e.filter(e=>!Number(e.SITE)&&(!q||[e.RAISON_SOCIALE,...histNames(e),...finCodes(e),by(S.u,e.UGECAM)?.UGECAM].join(' ').toLocaleLowerCase('fr').includes(q)));document.getElementById('tree').innerHTML=S.u.map(u=>{const a=ss.filter(s=>+s.UGECAM===+u.id);if(!a.length)return'';return `<details open><summary>${esc(u.UGECAM)} <small>(${a.length})</small></summary>${a.map(s=>`<div class="site"><button data-site="${s.id}" class="${S.site===s.id&&!S.entity?'active':''}">${esc(s.NOM)}</button>${services(s.id).map(e=>`<button class="entity ${S.entity===e.id?'active':''}" data-esms="${e.id}">${esc(e.RAISON_SOCIALE)}</button>`).join('')}</div>`).join('')}</details>`}).join('')+(unlinked.length?`<details open class="unlinked"><summary>Établissements à rapprocher (${unlinked.length})</summary>${unlinked.map(e=>`<button class="entity ${S.entity===e.id?'active':''}" data-esms="${e.id}">${esc(e.RAISON_SOCIALE)}<br><small>${esc(by(S.u,e.UGECAM)?.UGECAM||'UGECAM à préciser')}</small></button>`).join('')}</details>`:'');if(!document.getElementById('tree').innerHTML)document.getElementById('tree').textContent='Aucun résultat.';document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{S.site=+b.dataset.site;S.entity=0;tree();detail()});document.querySelectorAll('[data-esms]').forEach(b=>b.onclick=()=>{S.entity=+b.dataset.esms;S.site=+by(S.e,S.entity).SITE;tree();detail()})}
function histNames(e){return Array.isArray(e.APPELLATIONS_HISTORIQUES)?e.APPELLATIONS_HISTORIQUES.filter(x=>x!=='L'):[]}
function finCodes(e){let raw=e.FINESS_CODES||e.FINESS_HISTORIQUES||[];if(typeof raw==='string'){try{raw=JSON.parse(raw)}catch{raw=[]}}if(!Array.isArray(raw))raw=[];return [...new Set([...raw.filter(x=>x!=='L'),e.FINESS_NORMALISE||MoadFiness.norm(e.FINESS)].map(MoadFiness.norm).filter(Boolean))]}
function legalCodes(u){const v=u?.FINESS_JURIDIQUES;return Array.isArray(v)?v.filter(x=>x!=='L'&&MoadFiness.norm(x)):MoadFiness.legalKeys(u?.FINESS_Juridique)}

function card(e){return `<section class="card"><button data-open="${e.id}">${esc(e.RAISON_SOCIALE)}</button><p>${e.DISPOSITIF?'<span class="device-tag">'+esc(e.DISPOSITIF)+'</span><br>':''}${e.SECTEUR?esc(e.SECTEUR)+'<br>':''}${esc(e.TYPOLOGIE||'Typologie non renseignée')}<br>FINESS${finCodes(e).length>1?' associés':''} : <span class="finess-list">${finCodes(e).length?finCodes(e).map(MoadFinessUI.trigger).join(' '):'Non renseigné'}</span>${e.ADRESSE?'<br>'+esc(e.ADRESSE):''}</p></section>`}
function ugecamBanner(u){
const roles=[['DG_NOMS','Direction générale',53],['RESP_MS_NOMS','Responsable médico-social',47],['RSI_NOMS','Responsable service informatique',49],['QUALITE_NOMS','Responsable qualité',48]];
return `<section class="ugecam-banner" aria-label="Référents UGECAM"><div class="eyebrow">Fiche UGECAM</div><h3>${esc(u?.UGECAM||'UGECAM non renseignée')}</h3><div class="legal-codes"><span>FINESS juridique${legalCodes(u).length>1?'s':''}</span>${legalCodes(u).length?legalCodes(u).map(k=>`<code>${esc(k)}</code>`).join(''):'<small>Non renseigné</small>'}</div><div class="ugecam-roles">${roles.map(([field,label,id])=>{let name=typeof u?.[field]==='string'?u[field]:'';if(!name){const all=S.contacts.filter(c=>+c.UGECAM===+u?.id&&+c.FONCTION===id),siege=all.filter(c=>c.SIEGE===true||c.SIEGE===1);name=(siege.length?siege:all).map(c=>[c.PRENOM,c.NOM].filter(Boolean).join(' ').trim()).filter(Boolean).join('\n')}return `<div><span>${esc(label)}</span><strong>${esc(name||'Non renseigné ou non accessible')}</strong></div>`}).join('')}</div></section>`}
function locations(s,e){let locs=[];try{locs=JSON.parse(s.LOCALISATIONS_JSON||'[]')}catch{}const own=e&&((e.ADRESSE||'').trim()||(typeof e.Latitude==='number'&&typeof e.Longitude==='number'&&(e.Latitude||e.Longitude)));if(own)locs=[{adresse:e.ADRESSE||'',latitude:e.Latitude,longitude:e.Longitude}];return `<section class="location"><h3>Localisation${e&&!own?'s du site':''}</h3>${locs.length?locs.map(l=>{const lat=l.latitude,lon=l.longitude,valid=typeof lat==='number'&&typeof lon==='number'&&Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180&&(lat!==0||lon!==0);return `<div class="location-item">${l.adresse?`<p>${esc(l.adresse)}</p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.adresse)}">Ouvrir la carte ↗</a>`:''}${valid?`<iframe title="Carte de localisation" loading="lazy" referrerpolicy="no-referrer" src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-.025}%2C${lat-.018}%2C${lon+.025}%2C${lat+.018}&layer=mapnik&marker=${lat}%2C${lon}"></iframe>`:'<p class="muted">Coordonnées non disponibles.</p>'}</div>`}).join(''):'<p class="muted">Adresse et coordonnées non disponibles.</p>'}</section>`}
function directionPanel(site){if(!site.id)return '<section class="direction"><h3>Direction</h3><p class="muted">Le site doit être rapproché pour déterminer sa direction.</p></section>';let contacts=[];try{contacts=JSON.parse(site.DIRECTION_CONTACTS_JSON||'[]')}catch{}if(!contacts.length){const visible=S.contacts.filter(c=>[20,21,23].includes(+c.FONCTION)&&(+c.SITE_PRINCIPAL===+site.id||(Array.isArray(c.SITES_RESP_AIRMES)&&c.SITES_RESP_AIRMES.includes(+site.id))));contacts=visible.map(c=>({nom:[c.PRENOM,c.NOM].filter(Boolean).join(' ').trim(),email:c.EMAIL||'',telephone:c.TELEPHONE||'',fonction:''}))}if(!contacts.length&&typeof site.DIRECTION_NOMS==='string'&&site.DIRECTION_NOMS.trim())contacts=site.DIRECTION_NOMS.split('\n').map(nom=>({nom,email:'',telephone:''}));return `<section class="direction"><h3>Direction du site</h3>${contacts.length?contacts.map(c=>{const phone=String(c.telephone||'').trim(),dial=phone.replace(/[^+0-9]/g,''),initials=String(c.nom||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();return `<article class="direction-contact"><div class="direction-avatar" aria-hidden="true">${esc(initials||'D')}</div><div class="direction-info"><div class="direction-name">${esc(c.nom||'Nom non renseigné')}</div>${c.fonction?`<div class="direction-role">${esc(c.fonction)}</div>`:''}<div class="direction-methods"><div><span class="method-label">Email</span>${c.email?`<a href="mailto:${encodeURIComponent(c.email)}">${esc(c.email)}</a>`:'<small>Non renseigné</small>'}</div><div><span class="method-label">Téléphone</span>${dial?`<a href="tel:${esc(dial)}">${esc(phone)}</a>`:'<small>Non renseigné</small>'}</div></div></div></article>`}).join(''):'<p class="muted">Direction non renseignée ou non accessible à votre profil.</p>'}</section>`}

function siteDevices(s){const vv=[...new Set(services(s.id).map(e=>e.DISPOSITIF).filter(Boolean))];return vv.length?'<section class="site-devices"><h3>Dispositifs du site</h3><p>'+vv.map(esc).join(' · ')+'</p></section>':''}
function detail(){const el=document.getElementById('detail'),e=by(S.e,S.entity),s=by(S.s,e?e.SITE:S.site)||(e?{id:0,NOM:'Site à rapprocher',UGECAM:e.UGECAM,LOCALISATIONS_JSON:'[]'}:null);if(!s){el.textContent='Sélectionnez un site dans l’arborescence.';return}const u=by(S.u,s.UGECAM);el.innerHTML=ugecamBanner(u)+(e?`<button class="back" id="back">← Fiche du site</button>${e.DISPOSITIF?`<p class="device-tag">Dispositif : ${esc(e.DISPOSITIF)}</p>`:''}<div class="eyebrow">ESMS / service</div><h2>${esc(e.RAISON_SOCIALE)}</h2><p>${esc(u?.UGECAM)} · ${esc(s.NOM)}</p>${directionPanel(s)}<div class="cards">${card(e)}</div>${e.AIRMES_ID?`<p class="muted">Identifiant Airmes : ${esc(e.AIRMES_ID)}</p>`:`<p class="origin-note">${esc(e.STATUT_REPRISE_FINESS||'Établissement historique à rapprocher d’Airmes')}</p>`}`:`<div class="eyebrow">Fiche du site</div><h2>${esc(s.NOM)}</h2><p class="muted">${esc(u?.UGECAM)}</p>${directionPanel(s)}${siteDevices(s)}<h3>ESMS / services (${services(s.id).length})</h3><div class="cards">${services(s.id).map(card).join('')||'<p class="muted">Aucun ESMS/service accessible.</p>'}</div>`)+locations(s,e)+(e?MoadPublicUI.fromESMS(e):'');document.getElementById('back')?.addEventListener('click',()=>{S.entity=0;detail();tree()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.entity=+b.dataset.open;detail();tree()});MoadFinessUI.bind(el,id=>S.finess.find(r=>r.FINESS===id))}
async function refresh(){if(S.busy)return;S.busy=true;try{const [u,s,e,contacts,finess]=await Promise.all([ft('UGECAM'),ft('SITES'),ft('ESMS'),ft('CONTACTS').catch(()=>[]),ft('FINESS_CATALOGUE').catch(()=>[])]);Object.assign(S,{u,s,e,contacts,finess});if(!S.site&&!S.entity&&s.length)S.site=s[0].id;tree();detail();document.getElementById('status').textContent=''}catch(e){document.getElementById('status').textContent='Actualisation impossible : '+e.message}finally{S.busy=false}}
document.getElementById('search').oninput=e=>{S.query=e.target.value;tree()};
(async()=>{await grist.ready({requiredAccess:'full'});await refresh();grist.onRecords(()=>refresh());setInterval(refresh,15000)})();
</script></body></html>
