<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Événements MOAD V3</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:44px 22px;text-align:center;color:var(--muted)}.shell{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px}.sidebar{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:15px;border-bottom:1px solid var(--line)}.sideTitle{font-size:15px;font-weight:850}.sideSub{font-size:11.5px;color:var(--muted);margin-top:3px}.search{width:100%;margin-top:10px;border:1px solid #cbd5e1;border-radius:10px;padding:9px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:7px;font-size:11.5px}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.qbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:750;color:#475569}.qbtn.active{background:var(--blueSoft);border-color:#bfdbfe;color:#1d4ed8}.reset{margin-top:8px;width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;font-size:11.5px;font-weight:700;color:#475569}.listMeta{padding:8px 14px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between}.list{overflow:auto;padding:7px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:11px;padding:10px;color:var(--text)}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.itemName{font-size:12.5px;font-weight:820;line-height:1.35}.itemMeta{margin-top:3px;font-size:10.7px;color:var(--muted)}.status{display:inline-flex;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800}.up{background:var(--greenSoft);color:var(--green)}.past{background:#f1f5f9;color:#475569}.live{background:var(--amberSoft);color:var(--amber)}.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.kpiLabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:20px;font-weight:900;margin-top:2px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{font-size:clamp(21px,2.8vw,30px);line-height:1.12;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:7px}.chips,.tabs{display:flex;flex-wrap:wrap;gap:6px}.chips{margin-top:12px}.chip{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--blueSoft);color:#1d4ed8;font-size:11px;font-weight:750}.tabs{margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:750;color:#475569}.tab.active{background:var(--blueSoft);border-color:#bfdbfe;color:#1d4ed8}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:12px}.stack{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.cardHead{padding:13px 15px 7px;display:flex;justify-content:space-between;align-items:center}.cardTitle{font-size:13px;font-weight:850;color:#334155}.cardBody{padding:6px 15px 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px 11px}.field.full{grid-column:1/-1}.label{font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:4px}.value{font-size:12.5px;font-weight:650;white-space:pre-wrap}.markdown{font-size:12.5px;line-height:1.6}.markdown p{margin:.45em 0}.markdown ul{margin:.35em 0 .35em 1.4em;padding:0}.markdown strong{font-weight:850}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;gap:9px}.avatar{width:32px;height:32px;border-radius:9px;background:var(--blueSoft);color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;flex:0 0 auto}.personName{font-size:12.5px;font-weight:850}.muted{font-size:11.8px;color:var(--muted)}.metricGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{background:var(--soft);border:1px solid #edf2f7;border-radius:11px;padding:10px}.metricName{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.metricValue{font-size:18px;font-weight:900;margin-top:3px}.bar{height:7px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:#2563eb;border-radius:inherit}.footer{font-size:9.5px;color:#94a3b8;padding:7px 2px}@media(max-width:1100px){.shell{grid-template-columns:290px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){body{padding:7px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:430px}.grid,.people,.metricGrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"><div class="loading">Chargement…</div></main><script>const app=document.getElementById('app');const S={t:null,id:null,q:'',type:'',org:'',mode:'all',tab:'info'};const T={e:'EVENEMENTS_MOAD',c:'CONTACTS',v:'Evenements_Evaluation_interventions'};function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function list(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x))}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return list(p)}catch{}return[v]}return[v]}function refs(v){return list(v).map(Number).filter(x=>Number.isFinite(x)&&x>0)}function txt(v){return empty(v)?'':list(v).map(String).join(', ')}function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}function dObj(v){if(empty(v))return null;const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);return Number.isNaN(d.getTime())?null:d}function dt(v){const d=dObj(v);if(!d)return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw Error('API indisponible')}async function load(){const[e,c,v]=await Promise.all([ft(T.e),ft(T.c),ft(T.v)]);S.t={e,c,v}}function status(e){const n=new Date(),a=dObj(e.DEBUT_EVENEMENT),b=dObj(e.FIN_EVENEMENT)||a;if(a&&b&&n>=a&&n<=b)return['En cours','live'];if(a&&a>n)return['À venir','up'];return['Passé','past']}function evals(id){return S.t.v.filter(x=>Number(x.evenement_MOAD_evalue)===Number(id))}function md(v){let s=esc(v||'');s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^\* (.+)$/gm,'<li>$1</li>').replace(/(?:<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');return'<p>'+s+'</p>'}function filtered(){const q=S.q.toLowerCase().trim();return S.t.e.filter(e=>{const st=status(e)[0],h=[e.TITRE_EVENEMENT,e.DESCRIPTION_EVENEMENT,txt(e.TYPE_EVENEMENT),txt(e.ORGANISATEUR_EVENEMENT)].join(' ').toLowerCase();return(!q||h.includes(q))&&(!S.type||list(e.TYPE_EVENEMENT).map(String).includes(S.type))&&(!S.org||list(e.ORGANISATEUR_EVENEMENT).map(String).includes(S.org))&&(S.mode==='all'||(S.mode==='up'&&st==='À venir')||(S.mode==='live'&&st==='En cours')||(S.mode==='past'&&st==='Passé'))}).sort((a,b)=>(dObj(b.DEBUT_EVENEMENT)?.getTime()||0)-(dObj(a.DEBUT_EVENEMENT)?.getTime()||0))}function sidebar(){const all=S.t.e,types=[...new Set(all.flatMap(x=>list(x.TYPE_EVENEMENT).map(String)))].filter(Boolean).sort(),orgs=[...new Set(all.flatMap(x=>list(x.ORGANISATEUR_EVENEMENT).map(String)))].filter(Boolean).sort(),items=filtered();return`<aside class="sidebar"><div class="sideHead"><div class="sideTitle">Événements MOAD</div><div class="sideSub">Recherche et consultation</div><input id="q" class="search" placeholder="Titre, type, organisateur…" value="${esc(S.q)}"><div class="filters"><select id="type"><option value="">Tous les types</option>${types.map(x=>`<option ${x===S.type?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="org"><option value="">Tous organisateurs</option>${orgs.map(x=>`<option ${x===S.org?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="quick">${[['all','Tous'],['up','À venir'],['live','En cours'],['past','Passés']].map(x=>`<button class="qbtn ${S.mode===x[0]?'active':''}" data-mode="${x[0]}">${x[1]}</button>`).join('')}</div><button id="reset" class="reset">Réinitialiser</button></div><div class="listMeta"><span>${items.length} événements</span></div><div class="list">${items.map(e=>{const st=status(e),n=refs(e.inscrits).length;return`<button class="item ${Number(e.id)===Number(S.id)?'active':''}" data-id="${e.id}"><div class="itemName">${esc(e.TITRE_EVENEMENT||'Événement')}</div><div class="itemMeta">${esc(dt(e.DEBUT_EVENEMENT))}</div><div class="itemMeta">${esc(txt(e.TYPE_EVENEMENT))} · ${n} inscrit${n>1?'s':''} · <span class="status ${st[1]}">${st[0]}</span></div></button>`}).join('')}</div></aside>`}function field(l,v,full=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div></div>`}function person(c){const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact',i=((c.PRENOM||'').slice(0,1)+(c.NOM||'').slice(0,1)).toUpperCase()||'•';return`<div class="person"><div class="avatar">${esc(i)}</div><div><div class="personName">${esc(name)}</div><div class="muted">${esc(c.FONCTION||'')}</div>${c.EMAIL?`<a href="mailto:${esc(c.EMAIL)}" style="font-size:11px;color:#1d4ed8">${esc(c.EMAIL)}</a>`:''}</div></div>`}function score(v){const m=txt(v).match(/(\d+(?:[.,]\d+)?)/);return m?Number(m[1].replace(',','.')):null}function evalView(e){const a=evals(e.id);if(!a.length)return'<section class="card"><div class="cardBody"><div class="muted">Aucune évaluation reçue pour cet événement.</div></div></section>';const keys=[['Clarté','Clarete_des_objectifs'],['Interventions','Qualite_des_interventions'],['Supports','Supports_pedagogiques_PDF_slides_etc_'],['Interactivité','Interactivite_echanges_Q_R_'],['Utilité','Utilite_pour_votre_travail'],['Applicabilité','Applicabilite_des_connaissances'],['Note globale','Note_globale']];const metrics=keys.map(([l,k])=>{const v=a.map(x=>score(x[k])).filter(Number.isFinite);return[l,v.length?v.reduce((p,c)=>p+c,0)/v.length:null]}).filter(x=>x[1]!=null);return`<section class="card"><div class="cardHead"><div class="cardTitle">Synthèse des évaluations</div></div><div class="cardBody"><div class="metricGrid">${metrics.map(([l,v])=>`<div class="metric"><div class="metricName">${esc(l)}</div><div class="metricValue">${v.toFixed(1)}</div><div class="bar"><span style="width:${Math.min(100,v/5*100)}%"></span></div></div>`).join('')}</div></div></section>`}function detail(e){if(!e)return'<div class="error">Aucun événement sélectionné</div>';const st=status(e),ins=refs(e.inscrits),people=ins.map(id=>byId(S.t.c,id)).filter(Boolean),ev=evals(e.id),rate=ins.length?Math.round(ev.length/ins.length*100):0;return`<div class="detail"><div class="hero"><div class="eyebrow">Événement MOAD</div><h1>${esc(e.TITRE_EVENEMENT||'Événement')}</h1><div class="subtitle">${esc(dt(e.DEBUT_EVENEMENT))}</div><div class="chips"><span class="chip">${esc(txt(e.TYPE_EVENEMENT))}</span><span class="status ${st[1]}">${st[0]}</span></div></div><div class="tabs">${[['info','Informations'],['ins','Inscrits'],['eval','Évaluations']].map(x=>`<button class="tab ${S.tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div>${S.tab==='ins'?`<section class="card"><div class="cardHead"><div class="cardTitle">Inscrits (${people.length})</div></div><div class="cardBody">${people.length?`<div class="people">${people.map(person).join('')}</div>`:'<div class="muted">Aucun inscrit renseigné pour cet événement.</div>'}</div></section>`:S.tab==='eval'?evalView(e):`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Informations</div></div><div class="cardBody"><div class="grid">${field('Début',dt(e.DEBUT_EVENEMENT))}${field('Fin',dt(e.FIN_EVENEMENT))}${field('Type',txt(e.TYPE_EVENEMENT))}${field('Organisateur',txt(e.ORGANISATEUR_EVENEMENT))}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Description</div></div><div class="cardBody"><div class="markdown">${md(e.DESCRIPTION_EVENEMENT||'')}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Participation</div></div><div class="cardBody"><div class="metricGrid"><div class="metric"><div class="metricName">Inscrits</div><div class="metricValue">${ins.length}</div></div><div class="metric"><div class="metricName">Évaluations</div><div class="metricValue">${ev.length}</div></div><div class="metric"><div class="metricName">Taux réponse</div><div class="metricValue">${ins.length?rate+'%':'—'}</div></div></div>${!ins.length?'<div class="muted" style="margin-top:8px">Aucun inscrit n’est renseigné sur cet événement.</div>':''}</div></section></aside></div>`}<div class="footer">Événements MOAD V3</div></div>`}function render(){const all=S.t.e,ins=all.reduce((n,e)=>n+refs(e.inscrits).length,0),ev=S.t.v.length,rate=ins?Math.round(ev/ins*100):0,up=all.filter(e=>status(e)[0]==='À venir').length,live=all.filter(e=>status(e)[0]==='En cours').length;app.innerHTML=`<div class="shell">${sidebar()}<main><div class="kpis"><div class="kpi"><div class="kpiLabel">Total</div><div class="kpiValue">${all.length}</div></div><div class="kpi"><div class="kpiLabel">À venir</div><div class="kpiValue">${up}</div></div><div class="kpi"><div class="kpiLabel">Inscriptions</div><div class="kpiValue">${ins}</div></div><div class="kpi"><div class="kpiLabel">Évaluations</div><div class="kpiValue">${ev}</div></div><div class="kpi"><div class="kpiLabel">Taux réponse</div><div class="kpiValue">${ins?rate+'%':'—'}</div></div></div>${detail(byId(all,S.id)||all[0])}</main></div>`;bind()}function bind(){document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{S.id=Number(b.dataset.id);try{grist.setCursorPos({rowId:S.id})}catch{}render()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});document.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render()});const q=document.getElementById('q');q.oninput=()=>{S.q=q.value;render()};document.getElementById('type').onchange=e=>{S.type=e.target.value;render()};document.getElementById('org').onchange=e=>{S.org=e.target.value;render()};document.getElementById('reset').onclick=()=>{S.q='';S.type='';S.org='';S.mode='all';render()}}grist.ready({requiredAccess:'full'});load().then(()=>{S.id=S.t.e[0]?.id||null;render()}).catch(e=>app.innerHTML='<div class="error">'+esc(e.message)+'</div>');grist.onRecord(r=>{if(r?.id&&S.t){S.id=r.id;render()}});</script></body></html>
