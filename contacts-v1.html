<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacts — Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}.loading strong,.error strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px}.shell{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px}.sidebar{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:15px;border-bottom:1px solid var(--line)}.sideTitle{font-size:15px;font-weight:850}.sideSub{font-size:11.5px;color:var(--muted);margin-top:3px}.search{width:100%;margin-top:11px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;outline:0}.search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:7px;font-size:11.5px}.tools{display:flex;gap:7px;margin-top:7px}.ghost{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:11.5px;font-weight:700;color:#475569}.listMeta{padding:8px 14px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between}.list{overflow:auto;padding:7px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:11px;padding:9px 10px;color:var(--text)}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.itemName{font-size:12.5px;font-weight:820;line-height:1.35}.itemMeta{margin-top:3px;font-size:10.8px;color:var(--muted);line-height:1.35}.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.kpiLabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:20px;font-weight:900;margin-top:2px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{font-size:clamp(21px,2.8vw,32px);line-height:1.12;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:7px}.chips,.badges,.actions,.nav,.tabs{display:flex;flex-wrap:wrap;gap:6px}.chips{margin-top:12px}.chip,.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--blueSoft);color:var(--blue2);font-size:11px;font-weight:750}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.amber{background:var(--amberSoft);color:var(--amber)}.badge.gray{background:#f1f5f9;color:#475569}.actions{margin-top:13px}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#1e293b;border-radius:9px;padding:7px 10px;text-decoration:none;font-size:11.5px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.nav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:750}.tabs{margin:0 0 12px}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:750}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:12px;align-items:start}.stack{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.cardHead{padding:13px 15px 7px;display:flex;justify-content:space-between;align-items:center}.cardTitle{font-size:13px;font-weight:850;color:#334155}.count{font-size:10.5px;font-weight:850;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:3px 7px}.cardBody{padding:6px 15px 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px 11px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:4px}.value{font-size:12.5px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.value.soft{font-weight:500;line-height:1.45}.esmsCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.esmsCard{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.esmsName{font-size:12.5px;font-weight:850}.esmsMeta{font-size:10.8px;color:var(--muted);margin-top:3px}.timeline{display:flex;flex-direction:column}.event{display:grid;grid-template-columns:82px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #eef2f7}.event:last-child{border-bottom:0}.eventDate{font-size:10.5px;color:var(--muted);font-weight:750}.eventTitle{font-size:12px;font-weight:800}.eventDesc{font-size:11.5px;color:#475569;margin-top:2px;line-height:1.4;white-space:pre-wrap}.scoreGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.score{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:8px}.scoreLabel{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.scoreValue{font-size:12px;font-weight:800;margin-top:3px}.muted{font-size:11.8px;color:var(--muted)}.footer{font-size:9.5px;color:#94a3b8;padding:7px 2px}
@media(max-width:1100px){.shell{grid-template-columns:300px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){body{padding:7px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:430px}.esmsCards,.grid,.scoreGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.event{grid-template-columns:1fr;gap:2px}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main id="app"><div class="loading"><strong>Chargement des contacts…</strong>Connexion à Grist.</div></main>
<script>
const app=document.getElementById('app');
const state={tables:null,selectedId:null,query:'',ugecam:'',fonction:'',tab:'info'};
const T={contacts:'CONTACTS',esms:'ESMS_Liste_UGECAM_',ugecam:'UGECAM',sites:'SITES_nomenclature_UGECAM',interactions:'Interactions',evals:'Evenements_Evaluation_interventions',events:'EVENEMENTS_MOAD'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}
function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);if(!k.length)return[];const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function refList(v){if(empty(v))return[];if(typeof v==='number')return v?[v]:[];if(typeof v==='string'){try{return refList(JSON.parse(v))}catch{return[]}}if(!Array.isArray(v))return[];const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.map(Number).filter(x=>Number.isFinite(x)&&x>0)}
function bool(v){return v===true||v===1||v==='1'||v==='True'||v==='TRUE'||(Array.isArray(v)&&v.length===2&&v[0]==='B'&&Boolean(v[1]))}
function listText(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).map(String)}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return listText(p)}catch{}return[v]}return[String(v)]}
function txt(v){if(empty(v))return'';if(typeof v==='string'||typeof v==='number')return String(v);if(Array.isArray(v))return listText(v).join(', ');return String(v)}
function dt(v){if(empty(v))return'';const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);if(Number.isNaN(d.getTime()))return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}
function field(l,v,full=false,soft=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value ${soft?'soft':''}">${esc(v)}</div></div>`}
function chip(v){return empty(v)?'':`<span class="chip">${esc(v)}</span>`}
function badge(v,c='gray'){return`<span class="badge ${c}">${esc(v)}</span>`}
async function fetchTable(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}
async function load(){const [contacts,esms,ugecam,sites,interactions,evals,events]=await Promise.all([fetchTable(T.contacts),fetchTable(T.esms),fetchTable(T.ugecam),fetchTable(T.sites),fetchTable(T.interactions),fetchTable(T.evals),fetchTable(T.events)]);state.tables={contacts,esms,ugecam,sites,interactions,evals,events}}
function contactName(c){return [txt(c.PRENOM),txt(c.NOM)].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact'}
function ugecamName(c){return txt(byId(state.tables.ugecam,c.UGECAM)?.UGECAM)}
function siteName(c){return txt(byId(state.tables.sites,c.SITES_nomenclature_UGECAM)?.SITES_nomenclature_UGECAM)}
function linkedEsms(c){const ids=refList(c.ESMS_Liste_UGECAM_);if(ids.length)return ids.map(id=>byId(state.tables.esms,id)).filter(Boolean);return state.tables.esms.filter(e=>refList(e.CONTACTS).includes(Number(c.id)))}
function interactionsFor(c){return state.tables.interactions.filter(r=>refList(r.CONTACT).includes(Number(c.id))).sort((a,b)=>Number(b.DATE_INTERACTION||0)-Number(a.DATE_INTERACTION||0))}
function evalsFor(c){return state.tables.evals.filter(r=>Number(r.mail)===Number(c.id)).sort((a,b)=>Number(b.Enregistrement||b.Cree_le||0)-Number(a.Enregistrement||a.Cree_le||0))}
function filtered(){const q=state.query.trim().toLowerCase();return state.tables.contacts.filter(c=>{const u=ugecamName(c),f=txt(c.FONCTION),e=linkedEsms(c).map(x=>txt(x.ESMS_raison_sociale)).join(' ');const qok=!q||[contactName(c),f,txt(c.EMAIL),u,siteName(c),e].join(' ').toLowerCase().includes(q);return qok&&(!state.ugecam||u===state.ugecam)&&(!state.fonction||f===state.fonction)}).sort((a,b)=>contactName(a).localeCompare(contactName(b),'fr'))}
function sidebar(){const ugecams=[...new Set(state.tables.contacts.map(ugecamName).filter(Boolean))].sort();const fonctions=[...new Set(state.tables.contacts.map(c=>txt(c.FONCTION)).filter(Boolean))].sort();const items=filtered();return `<aside class="sidebar"><div class="sideHead"><div class="sideTitle">Contacts</div><div class="sideSub">Recherche et sélection</div><input id="q" class="search" placeholder="Nom, email, fonction, ESMS…" value="${esc(state.query)}"><div class="filters"><select id="u"><option value="">Toutes les UGECAM</option>${ugecams.map(x=>`<option ${x===state.ugecam?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="f"><option value="">Toutes les fonctions</option>${fonctions.map(x=>`<option ${x===state.fonction?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="tools"><button id="reset" class="ghost">Réinitialiser</button></div></div><div class="listMeta"><span>${items.length} contact${items.length>1?'s':''}</span><span>${state.selectedId?'1 sélectionné':'—'}</span></div><div class="list">${items.map(c=>`<button class="item ${Number(c.id)===Number(state.selectedId)?'active':''}" data-id="${c.id}"><div class="itemName">${esc(contactName(c))}</div><div class="itemMeta">${esc([txt(c.FONCTION),ugecamName(c)].filter(Boolean).join(' • '))}</div></button>`).join('')}</div></aside>`}
function badgesFor(c){const b=[];if(bool(c.Referent_DUI))b.push(badge('Référent DUI','green'));if(bool(c.ACCES))b.push(badge('Accès','green'));if(bool(c.Invite_aux_comites))b.push(badge('Invité comités','amber'));if(bool(c.ENFANCE_SERVICES))b.push(badge('Enfance / services'));if(bool(c.READAPT_PROF))b.push(badge('Réadaptation pro'));if(bool(c.MEDICALISE))b.push(badge('Médicalisé'));if(bool(c.SIEGE))b.push(badge('Siège'));if(bool(c.CAMSP_CMPP))b.push(badge('CAMSP / CMPP'));return b.join('')}
function esmsCard(e){const site=txt(byId(state.tables.sites,e.SITES_nomenclature_UGECAM)?.SITES_nomenclature_UGECAM);return `<div class="esmsCard"><div class="esmsName">${esc(txt(e.ESMS_raison_sociale)||'ESMS')}</div><div class="esmsMeta">${esc([site,txt(e.FINESS)].filter(Boolean).join(' • FINESS '))}</div></div>`}
function interactionHtml(r){const title=[listText(r.TYPE).join(' • '),txt(r.Theme)].filter(Boolean).join(' — ')||'Interaction';return `<div class="event"><div class="eventDate">${esc(dt(r.DATE_INTERACTION)||'Date inconnue')}</div><div><div class="eventTitle">${esc(title)}</div>${r.DESCRIPTION?`<div class="eventDesc">${esc(r.DESCRIPTION)}</div>`:''}</div></div>`}
function evalHtml(r){const evt=byId(state.tables.events,r.evenement_MOAD_evalue);const title=txt(evt?.TITRE_EVENEMENT)||'Évaluation';const dateEvt=dt(evt?.DEBUT_EVENEMENT);const scores=[['Objectifs',r.Clarete_des_objectifs],['Interventions',r.Qualite_des_interventions],['Visio',r.Adaptation_au_format_visio],['Supports',r.Supports_pedagogiques_PDF_slides_etc_],['Interactivité',r.Interactivite_echanges_Q_R_],['Rythme',r.Duree_et_rythme_de_la_formation],['Utilité',r.Utilite_pour_votre_travail],['Note globale',r.Note_globale]].filter(x=>!empty(x[1]));return `<div class="card" style="box-shadow:none;margin-bottom:8px"><div class="cardHead"><div class="cardTitle">${esc(title)}</div><div class="count">${esc(dateEvt||'')}</div></div><div class="cardBody">${scores.length?`<div class="scoreGrid">${scores.map(([l,v])=>`<div class="score"><div class="scoreLabel">${esc(l)}</div><div class="scoreValue">${esc(txt(v))}</div></div>`).join('')}</div>`:''}${r.Suggestions_libres?`<div class="field full" style="margin-top:8px"><div class="label">Suggestions</div><div class="value soft">${esc(r.Suggestions_libres)}</div></div>`:''}</div></div>`}
function detail(c){if(!c)return '<div class="error"><strong>Aucun contact sélectionné</strong></div>';const esms=linkedEsms(c),ints=interactionsFor(c),ev=evalsFor(c);const email=txt(c.EMAIL),u=ugecamName(c),s=siteName(c),name=contactName(c);return `<section class="detail"><div class="kpis"><div class="kpi"><div class="kpiLabel">Contacts</div><div class="kpiValue">${state.tables.contacts.length}</div></div><div class="kpi"><div class="kpiLabel">ESMS associés</div><div class="kpiValue">${esms.length}</div></div><div class="kpi"><div class="kpiLabel">Interactions</div><div class="kpiValue">${ints.length}</div></div><div class="kpi"><div class="kpiLabel">Évaluations</div><div class="kpiValue">${ev.length}</div></div></div><div class="hero"><div class="heroTop"><div><div class="eyebrow">Fiche contact</div><h1>${esc(name)}</h1><div class="subtitle">${esc([txt(c.FONCTION),u,s].filter(Boolean).join(' • '))}</div><div class="chips">${badgesFor(c)}</div><div class="actions">${email?`<a class="btn primary" href="mailto:${esc(email)}">✉ Envoyer un mail</a>`:''}</div></div></div></div><div class="tabs"><button class="tab ${state.tab==='info'?'active':''}" data-tab="info">Informations</button><button class="tab ${state.tab==='esms'?'active':''}" data-tab="esms">ESMS associés (${esms.length})</button><button class="tab ${state.tab==='interactions'?'active':''}" data-tab="interactions">Interactions (${ints.length})</button><button class="tab ${state.tab==='evals'?'active':''}" data-tab="evals">Évaluations (${ev.length})</button></div>${state.tab==='info'?`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Informations générales</div></div><div class="cardBody"><div class="grid">${field('Nom',c.NOM)}${field('Prénom',c.PRENOM)}${field('Fonction',c.FONCTION)}${field('Email',email)}${field('UGECAM',u)}${field('Site',s)}${field('Créé le',dt(c.Cree_le))}${field('Créé par',c.Cree_par)}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Statuts</div></div><div class="cardBody"><div class="badges">${badgesFor(c)||'<span class="muted">Aucun statut particulier.</span>'}</div></div></section></aside></div>`:''}${state.tab==='esms'?`<section class="card"><div class="cardHead"><div class="cardTitle">Établissements associés</div><div class="count">${esms.length}</div></div><div class="cardBody">${esms.length?`<div class="esmsCards">${esms.map(esmsCard).join('')}</div>`:'<div class="muted">Aucun ESMS associé.</div>'}</div></section>`:''}${state.tab==='interactions'?`<section class="card"><div class="cardHead"><div class="cardTitle">Interactions</div><div class="count">${ints.length}</div></div><div class="cardBody">${ints.length?`<div class="timeline">${ints.map(interactionHtml).join('')}</div>`:'<div class="muted">Aucune interaction.</div>'}</div></section>`:''}${state.tab==='evals'?`<section class="card"><div class="cardHead"><div class="cardTitle">Évaluations d’événements</div><div class="count">${ev.length}</div></div><div class="cardBody">${ev.length?ev.map(evalHtml).join(''):'<div class="muted">Aucune évaluation.</div>'}</div></section>`:''}<div class="footer">Widget Contacts • données lues directement depuis Grist</div></section>`}
function render(){const c=byId(state.tables.contacts,state.selectedId)||state.tables.contacts[0];if(c&&!state.selectedId)state.selectedId=c.id;app.innerHTML=`<div class="shell">${sidebar()}${detail(c)}</div>`;bind()}
function bind(){document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{state.selectedId=Number(b.dataset.id);try{grist.setCursorPos?.({rowId:state.selectedId})}catch{}render()});document.getElementById('q').oninput=e=>{state.query=e.target.value;render()};document.getElementById('u').onchange=e=>{state.ugecam=e.target.value;render()};document.getElementById('f').onchange=e=>{state.fonction=e.target.value;render()};document.getElementById('reset').onclick=()=>{state.query='';state.ugecam='';state.fonction='';render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
async function boot(){try{await load();const first=state.tables.contacts[0];state.selectedId=first?.id||null;render()}catch(e){console.error(e);app.innerHTML=`<div class="error"><strong>Impossible de charger les contacts</strong>${esc(e?.message||e)}<br><br>Vérifie que le widget dispose de l’accès complet au document.</div>`}}
grist.ready({requiredAccess:'full'});grist.onRecord(r=>{if(r?.id&&state.tables){state.selectedId=r.id;render()}});boot();
</script></body></html>
