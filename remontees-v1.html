<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remontées — Grist</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}.loading strong,.error strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px}.shell{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px}.sidebar{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:15px;border-bottom:1px solid var(--line)}.sideTitle{font-size:15px;font-weight:850}.sideSub{font-size:11.5px;color:var(--muted);margin-top:3px}.search{width:100%;margin-top:11px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;outline:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:7px;font-size:11.5px}.tools{display:flex;gap:7px;margin-top:7px}.ghost{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:11.5px;font-weight:700;color:#475569}.listMeta{padding:8px 14px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between}.list{overflow:auto;padding:7px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:11px;padding:10px;color:var(--text)}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.itemTop{display:flex;justify-content:space-between;gap:8px}.itemName{font-size:12.5px;font-weight:820;line-height:1.35}.itemMeta{margin-top:3px;font-size:10.8px;color:var(--muted);line-height:1.35}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;background:#f1f5f9;color:#475569;white-space:nowrap}.pill.red{background:var(--redSoft);color:var(--red)}.pill.amber{background:var(--amberSoft);color:var(--amber)}.pill.green{background:var(--greenSoft);color:var(--green)}.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.kpiLabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:20px;font-weight:900;margin-top:2px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{font-size:clamp(21px,2.8vw,30px);line-height:1.12;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:7px}.chips,.actions,.tabs{display:flex;flex-wrap:wrap;gap:6px}.chips{margin-top:12px}.chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--blueSoft);color:#1d4ed8;font-size:11px;font-weight:750}.actions{margin-top:13px}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#1e293b;border-radius:9px;padding:7px 10px;text-decoration:none;font-size:11.5px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.tabs{margin:0 0 12px}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:750;color:#475569}.tab.active{background:var(--blueSoft);border-color:#bfdbfe;color:#1d4ed8}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:12px;align-items:start}.stack{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.cardHead{padding:13px 15px 7px;display:flex;justify-content:space-between;align-items:center}.cardTitle{font-size:13px;font-weight:850;color:#334155}.cardBody{padding:6px 15px 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px 11px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:4px}.value{font-size:12.5px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.value.soft{font-weight:500;line-height:1.45}.contact{display:flex;gap:10px;align-items:flex-start}.avatar{width:36px;height:36px;border-radius:10px;background:var(--blueSoft);color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}.muted{font-size:11.8px;color:var(--muted)}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:55px 20px;text-align:center;color:var(--muted)}.footer{font-size:9.5px;color:#94a3b8;padding:7px 2px}@media(max-width:1100px){.shell{grid-template-columns:300px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){body{padding:7px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:430px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"><div class="loading"><strong>Chargement des remontées…</strong>Connexion à Grist.</div></main><script>const app=document.getElementById('app');const state={tables:null,selectedId:null,q:'',statut:'',priorite:'',type:'',tab:'synthese'};const T={r:'Remontees_editeur_',c:'CONTACTS',s:'SITES_nomenclature_UGECAM'};function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function txt(v){if(empty(v))return'';if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).join(', ')}return String(v)}function dt(v){if(empty(v))return'';const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);if(Number.isNaN(d.getTime()))return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}async function load(){const[r,c,s]=await Promise.all([ft(T.r),ft(T.c),ft(T.s)]);state.tables={r,c,s}}function priorityClass(v){const x=txt(v).toLowerCase();if(x.includes('urgent')||x.includes('haute')||x.includes('élev'))return'red';if(x.includes('moy')||x.includes('normal'))return'amber';return''}function statusClass(v){const x=txt(v).toLowerCase();if(x.includes('clos')||x.includes('résolu')||x.includes('term'))return'green';if(x.includes('bloq')||x.includes('incident'))return'red';return''}function filtered(){const q=state.q.trim().toLowerCase();return state.tables.r.filter(r=>{const hay=[r.REF_GRIST_remontees,r.REF,r.LIBELLE,r.DESCRIPTION,r.CONTEXTE,r.RESULTAT_ACTUEL,r.RESULTAT_ATTENDU,r.THEME,r.SOUS_THEME,r.TYPE_DE_DEMANDE,r.PRIORITE,r.STATUT_MOAD,r.STATUT_AIRMES,r.ESMS].map(txt).join(' ').toLowerCase();return(!q||hay.includes(q))&&(!state.statut||txt(r.STATUT_MOAD)===state.statut)&&(!state.priorite||txt(r.PRIORITE)===state.priorite)&&(!state.type||txt(r.TYPE_DE_DEMANDE)===state.type)}).sort((a,b)=>Number(b.id)-Number(a.id))}function sidebar(){const all=state.tables.r;const sts=[...new Set(all.map(x=>txt(x.STATUT_MOAD)).filter(Boolean))].sort();const ps=[...new Set(all.map(x=>txt(x.PRIORITE)).filter(Boolean))].sort();const ts=[...new Set(all.map(x=>txt(x.TYPE_DE_DEMANDE)).filter(Boolean))].sort();const items=filtered();return`<aside class="sidebar"><div class="sideHead"><div class="sideTitle">Remontées éditeur</div><div class="sideSub">Rechercher, filtrer et suivre les demandes</div><input id="q" class="search" placeholder="Référence, libellé, thème, ESMS…" value="${esc(state.q)}"><div class="filters"><select id="st"><option value="">Tous statuts MOAD</option>${sts.map(x=>`<option ${x===state.statut?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="pr"><option value="">Toutes priorités</option>${ps.map(x=>`<option ${x===state.priorite?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="tools"><select id="ty" class="ghost"><option value="">Tous types</option>${ts.map(x=>`<option ${x===state.type?'selected':''}>${esc(x)}</option>`).join('')}</select><button id="reset" class="ghost">Réinitialiser</button></div></div><div class="listMeta"><span>${items.length} remontée${items.length>1?'s':''}</span><span>${state.selectedId?'1 sélectionnée':''}</span></div><div class="list">${items.map(r=>`<button class="item ${Number(r.id)===Number(state.selectedId)?'active':''}" data-id="${r.id}"><div class="itemTop"><div class="itemName">${esc(txt(r.LIBELLE)||txt(r.REF_GRIST_remontees)||'Remontée')}</div>${r.PRIORITE?`<span class="pill ${priorityClass(r.PRIORITE)}">${esc(r.PRIORITE)}</span>`:''}</div><div class="itemMeta">${esc([txt(r.REF_GRIST_remontees),txt(r.STATUT_MOAD),txt(r.THEME)].filter(Boolean).join(' • '))}</div></button>`).join('')}</div></aside>`}function field(l,v,full=false,soft=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value ${soft?'soft':''}">${esc(v)}</div></div>`}function contactBlock(r){const c=byId(state.tables.c,r.NOM_CONTACT);if(!c)return'<div class="muted">Aucun contact associé.</div>';const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact';const initials=((c.PRENOM||'').slice(0,1)+(c.NOM||'').slice(0,1)).toUpperCase()||'•';return`<div class="contact"><div class="avatar">${esc(initials)}</div><div><div style="font-weight:850;font-size:13px">${esc(name)}</div><div class="muted">${esc(c.FONCTION||'')}</div>${c.EMAIL?`<a href="mailto:${esc(c.EMAIL)}" style="font-size:11.5px;color:#1d4ed8;text-decoration:none">${esc(c.EMAIL)}</a>`:''}</div></div>`}function tabContent(r){if(state.tab==='contexte')return`<div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Contexte et constat</div></div><div class="cardBody"><div class="grid">${field('Description',r.DESCRIPTION,true,true)}${field('Contexte',r.CONTEXTE,true,true)}${field('Résultat actuel',r.RESULTAT_ACTUEL,true,true)}${field('Résultat attendu',r.RESULTAT_ATTENDU,true,true)}</div></div></section></div>`;if(state.tab==='reponse')return`<div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Réponse AIRMES / échanges</div></div><div class="cardBody">${r.REPONSE_AIRMES_ECHANGES?`<div class="value soft">${esc(r.REPONSE_AIRMES_ECHANGES)}</div>`:'<div class="muted">Aucune réponse renseignée.</div>'}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Commentaires MOAD</div></div><div class="cardBody">${r.COMMENTAIRES?`<div class="value soft">${esc(r.COMMENTAIRES)}</div>`:'<div class="muted">Aucun commentaire.</div>'}</div></section></div>`;if(state.tab==='suivi')return`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Suivi</div></div><div class="cardBody"><div class="grid">${field('Statut AIRMES',r.STATUT_AIRMES)}${field('Statut MOAD',r.STATUT_MOAD)}${field('Échéance',dt(r.ECHEANCE))}${field('Version livrée',r.VERSION_LIVREE?'Oui':'Non')}${field('N° réf. associée',r.N_REF_ASSOCIEE,true)}${field('Incident',r.INCIDENT?'Oui':'Non')}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Traçabilité</div></div><div class="cardBody"><div class="grid">${field('Création',r.Creation,true)}${field('Modification',r.Modification,true)}${field('Date',dt(r.DATE),true)}</div></div></section></aside></div>`;return`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Synthèse</div></div><div class="cardBody"><div class="grid">${field('Référence',txt(r.REF_GRIST_remontees)||txt(r.REF))}${field('Type de demande',r.TYPE_DE_DEMANDE)}${field('Thème',r.THEME)}${field('Sous-thème',r.SOUS_THEME)}${field('Priorité',r.PRIORITE)}${field('Support',txt(r.SUPPORT))}${field('ESMS',r.ESMS,true)}${field('Libellé',r.LIBELLE,true,true)}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Besoin exprimé</div></div><div class="cardBody"><div class="grid">${field('Description',r.DESCRIPTION,true,true)}${field('Résultat attendu',r.RESULTAT_ATTENDU,true,true)}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Contact</div></div><div class="cardBody">${contactBlock(r)}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Statuts</div></div><div class="cardBody"><div class="grid">${field('AIRMES',r.STATUT_AIRMES,true)}${field('MOAD',r.STATUT_MOAD,true)}${field('Échéance',dt(r.ECHEANCE),true)}${field('Version livrée',r.VERSION_LIVREE?'Oui':'Non',true)}</div></div></section></aside></div>`}function detail(){const r=byId(state.tables.r,state.selectedId)||filtered()[0];if(!r)return'<div class="empty">Aucune remontée ne correspond aux filtres.</div>';state.selectedId=r.id;const all=state.tables.r;const open=all.filter(x=>!/(clos|résolu|termin)/i.test(txt(x.STATUT_MOAD))).length;const urgent=all.filter(x=>/(urgent|haute|élev)/i.test(txt(x.PRIORITE))).length;const due=all.filter(x=>x.ECHEANCE&&!/(clos|résolu|termin)/i.test(txt(x.STATUT_MOAD))).length;return`<section class="detail"><div class="kpis"><div class="kpi"><div class="kpiLabel">Total</div><div class="kpiValue">${all.length}</div></div><div class="kpi"><div class="kpiLabel">Ouvertes</div><div class="kpiValue">${open}</div></div><div class="kpi"><div class="kpiLabel">Prioritaires</div><div class="kpiValue">${urgent}</div></div><div class="kpi"><div class="kpiLabel">Avec échéance</div><div class="kpiValue">${due}</div></div></div><section class="hero"><div class="heroTop"><div><div class="eyebrow">Remontée éditeur</div><h1>${esc(txt(r.LIBELLE)||txt(r.REF_GRIST_remontees)||'Demande')}</h1><div class="subtitle">${esc([txt(r.REF_GRIST_remontees),txt(r.THEME),txt(r.ESMS)].filter(Boolean).join(' • '))}</div><div class="chips">${r.PRIORITE?`<span class="pill ${priorityClass(r.PRIORITE)}">${esc(r.PRIORITE)}</span>`:''}${r.STATUT_MOAD?`<span class="pill ${statusClass(r.STATUT_MOAD)}">${esc(r.STATUT_MOAD)}</span>`:''}${r.STATUT_AIRMES?`<span class="chip">AIRMES : ${esc(r.STATUT_AIRMES)}</span>`:''}</div></div></div><div class="actions">${r.MAILTO?`<a class="btn primary" href="${esc(r.MAILTO)}">✉ Contacter AIRMES</a>`:''}${r.NOM_CONTACT&&byId(state.tables.c,r.NOM_CONTACT)?.EMAIL?`<a class="btn" href="mailto:${esc(byId(state.tables.c,r.NOM_CONTACT).EMAIL)}">✉ Contacter le référent</a>`:''}</div></section><div class="tabs">${[['synthese','Synthèse'],['contexte','Contexte & résultats'],['reponse','Réponse AIRMES'],['suivi','Suivi']].map(([id,l])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div>${tabContent(r)}<div class="footer">Tableau de bord remontées • données lues directement depuis Grist</div></section>`}function render(){app.innerHTML=`<div class="shell">${sidebar()}${detail()}</div>`;bind()}function bind(){document.getElementById('q')?.addEventListener('input',e=>{state.q=e.target.value;render()});document.getElementById('st')?.addEventListener('change',e=>{state.statut=e.target.value;render()});document.getElementById('pr')?.addEventListener('change',e=>{state.priorite=e.target.value;render()});document.getElementById('ty')?.addEventListener('change',e=>{state.type=e.target.value;render()});document.getElementById('reset')?.addEventListener('click',()=>{state.q=state.statut=state.priorite=state.type='';render()});document.querySelectorAll('.item').forEach(b=>b.addEventListener('click',async()=>{state.selectedId=Number(b.dataset.id);render();try{await grist.setCursorPos({rowId:state.selectedId})}catch{}}));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}))}grist.ready({requiredAccess:'full'});grist.onRecord(r=>{if(r?.id&&state.tables){state.selectedId=r.id;render()}});(async()=>{try{await load();state.selectedId=state.tables.r[0]?.id||null;render()}catch(e){console.error(e);app.innerHTML=`<div class="error"><strong>Impossible de charger les remontées</strong>${esc(e.message||e)}<br><br>Vérifie que le widget dispose de l’accès complet au document.</div>`}})();</script></body></html>
