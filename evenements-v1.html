<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Événements MOAD — Grist</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--red:#b91c1c;--redSoft:#fef2f2;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error,.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:44px 22px;text-align:center;color:var(--muted)}.loading strong,.error strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}.shell{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px}.sidebar{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:15px;border-bottom:1px solid var(--line)}.sideTitle{font-size:15px;font-weight:850}.sideSub{font-size:11.5px;color:var(--muted);margin-top:3px}.search{width:100%;margin-top:11px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;outline:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:7px;font-size:11.5px}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.qbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:750;color:#475569}.qbtn.active{background:var(--blueSoft);border-color:#bfdbfe;color:#1d4ed8}.reset{margin-top:8px;width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;font-size:11.5px;font-weight:700;color:#475569}.listMeta{padding:8px 14px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between}.list{overflow:auto;padding:7px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:11px;padding:10px;color:var(--text)}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.itemName{font-size:12.5px;font-weight:820;line-height:1.35}.itemMeta{margin-top:4px;font-size:10.8px;color:var(--muted);line-height:1.35}.status{display:inline-flex;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800}.status.up{background:var(--greenSoft);color:var(--green)}.status.past{background:#f1f5f9;color:#475569}.status.live{background:var(--amberSoft);color:var(--amber)}.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}.kpiLabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:20px;font-weight:900;margin-top:2px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{font-size:clamp(21px,2.8vw,30px);line-height:1.12;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:7px}.chips,.tabs{display:flex;flex-wrap:wrap;gap:6px}.chips{margin-top:12px}.chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--blueSoft);color:#1d4ed8;font-size:11px;font-weight:750}.tabs{margin:0 0 12px}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:750;color:#475569}.tab.active{background:var(--blueSoft);border-color:#bfdbfe;color:#1d4ed8}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:12px;align-items:start}.stack{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.cardHead{padding:13px 15px 7px;display:flex;justify-content:space-between;align-items:center}.cardTitle{font-size:13px;font-weight:850;color:#334155}.count{font-size:10.5px;font-weight:850;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:3px 7px}.cardBody{padding:6px 15px 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px 11px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:4px}.value{font-size:12.5px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.value.soft{font-weight:500;line-height:1.45}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;gap:9px}.avatar{width:32px;height:32px;border-radius:9px;background:var(--blueSoft);color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;flex:0 0 auto}.personName{font-size:12.5px;font-weight:850}.personRole{font-size:11px;color:var(--muted);margin-top:2px}.evalGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{background:var(--soft);border:1px solid #edf2f7;border-radius:11px;padding:10px}.metricName{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.metricValue{font-size:18px;font-weight:900;margin-top:3px}.comment{border-bottom:1px solid #eef2f7;padding:9px 0}.comment:last-child{border-bottom:0}.muted{font-size:11.8px;color:var(--muted)}.footer{font-size:9.5px;color:#94a3b8;padding:7px 2px}@media(max-width:1100px){.shell{grid-template-columns:300px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){body{padding:7px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:430px}.grid,.people,.evalGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"><div class="loading"><strong>Chargement des événements MOAD…</strong>Connexion à Grist.</div></main><script>const app=document.getElementById('app');const state={tables:null,selectedId:null,q:'',type:'',org:'',mode:'all',tab:'info'};const T={e:'EVENEMENTS_MOAD',c:'CONTACTS',v:'Evenements_Evaluation_interventions'};function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d);const n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function list(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x))}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return list(p)}catch{}return[v]}return[v]}function refs(v){return list(v).map(Number).filter(x=>Number.isFinite(x)&&x>0)}function txt(v){return empty(v)?'':list(v).map(String).join(', ')}function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}function asDate(v){if(empty(v))return null;const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);return Number.isNaN(d.getTime())?null:d}function dt(v){const d=asDate(v);if(!d)return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}async function load(){const[e,c,v]=await Promise.all([ft(T.e),ft(T.c),ft(T.v)]);state.tables={e,c,v}}function status(e){const now=new Date(),s=asDate(e.DEBUT_EVENEMENT),f=asDate(e.FIN_EVENEMENT)||s;if(s&&f&&now>=s&&now<=f)return['En cours','live'];if(s&&s>now)return['À venir','up'];return['Passé','past']}function evalsFor(id){return state.tables.v.filter(x=>Number(x.evenement_MOAD_evalue)===Number(id))}function filtered(){const q=state.q.trim().toLowerCase();return state.tables.e.filter(e=>{const st=status(e)[0];const hay=[e.TITRE_EVENEMENT,e.DESCRIPTION_EVENEMENT,txt(e.TYPE_EVENEMENT),txt(e.ORGANISATEUR_EVENEMENT)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!state.type||list(e.TYPE_EVENEMENT).map(String).includes(state.type))&&(!state.org||list(e.ORGANISATEUR_EVENEMENT).map(String).includes(state.org))&&(state.mode==='all'||(state.mode==='up'&&st==='À venir')||(state.mode==='past'&&st==='Passé')||(state.mode==='live'&&st==='En cours'))}).sort((a,b)=>(asDate(b.DEBUT_EVENEMENT)?.getTime()||0)-(asDate(a.DEBUT_EVENEMENT)?.getTime()||0))}function sidebar(){const all=state.tables.e;const types=[...new Set(all.flatMap(x=>list(x.TYPE_EVENEMENT).map(String)))].filter(Boolean).sort();const orgs=[...new Set(all.flatMap(x=>list(x.ORGANISATEUR_EVENEMENT).map(String)))].filter(Boolean).sort();const items=filtered();return`<aside class="sidebar"><div class="sideHead"><div class="sideTitle">Événements MOAD</div><div class="sideSub">Rechercher, filtrer et consulter les événements</div><input id="q" class="search" placeholder="Titre, type, organisateur…" value="${esc(state.q)}"><div class="filters"><select id="type"><option value="">Tous les types</option>${types.map(x=>`<option ${x===state.type?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="org"><option value="">Tous les organisateurs</option>${orgs.map(x=>`<option ${x===state.org?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="quick"><button class="qbtn ${state.mode==='all'?'active':''}" data-mode="all">Tous</button><button class="qbtn ${state.mode==='up'?'active':''}" data-mode="up">À venir</button><button class="qbtn ${state.mode==='live'?'active':''}" data-mode="live">En cours</button><button class="qbtn ${state.mode==='past'?'active':''}" data-mode="past">Passés</button></div><button id="reset" class="reset">Réinitialiser</button></div><div class="listMeta"><span>${items.length} événement${items.length>1?'s':''}</span><span>${state.selectedId?'1 sélectionné':''}</span></div><div class="list">${items.map(e=>{const st=status(e);return`<button class="item ${Number(e.id)===Number(state.selectedId)?'active':''}" data-id="${e.id}"><div class="itemName">${esc(e.TITRE_EVENEMENT||'Événement')}</div><div class="itemMeta">${esc(dt(e.DEBUT_EVENEMENT))}</div><div class="itemMeta">${esc(txt(e.TYPE_EVENEMENT))} <span class="status ${st[1]}">${st[0]}</span></div></button>`}).join('')}</div></aside>`}function field(l,v,full=false,soft=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value ${soft?'soft':''}">${esc(v)}</div></div>`}function person(c){const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact';const init=((c.PRENOM||'').slice(0,1)+(c.NOM||'').slice(0,1)).toUpperCase()||'•';return`<div class="person"><div class="avatar">${esc(init)}</div><div><div class="personName">${esc(name)}</div><div class="personRole">${esc(c.FONCTION||'')}</div>${c.EMAIL?`<a href="mailto:${esc(c.EMAIL)}" style="font-size:11px;color:#1d4ed8;text-decoration:none">${esc(c.EMAIL)}</a>`:''}</div></div>`}function normScore(v){const s=txt(v).trim();const m=s.match(/(\d+(?:[.,]\d+)?)/);return m?Number(m[1].replace(',','.')):null}function evalTab(e){const ev=evalsFor(e.id);const fields=[['Clarté', 'Clarete_des_objectifs'],['Interventions','Qualite_des_interventions'],['Visio','Adaptation_au_format_visio'],['Supports','Supports_pedagogiques_PDF_slides_etc_'],['Interactivité','Interactivite_echanges_Q_R_'],['Durée / rythme','Duree_et_rythme_de_la_formation'],['Utilité','Utilite_pour_votre_travail'],['Applicabilité','Applicabilite_des_connaissances'],['Note globale','Note_globale']];const metrics=fields.map(([label,key])=>{const nums=ev.map(x=>normScore(x[key])).filter(x=>x!==null);return nums.length?{label,value:(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1)}:null}).filter(Boolean);const comments=ev.flatMap(x=>[['Points forts',x.Points_forts_de_la_formation_commentaires],['Axes d’amélioration',x.Axes_d_amelioration_commentaires],['Suggestion',x.Suggestions_libres]]).filter(([,v])=>!empty(v));return`<div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Synthèse des évaluations</div><div class="count">${ev.length}</div></div><div class="cardBody">${metrics.length?`<div class="evalGrid">${metrics.map(m=>`<div class="metric"><div class="metricName">${esc(m.label)}</div><div class="metricValue">${esc(m.value)}</div></div>`).join('')}</div>`:'<div class="muted">Aucune note numérique exploitable.</div>'}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Commentaires</div></div><div class="cardBody">${comments.length?comments.slice(0,20).map(([l,v])=>`<div class="comment"><div style="font-weight:800;font-size:11px">${esc(l)}</div><div class="value soft">${esc(v)}</div></div>`).join(''):'<div class="muted">Aucun commentaire libre.</div>'}</div></section></div>`}function detail(){const e=byId(state.tables.e,state.selectedId);if(!e)return'<div class="empty">Sélectionnez un événement.</div>';const st=status(e);const inscrits=refs(e.inscrits).map(id=>byId(state.tables.c,id)).filter(Boolean);const ev=evalsFor(e.id);if(state.tab==='inscrits')return`<div><div class="tabs">${tabs()}</div><section class="card"><div class="cardHead"><div class="cardTitle">Inscrits</div><div class="count">${inscrits.length}</div></div><div class="cardBody">${inscrits.length?`<div class="people">${inscrits.map(person).join('')}</div>`:'<div class="muted">Aucun inscrit renseigné.</div>'}</div></section></div>`;if(state.tab==='evals')return`<div><div class="tabs">${tabs()}</div>${evalTab(e)}</div>`;return`<div><div class="tabs">${tabs()}</div><div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Informations</div></div><div class="cardBody"><div class="grid">${field('Début',dt(e.DEBUT_EVENEMENT))}${field('Fin',dt(e.FIN_EVENEMENT))}${field('Type',txt(e.TYPE_EVENEMENT))}${field('Organisateur',txt(e.ORGANISATEUR_EVENEMENT))}${field('Description',e.DESCRIPTION_EVENEMENT,true,true)}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Participation</div></div><div class="cardBody"><div class="grid">${field('Inscrits',String(inscrits.length),true)}${field('Évaluations reçues',String(ev.length),true)}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Traçabilité</div></div><div class="cardBody"><div class="grid">${field('Créé par',e.Cree_par,true)}${field('Créé le',dt(e.Cree_le),true)}</div></div></section></aside></div></div>`}function tabs(){return[['info','Informations'],['inscrits','Inscrits'],['evals','Évaluations']].map(([id,l])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}function render(){const all=state.tables.e;const now=new Date();const upcoming=all.filter(e=>asDate(e.DEBUT_EVENEMENT)&&asDate(e.DEBUT_EVENEMENT)>now).length;const live=all.filter(e=>status(e)[0]==='En cours').length;const evalCount=state.tables.v.length;const e=byId(all,state.selectedId);app.innerHTML=`<div class="shell">${sidebar()}<main class="detail"><div class="kpis"><div class="kpi"><div class="kpiLabel">Total</div><div class="kpiValue">${all.length}</div></div><div class="kpi"><div class="kpiLabel">À venir</div><div class="kpiValue">${upcoming}</div></div><div class="kpi"><div class="kpiLabel">En cours</div><div class="kpiValue">${live}</div></div><div class="kpi"><div class="kpiLabel">Évaluations</div><div class="kpiValue">${evalCount}</div></div>${e?`</div><section class="hero"><div class="eyebrow">Événement MOAD</div><h1>${esc(e.TITRE_EVENEMENT||'Événement')}</h1><div class="subtitle">${esc(dt(e.DEBUT_EVENEMENT))}</div><div class="chips"><span class="chip">${esc(txt(e.TYPE_EVENEMENT)||'Type non renseigné')}</span><span class="status ${status(e)[1]}">${status(e)[0]}</span></div></section>`:'</div>'}${detail()}<div class="footer">Tableau de bord Événements MOAD • données lues directement depuis Grist</div></main></div>`;bind()}function bind(){document.querySelectorAll('.item').forEach(b=>b.onclick=async()=>{state.selectedId=Number(b.dataset.id);try{await grist.setCursorPos({rowId:state.selectedId})}catch{}render()});document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};document.getElementById('type').onchange=e=>{state.type=e.target.value;render()};document.getElementById('org').onchange=e=>{state.org=e.target.value;render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()});document.getElementById('reset').onclick=()=>{state.q='';state.type='';state.org='';state.mode='all';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}grist.ready({requiredAccess:'full'});grist.onRecord(r=>{if(r?.id){state.selectedId=Number(r.id);if(state.tables)render()}});load().then(()=>{if(!state.selectedId&&state.tables.e.length)state.selectedId=state.tables.e[0].id;render()}).catch(e=>{app.innerHTML=`<div class="error"><strong>Impossible de charger les événements</strong>${esc(e.message||e)}</div>`})</script></body></html>
