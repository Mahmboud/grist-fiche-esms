<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remontées par type</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--violet:#7c3aed;--gray:#94a3b8;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:14px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:2px}.total{font-size:20px;font-weight:900}.totalLabel{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-top:12px}.donut{width:142px;height:142px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:27px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px #eef2f7}.center{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}.center strong{font-size:24px}.center span{font-size:9.5px;color:var(--muted)}.legend{display:flex;flex-direction:column;gap:8px}.leg{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:3px}.label{font-size:11.5px;font-weight:700}.val{text-align:right}.count{font-size:11.5px;font-weight:850}.pct{font-size:9.5px;color:var(--muted)}.foot{margin-top:11px;padding-top:9px;border-top:1px solid #eef2f7;font-size:9.5px;color:var(--muted)}.empty,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:15px;padding:34px 18px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:480px){.wrap{grid-template-columns:1fr}.donut{width:125px;height:125px}.donut:after{inset:24px}}</style></head><body><main id="app"><div class="empty">Chargement du graphique…</div></main><script>const app=document.getElementById('app');function rows(d){if(Array.isArray(d))return d;const ks=Object.keys(d||{});if(!ks.length)return[];const n=Math.max(...ks.map(k=>Array.isArray(d[k])?d[k].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(ks.map(k=>[k,Array.isArray(d[k])?d[k][i]:d[k]])))}function clean(v){const s=String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();return s||'Non renseigné'}async function fetchTable(){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable('Remontees_editeur_'));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable('Remontees_editeur_'));throw new Error('API du document indisponible')}function render(data){const counts=new Map();for(const r of data){const k=clean(r.TYPE_DE_DEMANDE);counts.set(k,(counts.get(k)||0)+1)}const total=data.length;const items=[...counts.entries()].sort((a,b)=>b[1]-a[1]);const palette=['#2563eb','#16a34a','#d97706','#7c3aed','#94a3b8','#dc2626'];let acc=0;const stops=[];items.forEach(([,n],i)=>{const start=acc/total*360;acc+=n;const end=acc/total*360;stops.push(`${palette[i%palette.length]} ${start}deg ${end}deg`)});app.innerHTML=`<section class="card"><div class="head"><div><div class="title">Remontées par type</div><div class="sub">Répartition des demandes par catégorie</div></div><div><div class="totalLabel">Total</div><div class="total">${total.toLocaleString('fr-FR')}</div></div></div><div class="wrap"><div class="donut" style="background:conic-gradient(${stops.join(',')})"><div class="center"><strong>${items.length}</strong><span>types</span></div></div><div class="legend">${items.map(([name,n],i)=>`<div class="leg"><div class="dot" style="background:${palette[i%palette.length]}"></div><div class="label">${name}</div><div class="val"><div class="count">${n}</div><div class="pct">${(n/total*100).toFixed(1)}%</div></div></div>`).join('')}</div></div><div class="foot">Les valeurs vides sont regroupées sous « Non renseigné ».</div></section>`}grist.ready({requiredAccess:'full'});fetchTable().then(render).catch(e=>app.innerHTML=`<div class="error">${String(e.message||e)}<br>Autorise l’accès complet au document.</div>`);</script></body></html>
