<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Événements MOAD V2</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f5f7fb;--s:#fff;--soft:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px}button,input,select,a{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error,.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:44px 22px;text-align:center;color:var(--muted)}.shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px}.sidebar{position:sticky;top:10px;height:calc(100vh - 20px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.sideHead{padding:13px;border-bottom:1px solid var(--line)}.sideTitle{font-size:14px;font-weight:850}.sideSub{font-size:11px;color:var(--muted);margin-top:2px}.search{width:100%;margin-top:9px;border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.filters select{width:100%;border:1px solid #dbe3ee;background:#fff;border-radius:8px;padding:6px;font-size:11px}.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.qbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:750;color:#475569}.qbtn.active{background:var(--blueSoft);border-color:#bfdbfe;color:#1d4ed8}.reset{margin-top:7px;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;font-size:11px;font-weight:700;color:#475569}.listMeta{padding:7px 12px;border-bottom:1px solid #eef2f7;color:var(--muted);font-size:10.8px;display:flex;justify-content:space-between}.list{overflow:auto;padding:6px}.item{width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:9px;color:var(--text)}.item:hover{background:#f8fafc}.item.active{background:var(--blueSoft);box-shadow:inset 3px 0 0 var(--blue)}.itemName{font-size:12px;font-weight:820;line-height:1.3}.itemMeta{margin-top:3px;font-size:10.2px;color:var(--muted);line-height:1.3}.status{display:inline-flex;border-radius:999px;padding:2px 6px;font-size:9.5px;font-weight:800}.status.up{background:var(--greenSoft);color:var(--green)}.status.past{background:#f1f5f9;color:#475569}.status.live{background:var(--amberSoft);color:var(--amber)}.detail{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--shadow)}.kpiLabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:850}.kpiValue{font-size:19px;font-weight:900;margin-top:2px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:10px}.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--blue);margin-bottom:5px}h1{font-size:clamp(20px,2.6vw,29px);line-height:1.12;margin:0}.subtitle{font-size:12.5px;color:var(--muted);margin-top:6px}.chips,.tabs{display:flex;flex-wrap:wrap;gap:5px}.chips{margin-top:10px}.chip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:var(--blueSoft);color:#1d4ed8;font-size:10.5px;font-weight:750}.tabs{margin:0 0 10px}.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:750;color:#475569}.tab.active{background:var(--blueSoft);border-color:#bfdbfe;color:#1d4ed8}.layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,.8fr);gap:10px;align-items:start}.stack{display:flex;flex-direction:column;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.cardHead{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:center}.cardTitle{font-size:12.5px;font-weight:850;color:#334155}.count{font-size:10px;font-weight:850;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:3px 7px}.cardBody{padding:5px 14px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.field{background:var(--soft);border:1px solid #edf2f7;border-radius:9px;padding:8px 10px;min-width:0}.field.full{grid-column:1/-1}.label{font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);margin-bottom:3px}.value{font-size:12px;font-weight:650;overflow-wrap:anywhere;white-space:pre-wrap}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.person{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;gap:8px}.avatar{width:30px;height:30px;border-radius:8px;background:var(--blueSoft);color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex:0 0 auto}.personName{font-size:12px;font-weight:850}.personRole{font-size:10.5px;color:var(--muted);margin-top:1px}.metricGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.metric{background:var(--soft);border:1px solid #edf2f7;border-radius:10px;padding:9px}.metricName{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase}.metricValue{font-size:18px;font-weight:900;margin-top:2px}.barRow{display:grid;grid-template-columns:minmax(140px,1.6fr) 2fr 44px;gap:8px;align-items:center;margin:7px 0}.barLabel{font-size:11px}.barTrack{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}.barFill{height:100%;background:#2563eb;border-radius:999px}.barVal{font-size:10.5px;font-weight:800;text-align:right}.comment{border-bottom:1px solid #eef2f7;padding:8px 0}.comment:last-child{border-bottom:0}.commentTitle{font-size:10px;font-weight:850;color:#475569;text-transform:uppercase}.commentText{font-size:11.5px;line-height:1.4;margin-top:2px}.md{font-size:12px;line-height:1.55;color:#334155}.md p{margin:0 0 8px}.md strong{font-weight:800;color:#0f172a}.md ul{margin:5px 0 8px 18px;padding:0}.md li{margin:2px 0}.md h2,.md h3{margin:10px 0 5px;color:#0f172a}.compact{display:grid;grid-template-columns:1fr 1fr;gap:7px}.muted{font-size:11.5px;color:var(--muted)}.footer{font-size:9px;color:#94a3b8;padding:6px 2px}@media(max-width:1100px){.shell{grid-template-columns:280px minmax(0,1fr)}.layout{grid-template-columns:1fr}.kpis,.metricGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){body{padding:6px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:420px}.grid,.people,.metricGrid,.compact{grid-template-columns:1fr}.field.full{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"><div class="loading"><strong>Chargement des événements MOAD…</strong>Connexion à Grist.</div></main><script>const app=document.getElementById('app');const state={tables:null,selectedId:null,q:'',type:'',org:'',mode:'all',tab:'info'};const T={e:'EVENEMENTS_MOAD',c:'CONTACTS',v:'Evenements_Evaluation_interventions'};function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function empty(v){return v===null||v===undefined||v===''||(Array.isArray(v)&&v.length===0)}function rows(d){if(!d)return[];if(Array.isArray(d))return d;const k=Object.keys(d),n=Math.max(...k.map(x=>Array.isArray(d[x])?d[x].length:0),0);return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}function list(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x))}if(typeof v==='string'){try{const p=JSON.parse(v);if(Array.isArray(p))return list(p)}catch{}return[v]}return[v]}function refs(v){return list(v).map(Number).filter(x=>Number.isFinite(x)&&x>0)}function txt(v){return empty(v)?'':list(v).map(String).join(', ')}function byId(a,id){return a.find(r=>Number(r.id)===Number(id))}function asDate(v){if(empty(v))return null;const d=typeof v==='number'?new Date(v*(v<1e12?1000:1)):new Date(v);return Number.isNaN(d.getTime())?null:d}function dt(v){const d=asDate(v);if(!d)return txt(v);return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}async function ft(id){if(grist?.docApi?.fetchTable)return rows(await grist.docApi.fetchTable(id));if(grist?.raw?.docApi?.fetchTable)return rows(await grist.raw.docApi.fetchTable(id));throw new Error('API du document indisponible')}async function load(){const[e,c,v]=await Promise.all([ft(T.e),ft(T.c),ft(T.v)]);state.tables={e,c,v}}function status(e){const now=new Date(),s=asDate(e.DEBUT_EVENEMENT),f=asDate(e.FIN_EVENEMENT)||s;if(s&&f&&now>=s&&now<=f)return['En cours','live'];if(s&&s>now)return['À venir','up'];return['Passé','past']}function evalsFor(id){return state.tables.v.filter(x=>Number(x.evenement_MOAD_evalue)===Number(id))}function filtered(){const q=state.q.trim().toLowerCase();return state.tables.e.filter(e=>{const st=status(e)[0],hay=[e.TITRE_EVENEMENT,e.DESCRIPTION_EVENEMENT,txt(e.TYPE_EVENEMENT),txt(e.ORGANISATEUR_EVENEMENT)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!state.type||list(e.TYPE_EVENEMENT).map(String).includes(state.type))&&(!state.org||list(e.ORGANISATEUR_EVENEMENT).map(String).includes(state.org))&&(state.mode==='all'||(state.mode==='up'&&st==='À venir')||(state.mode==='past'&&st==='Passé')||(state.mode==='live'&&st==='En cours'))}).sort((a,b)=>(asDate(b.DEBUT_EVENEMENT)?.getTime()||0)-(asDate(a.DEBUT_EVENEMENT)?.getTime()||0))}function md(s){if(!s)return'<div class="muted">Aucune description.</div>';let x=esc(s);x=x.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>').replace(/^##\s+(.+)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');const lines=x.split(/\n/);let out='',inList=false;for(const line of lines){if(/^\s*[-*•]\s+/.test(line)){if(!inList){out+='<ul>';inList=true}out+='<li>'+line.replace(/^\s*[-*•]\s+/,'')+'</li>'}else{if(inList){out+='</ul>';inList=false}if(line.trim())out+='<p>'+line+'</p>'}}if(inList)out+='</ul>';return out}function sidebar(){const all=state.tables.e,types=[...new Set(all.flatMap(x=>list(x.TYPE_EVENEMENT).map(String)))].filter(Boolean).sort(),orgs=[...new Set(all.flatMap(x=>list(x.ORGANISATEUR_EVENEMENT).map(String)))].filter(Boolean).sort(),items=filtered();return`<aside class="sidebar"><div class="sideHead"><div class="sideTitle">Événements MOAD</div><div class="sideSub">Recherche et consultation</div><input id="q" class="search" placeholder="Titre, type, organisateur…" value="${esc(state.q)}"><div class="filters"><select id="type"><option value="">Tous types</option>${types.map(x=>`<option ${x===state.type?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="org"><option value="">Tous organisateurs</option>${orgs.map(x=>`<option ${x===state.org?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="quick"><button class="qbtn ${state.mode==='all'?'active':''}" data-mode="all">Tous</button><button class="qbtn ${state.mode==='up'?'active':''}" data-mode="up">À venir</button><button class="qbtn ${state.mode==='live'?'active':''}" data-mode="live">En cours</button><button class="qbtn ${state.mode==='past'?'active':''}" data-mode="past">Passés</button></div><button id="reset" class="reset">Réinitialiser</button></div><div class="listMeta"><span>${items.length} événement${items.length>1?'s':''}</span><span>${state.selectedId?'1 sélectionné':''}</span></div><div class="list">${items.map(e=>{const st=status(e),n=refs(e.inscrits).length;return`<button class="item ${Number(e.id)===Number(state.selectedId)?'active':''}" data-id="${e.id}"><div class="itemName">${esc(e.TITRE_EVENEMENT||'Événement')}</div><div class="itemMeta">${esc(dt(e.DEBUT_EVENEMENT))}</div><div class="itemMeta">${esc(txt(e.TYPE_EVENEMENT))} • ${esc(txt(e.ORGANISATEUR_EVENEMENT))} • ${n} inscrit${n>1?'s':''}</div><div class="itemMeta"><span class="status ${st[1]}">${st[0]}</span></div></button>`}).join('')}</div></aside>`}function field(l,v,full=false){return empty(v)?'':`<div class="field ${full?'full':''}"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div></div>`}function person(c){const name=[c.PRENOM,c.NOM].filter(Boolean).join(' ')||txt(c.NOM_PRENOM_contact)||'Contact',init=((c.PRENOM||'').slice(0,1)+(c.NOM||'').slice(0,1)).toUpperCase()||'•';return`<div class="person"><div class="avatar">${esc(init)}</div><div><div class="personName">${esc(name)}</div><div class="personRole">${esc(c.FONCTION||'')}</div>${c.EMAIL?`<a href="mailto:${esc(c.EMAIL)}" style="font-size:10.5px;color:#1d4ed8;text-decoration:none">${esc(c.EMAIL)}</a>`:''}</div></div>`}function score(v){const m=txt(v).match(/(\d+(?:[.,]\d+)?)/);return m?Number(m[1].replace(',','.')):null}function avg(arr,key){const n=arr.map(x=>score(x[key])).filter(x=>Number.isFinite(x));return n.length?(n.reduce((a,b)=>a+b,0)/n.length):null}function comments(ev,key){return ev.map(x=>txt(x[key])).filter(Boolean)}function evalView(e){const ev=evalsFor(e.id);if(!ev.length)return'<div class="empty">Aucune évaluation reçue pour cet événement.</div>';const metrics=[['Clarté','Clarete_des_objectifs'],['Interventions','Qualite_des_interventions'],['Visio','Adaptation_au_format_visio'],['Supports','Supports_pedagogiques_PDF_slides_etc_'],['Interactivité','Interactivite_echanges_Q_R_'],['Durée','Duree_et_rythme_de_la_formation'],['Utilité','Utilite_pour_votre_travail'],['Applicabilité','Applicabilite_des_connaissances'],['Note globale','Note_globale']];const avgs=metrics.map(([l,k])=>[l,avg(ev,k)]).filter(x=>x[1]!==null);const max=Math.max(5,...avgs.map(x=>x[1]));const pf=comments(ev,'Points_forts_de_la_formation_commentaires'),ax=comments(ev,'Axes_d_amelioration_commentaires'),sg=comments(ev,'Suggestions_libres');return`<div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Synthèse des évaluations</div><div class="count">${ev.length}</div></div><div class="cardBody"><div class="metricGrid"><div class="metric"><div class="metricName">Réponses</div><div class="metricValue">${ev.length}</div></div><div class="metric"><div class="metricName">Note globale</div><div class="metricValue">${avg(ev,'Note_globale')?.toFixed(1)??'—'}</div></div><div class="metric"><div class="metricName">Utilité</div><div class="metricValue">${avg(ev,'Utilite_pour_votre_travail')?.toFixed(1)??'—'}</div></div><div class="metric"><div class="metricName">Applicabilité</div><div class="metricValue">${avg(ev,'Applicabilite_des_connaissances')?.toFixed(1)??'—'}</div></div></div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Détail des critères</div></div><div class="cardBody">${avgs.map(([l,v])=>`<div class="barRow"><div class="barLabel">${esc(l)}</div><div class="barTrack"><div class="barFill" style="width:${Math.min(100,(v/max)*100)}%"></div></div><div class="barVal">${v.toFixed(1)}</div></div>`).join('')}</div></section><section class="card"><div class="cardHead"><div class="cardTitle">Commentaires</div></div><div class="cardBody">${[['Points forts',pf],['Axes d’amélioration',ax],['Suggestions',sg]].map(([t,a])=>a.length?`<div class="comment"><div class="commentTitle">${t}</div>${a.map(x=>`<div class="commentText">• ${esc(x)}</div>`).join('')}</div>`:'').join('')||'<div class="muted">Aucun commentaire libre.</div>'}</div></section></div>`}function tabView(e){if(state.tab==='inscrits'){const people=refs(e.inscrits).map(id=>byId(state.tables.c,id)).filter(Boolean);return`<section class="card"><div class="cardHead"><div class="cardTitle">Inscrits</div><div class="count">${people.length}</div></div><div class="cardBody">${people.length?`<div class="people">${people.map(person).join('')}</div>`:'<div class="muted">Aucun inscrit.</div>'}</div></section>`}if(state.tab==='eval')return evalView(e);return`<div class="layout"><div class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Informations</div></div><div class="cardBody"><div class="grid">${field('Début',dt(e.DEBUT_EVENEMENT))}${field('Fin',dt(e.FIN_EVENEMENT))}${field('Type',txt(e.TYPE_EVENEMENT))}${field('Organisateur',txt(e.ORGANISATEUR_EVENEMENT))}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Description</div></div><div class="cardBody"><div class="md">${md(e.DESCRIPTION_EVENEMENT)}</div></div></section></div><aside class="stack"><section class="card"><div class="cardHead"><div class="cardTitle">Participation</div></div><div class="cardBody"><div class="compact">${field('Inscrits',refs(e.inscrits).length)}${field('Évaluations',evalsFor(e.id).length)}</div></div></section><section class="card"><div class="cardHead"><div class="cardTitle">Traçabilité</div></div><div class="cardBody"><div class="compact">${field('Créé par',e.Cree_par)}${field('Créé le',dt(e.Cree_le))}</div></div></section></aside></div>`}function render(){const e=byId(state.tables.e,state.selectedId)||filtered()[0];if(e)state.selectedId=e.id;const all=state.tables.e,up=all.filter(x=>status(x)[0]==='À venir').length,live=all.filter(x=>status(x)[0]==='En cours').length,evn=state.tables.v.length;app.innerHTML=`<div class="shell">${sidebar()}<main class="detail"><div class="kpis"><div class="kpi"><div class="kpiLabel">Total</div><div class="kpiValue">${all.length}</div></div><div class="kpi"><div class="kpiLabel">À venir</div><div class="kpiValue">${up}</div></div><div class="kpi"><div class="kpiLabel">En cours</div><div class="kpiValue">${live}</div></div><div class="kpi"><div class="kpiLabel">Évaluations</div><div class="kpiValue">${evn}</div></div></div>${e?`<section class="hero"><div class="eyebrow">Événement MOAD</div><h1>${esc(e.TITRE_EVENEMENT||'Événement')}</h1><div class="subtitle">${esc(dt(e.DEBUT_EVENEMENT))}</div><div class="chips"><span class="chip">${esc(txt(e.TYPE_EVENEMENT)||'Type non renseigné')}</span><span class="status ${status(e)[1]}">${status(e)[0]}</span></div></section><div class="tabs"><button class="tab ${state.tab==='info'?'active':''}" data-tab="info">Informations</button><button class="tab ${state.tab==='inscrits'?'active':''}" data-tab="inscrits">Inscrits</button><button class="tab ${state.tab==='eval'?'active':''}" data-tab="eval">Évaluations</button></div>${tabView(e)}<div class="footer">Événements MOAD V2 • données lues directement depuis Grist</div>`:'<div class="empty">Aucun événement.</div>'}</main></div>`;bind();scrollActive()}function bind(){document.querySelector('#q')?.addEventListener('input',e=>{state.q=e.target.value;render()});document.querySelector('#type')?.addEventListener('change',e=>{state.type=e.target.value;render()});document.querySelector('#org')?.addEventListener('change',e=>{state.org=e.target.value;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()});document.querySelector('#reset')?.addEventListener('click',()=>{state.q='';state.type='';state.org='';state.mode='all';render()});document.querySelectorAll('.item').forEach(b=>b.onclick=async()=>{state.selectedId=Number(b.dataset.id);render();try{await grist.setCursorPos({rowId:state.selectedId})}catch{}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}function scrollActive(){requestAnimationFrame(()=>document.querySelector('.item.active')?.scrollIntoView({block:'nearest'}))}grist.ready({requiredAccess:'full'});load().then(()=>{state.selectedId=state.tables.e[0]?.id||null;render()}).catch(err=>{app.innerHTML=`<div class="error">${esc(err.message||err)}<br>Accorde l’accès complet au document.</div>`});grist.onRecord(r=>{if(r?.id&&state.tables){state.selectedId=r.id;render()}});</script></body></html>
