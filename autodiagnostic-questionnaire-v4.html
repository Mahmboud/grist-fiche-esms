<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autodiagnostic MOAD 2026</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><script src="https://mahmboud.github.io/grist-fiche-esms/moad-ref-config.js?v=1"></script><style>
:root{--bg:#f5f7fb;--s:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blueSoft:#eff6ff;--green:#15803d;--greenSoft:#f0fdf4;--amber:#a16207;--amberSoft:#fffbeb;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:1600px;margin:auto}.loading,.error{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}.shell{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}.side{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:auto}.sideHead{padding:15px;border-bottom:1px solid var(--line)}.title{font-size:16px;font-weight:900}.sub{font-size:11.5px;color:var(--muted);margin-top:3px}.select{width:100%;margin-top:10px;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff}.progress{margin-top:12px}.progressTop{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:8px}.bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:5px}.fill{height:100%;background:var(--blue)}.welcome{padding:15px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fff,#f8fbff)}.welcomeTitle{font-size:15px;font-weight:900;line-height:1.3}.welcomeText{font-size:11.2px;line-height:1.45;color:#475569;margin-top:8px}.welcomeText ul,.welcomeText ol{padding-left:17px;margin:6px 0}.welcomeText li{margin:3px 0}.welcomeContact{margin-top:8px;font-size:10.8px;color:#475569}.welcomeContact a{color:#2563eb;text-decoration:none;font-weight:750}.nav{padding:8px;overflow:visible}.navBtn{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;display:flex;justify-content:space-between;gap:8px;color:#334155}.navBtn:hover{background:#f8fafc}.navBtn.active{background:var(--blueSoft);color:#1d4ed8;font-weight:800}.count{font-size:10.5px;color:var(--muted);white-space:nowrap}.main{min-width:0}.hero{position:sticky;top:12px;z-index:5;background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}.siteName{font-size:24px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:5px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:750}.pill.green{background:var(--greenSoft);color:var(--green)}.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:4px 0 10px}.sectionTitle{font-size:18px;font-weight:900}.sectionCount{font-size:11px;color:var(--muted);font-weight:750}.qcard{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:16px;margin-bottom:11px}.qcard.answered{border-left:4px solid #86efac}.qhead{display:flex;justify-content:space-between;gap:12px}.qtext{font-size:14px;font-weight:850;line-height:1.45}.saveState{font-size:10.5px;color:var(--muted);white-space:nowrap}.explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f8fafc;border-left:3px solid #cbd5e1;color:#475569;font-size:12px;line-height:1.5;white-space:pre-wrap}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:750}.choice.on{background:var(--blueSoft);border-color:#93c5fd;color:#1d4ed8}.prec{margin-top:11px;width:100%;min-height:76px;resize:vertical;border:1px solid #dbe3ee;border-radius:10px;padding:10px;font-size:12px}.prec:focus,.prio select:focus{outline:0;border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.prio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.prio label{font-size:10.5px;font-weight:800;color:#475569}.prio select{width:100%;margin-top:4px;padding:9px;border:1px solid #dbe3ee;border-radius:9px;background:#fff}.note{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);margin-top:12px}.sync{font-size:10.5px;color:var(--muted);margin-top:7px}.readbox{margin-top:10px;border:1px solid #dbe3ee;border-radius:10px;padding:10px;background:#f8fafc;font-size:12px;white-space:pre-wrap;line-height:1.45;color:#334155}.readonlyLabel{font-size:10.5px;color:var(--muted);font-weight:800;margin-bottom:4px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;max-height:none}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.hero{position:static}.prio{grid-template-columns:1fr}}
</style></head><body><main id="app"><div class="loading">Chargement de l’autodiagnostic 2026…</div></main><script>
let CONFIG={version:'2026',sections:[]};
const app=document.getElementById('app'),H='Autodiagnostic_Historique';
const state={rows:[],section:0,current:null,saving:{},dirty:new Set(),lastSync:null,historyReady:false,isSiege:false,isDngu:false,isOwner:false};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function rows(d){if(Array.isArray(d))return d;const k=Object.keys(d||{}),n=Math.max(0,...k.map(x=>Array.isArray(d[x])?d[x].length:0));return Array.from({length:n},(_,i)=>Object.fromEntries(k.map(x=>[x,Array.isArray(d[x])?d[x][i]:d[x]])))}
function empty(v){if(v===null||v===undefined)return true;if(typeof v==='string')return v.replace(/\u00a0/g,' ').trim()==='';if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.length===0||a.every(x=>empty(x))}return false}
async function ft(id){return rows(await grist.docApi.fetchTable(id))}
function listVals(v){if(empty(v))return[];if(Array.isArray(v)){const a=(v[0]==='L'||v[0]==='l')?v.slice(1):v;return a.filter(x=>!empty(x)).map(String)}if(typeof v==='string'){try{return listVals(JSON.parse(v))}catch{return[v]}}return[String(v)]}
async function loadConfig(){const cfg=await loadMoadRefConfig(),rr=(cfg.questions||[]).map(x=>({ORDRE:x[0],VOLET:x[1],QUESTION_ID:x[2],QUESTION:x[3],EXPLICATION:x[4],KIND:x[5],CHOICES_JSON:JSON.stringify(x[6]||[]),COL_REPONSE:x[7],COL_PRECISIONS:x[8],COL_CHOIX1:x[9],COL_CHOIX2:x[10],COL_CHOIX3:x[11],NOTES_COL:x[12]})).sort((a,b)=>Number(a.ORDRE||0)-Number(b.ORDRE||0)),sections=[],by=new Map();for(const r of rr){let s=by.get(r.VOLET);if(!s){s={title:r.VOLET,sheet:r.VOLET,questions:[],notes:true,notes_col:r.NOTES_COL||''};by.set(r.VOLET,s);sections.push(s)}let choices=[];try{choices=JSON.parse(r.CHOICES_JSON||'[]')}catch{}const q={id:r.QUESTION_ID,question:r.QUESTION||'',explanation:r.EXPLICATION||'',raw_type:r.RAW_TYPE||'',kind:r.KIND||'text',choices,options:choices,free_label:r.QUESTION_ID==='ACU-08'?'Votre besoin en thématiques':'Précisions',fields:[]};if(q.kind==='choice'||q.kind==='multichoice'){q.fields.push({col:r.COL_REPONSE,type:q.kind==='multichoice'?'ChoiceList':'Choice',label:q.question,choices});if(r.COL_PRECISIONS)q.fields.push({col:r.COL_PRECISIONS,type:'Text',label:'Précisions'})}else if(q.kind==='text'){q.fields.push({col:r.COL_REPONSE,type:'Text',label:q.question})}else if(q.kind==='priority3'){q.fields=[{col:r.COL_CHOIX1,type:'Choice',label:q.question+' — Choix 1',choices},{col:r.COL_CHOIX2,type:'Choice',label:q.question+' — Choix 2',choices},{col:r.COL_CHOIX3,type:'Choice',label:q.question+' — Choix 3',choices},{col:r.COL_PRECISIONS,type:'Text',label:'Précisions'}]}s.questions.push(q)}return{version:'2026',sections}}
function answerCols(q){if(q.kind==='priority3')return q.fields.slice(0,3).map(x=>x.col);return q.fields.length?[q.fields[0].col]:[]}
function answered(row,q){const a=answerCols(q);return q.kind==='priority3'?a.length>0&&a.every(c=>!empty(row?.[c])):a.some(c=>!empty(row?.[c]))}
function counts(row,sec=null){const qs=sec?sec.questions:CONFIG.sections.flatMap(s=>s.questions),total=qs.length,done=qs.filter(q=>answered(row,q)).length;return{done,total,pct:total?Math.round(done/total*100):0}}
function fmt(v){if(empty(v))return'—';const n=Number(v),d=Number.isFinite(n)?new Date(n*1000):new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
async function ensureHistory(){try{const tabs=await grist.docApi.listTables();state.historyReady=tabs.includes(H)}catch{state.historyReady=false}}async function detectOwner(){try{await ft('ADMIN_OUTILS');state.isOwner=true}catch(e){state.isOwner=false}}async function detectSiege(){try{const reqs=await ft('DEMANDES_ACCES'),sites=await ft('SITES_nomenclature_UGECAM');const valid=reqs.filter(r=>String(r.STATUT||'').toLowerCase()==='validé').sort((a,b)=>Number(b.id)-Number(a.id))[0];if(!valid){state.isSiege=false;state.isDngu=false;return}const site=sites.find(s=>Number(s.id)===Number(valid.SITE)),label=String(site?.SITES_nomenclature_UGECAM||'').trim();state.isSiege=/^SI[EÈ]GE\b/i.test(label);state.isDngu=/^DNGU\b/i.test(label)}catch(e){console.warn('Détection profil périmètre',e);state.isSiege=false;state.isDngu=false}}
function fieldInfo(col){for(const sec of CONFIG.sections){if(sec.notes_col===col)return{qid:col,question:'Notes générales',volet:sec.title,type:'Note générale'};for(const q of sec.questions){for(const f of q.fields)if(f.col===col)return{qid:q.id,question:q.question,volet:sec.title,type:f.col.endsWith('_Precisions')?'Précision':(f.col.includes('_Choix')?'Priorité':'Réponse')}}}return{qid:col,question:col,volet:'Autre',type:'Champ'}}
async function logChange(before,after,col,oldv,newv){if(!state.historyReady||String(oldv??'')===String(newv??''))return;const i=fieldInfo(col);try{await grist.docApi.applyUserActions([['AddRecord',H,null,{Site:after.id,Site_nom:after.gristHelper_Display||'',UGECAM:after.gristHelper_Display2||'',Volet:i.volet,Question_id:i.qid,Question:i.question,Type_champ:i.type,Ancienne_valeur:String(oldv??''),Nouvelle_valeur:String(newv??''),Auteur_contact:+after.Derniere_mise_a_jour_contact||0,Horodatage:Date.now()/1000}]])}catch(e){console.warn(e)}}
async function saveField(col,value,opts={}){if(!state.current)return;const quiet=opts.quiet===true,before={...state.current},oldv=before[col];if(String(oldv??'')===String(value??'')){state.dirty.delete(col);return}state.dirty.add(col);state.saving[col]='Enregistrement…';if(!quiet)render();try{await grist.docApi.applyUserActions([['UpdateRecord','Autodiagnostic',before.id,{[col]:value}]]);const latest=(await ft('Autodiagnostic')).filter(r=>!/^SI[EÈ]GE\b/i.test(String(r.gristHelper_Display||'').trim())&&!/^DNGU\b/i.test(String(r.gristHelper_Display||'').trim())),fresh=latest.find(r=>Number(r.id)===Number(before.id))||{...before,[col]:value};state.rows=latest;state.current=fresh;await logChange(before,fresh,col,oldv,value);state.saving[col]='Enregistré à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});state.dirty.delete(col);state.lastSync=new Date();if(!quiet){render();setTimeout(()=>{delete state.saving[col];render()},1300)}else{delete state.saving[col]}}catch(e){state.dirty.delete(col);state.saving[col]='Erreur : '+(e?.message||e);if(!quiet)render();else console.error(e)}}
function explanation(q){return q.explanation?`<div class="explain">${esc(q.explanation)}</div>`:''}
function qReadHtml(q){const row=state.current,isDone=answered(row,q);let control='';if(q.kind==='choice'){const val=row?.[q.fields[0].col],pf=q.fields[1],prec=pf?row?.[pf.col]:'';control=`<div class="choices"><span class="choice ${!empty(val)?'on':''}">${esc(val||'Non renseigné')}</span></div>${!empty(prec)?`<div class="readbox"><div class="readonlyLabel">Précisions</div>${esc(prec)}</div>`:''}`}else if(q.kind==='multichoice'){const vals=listVals(row?.[q.fields[0].col]),pf=q.fields[1],prec=pf?row?.[pf.col]:'';control=`<div class="choices">${vals.length?vals.map(v=>`<span class="choice on">${esc(v)}</span>`).join(''):'<span class="choice">Non renseigné</span>'}</div>${!empty(prec)?`<div class="readbox"><div class="readonlyLabel">Précisions</div>${esc(prec)}</div>`:''}`}else if(q.kind==='text'){const val=row?.[q.fields[0].col];control=`<div class="readbox">${esc(val||'Non renseigné')}</div>`}else{const fs=q.fields.slice(0,3),prec=row?.[q.fields[3].col];control=`<div class="prio">${fs.map((f,i)=>`<div><label>Choix ${i+1}</label><div class="readbox">${esc(row?.[f.col]||'Non renseigné')}</div></div>`).join('')}</div>${!empty(prec)?`<div class="readbox"><div class="readonlyLabel">${esc(q.free_label||'Précisions')}</div>${esc(prec)}</div>`:''}`}return`<div class="qcard ${isDone?'answered':''}"><div class="qhead"><div class="qtext">${esc(q.question)}</div></div>${explanation(q)}${control}</div>`}
function qHtml(q){const row=state.current,isDone=answered(row,q),saving=q.fields.map(f=>state.saving[f.col]).find(Boolean)||'';let control='';if(q.kind==='choice'){const f=q.fields[0],val=row?.[f.col],pf=q.fields[1];control=`<div class="choices">${q.choices.map(c=>`<button class="choice ${String(val)===String(c)?'on':''}" data-choice="${esc(f.col)}" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div>${pf?`<textarea class="prec" data-text="${esc(pf.col)}" placeholder="Précisions…">${esc(row?.[pf.col]||'')}</textarea>`:''}`}else if(q.kind==='multichoice'){const f=q.fields[0],selected=listVals(row?.[f.col]),pf=q.fields[1];control=`<div class="choices">${q.choices.map(c=>`<button class="choice ${selected.includes(String(c))?'on':''}" data-multi="${esc(f.col)}" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div>${pf?`<textarea class="prec" data-text="${esc(pf.col)}" placeholder="Précisions…">${esc(row?.[pf.col]||'')}</textarea>`:''}`}else if(q.kind==='text'){const f=q.fields[0];control=`<textarea class="prec" data-text="${esc(f.col)}" placeholder="Votre réponse…">${esc(row?.[f.col]||'')}</textarea>`}else{const fs=q.fields.slice(0,3),selected=fs.map(f=>String(row?.[f.col]||''));control=`<div class="prio">${fs.map((f,i)=>`<div><label>Choix ${i+1}</label><select data-prio="${esc(f.col)}"><option value="">Sélectionner…</option>${q.options.map(o=>`<option value="${esc(o)}" ${selected[i]===String(o)?'selected':''} ${selected.includes(String(o))&&selected[i]!==String(o)?'disabled':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div><textarea class="prec" data-text="${esc(q.fields[3].col)}" placeholder="${esc(q.free_label||'Précisions')}…">${esc(row?.[q.fields[3].col]||'')}</textarea>`}return`<div class="qcard ${isDone?'answered':''}"><div class="qhead"><div class="qtext">${esc(q.question)}</div><div class="saveState">${esc(saving)}</div></div>${explanation(q)}${control}</div>`}
function render(){if(!state.rows.length){app.innerHTML='<div class="loading">Aucun site d’autodiagnostic disponible.</div>';return}const row=state.current||state.rows[0];state.current=row;const sections=visibleSections();if(state.section>=sections.length)state.section=0;const sec=sections[state.section],all=counts(row),sc=counts(row,sec);app.innerHTML=`<div class="shell"><aside class="side"><div class="welcome"><div class="welcomeTitle">🌟 Bienvenue dans l’autodiagnostic autour des usages du DUI Airmes !</div><div class="welcomeText"><strong>📌 Objectifs</strong><ul><li>Donner aux référents projet DUI une meilleure visibilité sur les niveaux d’usage d’Airmes et les difficultés rencontrées.</li><li>Aider l’équipe projet et la MOAD DUI à identifier les actions d’accompagnement adaptées aux ESMS PH.</li></ul><strong>📝 Consignes</strong><ol><li>Sélectionnez le site à renseigner ci-dessous.</li><li>Choisissez une thématique puis complétez le formulaire. Vous pourrez y revenir ultérieurement.</li><li>Les professionnels habilités sur le même site peuvent corriger et compléter les réponses.</li></ol></div><div class="welcomeContact">Besoin d’aide ? <a href="mailto:moad.dui.ug-bfc@ugecam.assurance-maladie.fr">moad.dui.ug-bfc@ugecam.assurance-maladie.fr</a></div></div><div class="sideHead"><div class="title">Autodiagnostic 2026</div><div class="sub">${state.isDngu?'Saisie et suivi de tous les sites UGECAM':(state.isSiege?'Saisie et suivi des sites de votre UGECAM':'Réponse collaborative par site')}</div><select id="site" class="select">${state.rows.map(r=>`<option value="${r.id}" ${r.id===row.id?'selected':''}>${esc(r.gristHelper_Display||('Site '+r.id))}</option>`).join('')}</select><div class="progress"><div class="progressTop"><span>Progression globale</span><strong>${all.done}/${all.total} · ${all.pct}%</strong></div><div class="bar"><div class="fill" style="width:${all.pct}%"></div></div></div></div><div class="nav">${sections.map((s,i)=>{const c=counts(row,s);return`<button class="navBtn ${i===state.section?'active':''}" data-sec="${i}"><span>${esc(s.title)}</span><span class="count">${s.placeholder?'En préparation':(c.done+'/'+c.total+' · '+c.pct+'%')}</span></button>`}).join('')}</div></aside><section class="main"><div class="hero"><div class="siteName">${esc(row.gristHelper_Display||'Site')}</div><div class="meta">${esc(row.gristHelper_Display2||'')} · ${state.isDngu?'réponses du site · modifiables par la DNGU':(state.isSiege?'réponses du site · modifiables par le siège de l’UGECAM':'réponses partagées par les utilisateurs habilités du site')}</div><div class="status">${state.isDngu?'<span class="pill amber">🌐 Profil DNGU · saisie nationale</span>':(state.isSiege?'<span class="pill amber">🏢 Profil Siège · saisie sur les sites de l’UGECAM</span>':'<span class="pill green">✓ Sauvegarde champ par champ</span>')}<span class="pill">Dernière modification : ${esc(fmt(row.Derniere_mise_a_jour))}</span><span class="pill">Par : ${esc(row.Derniere_mise_a_jour_par||'—')}</span></div><div class="sync">Actualisation automatique toutes les 15 s${state.lastSync?' · dernière synchro '+state.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</div></div><div class="sectionHead"><div class="sectionTitle">${esc(sec.title)}</div><div class="sectionCount">${sec.placeholder?'Réservé aux professionnels affectés au Siège UGECAM':(sc.done+'/'+sc.total+' · '+sc.pct+'%')}</div></div>${sec.placeholder?'<div class="qcard"><div class="qtext">Volet en préparation</div><div class="explain">Les questions du « Questionnaire Siège UGECAM » seront ajoutées ultérieurement. Ce volet est visible uniquement pour les professionnels ayant une affectation SIEGE.</div></div>':sec.questions.map(qHtml).join('')}${sec.notes_col?`<div class="note"><div class="qtext">Notes générales sur le bloc fonctionnel</div><textarea class="prec" data-text="${esc(sec.notes_col)}" placeholder="Notes générales…">${esc(row?.[sec.notes_col]||'')}</textarea></div>`:''}</section></div>`;bind()}
function bind(){document.getElementById('site')?.addEventListener('change',e=>{state.current=state.rows.find(r=>Number(r.id)===Number(e.target.value));state.section=0;render()});document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{state.section=Number(b.dataset.sec);render()});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>saveField(b.dataset.choice,b.dataset.value));document.querySelectorAll('[data-multi]').forEach(b=>b.onclick=()=>{const col=b.dataset.multi,val=String(b.dataset.value),cur=listVals(state.current?.[col]),next=cur.includes(val)?cur.filter(x=>x!==val):[...cur,val];saveField(col,['L',...next])});document.querySelectorAll('[data-prio]').forEach(s=>s.onchange=()=>saveField(s.dataset.prio,s.value));document.querySelectorAll('[data-text]').forEach(t=>{let timer;t.oninput=()=>{state.dirty.add(t.dataset.text);clearTimeout(timer);timer=setTimeout(()=>saveField(t.dataset.text,t.value,{quiet:true}),60000)};t.onblur=()=>{clearTimeout(timer);if(state.dirty.has(t.dataset.text))saveField(t.dataset.text,t.value,{quiet:true})}})}
async function pull(){if(!state.current||state.dirty.size)return;try{const latest=(await ft('Autodiagnostic')).filter(r=>!/^SI[EÈ]GE\b/i.test(String(r.gristHelper_Display||'').trim())&&!/^DNGU\b/i.test(String(r.gristHelper_Display||'').trim())),fresh=latest.find(r=>Number(r.id)===Number(state.current.id));if(fresh){state.rows=latest;state.current=fresh;state.lastSync=new Date();render()}}catch(e){console.warn(e)}}
(async()=>{try{await grist.ready({requiredAccess:'full'});CONFIG=await loadConfig();await ensureHistory();await detectOwner();await detectSiege();state.rows=(await ft('Autodiagnostic')).filter(r=>!/^SI[EÈ]GE\b/i.test(String(r.gristHelper_Display||'').trim())&&!/^DNGU\b/i.test(String(r.gristHelper_Display||'').trim()));state.current=state.rows[0]||null;render();setInterval(pull,15000)}catch(e){app.innerHTML='<div class="error">'+esc(e?.message||e)+'</div>'}})();
</script></body></html>
